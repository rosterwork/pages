name: Deploy Site

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy_site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Pages
      uses: actions/configure-pages@v4

    # Armazém do app (service worker): carimba a versão desta publicação e a lista dos arquivos
    # que o aparelho guarda, cada um com a impressão digital (o que mudou é baixado de novo).
    # Sob demanda (guardadas no primeiro uso, nunca na instalação): as bibliotecas.
    # Fora das listas: as imagens do manual (guardadas ao usar) e os logos de acervo.
    - name: Carimbar o armazém do app
      run: |
        node - <<'FIM'
        const fs = require('fs');
        const crypto = require('crypto');
        const { execSync } = require('child_process');
        const tipos = /\.(html|css|js|svg|woff2?|webmanifest)$/;
        const fora = /^(\.github\/|manual\/imagens\/|logos\/(?!aplicativo-))/;
        const sobDemanda = /^bibliotecas\//;
        const arquivos = {};
        const demanda = {};
        execSync('git ls-files', { encoding: 'utf8' }).split('\n').filter(Boolean).forEach((caminho) => {
          const icone = /^logos\/aplicativo-[^/]+\.png$/.test(caminho);
          if (caminho === 'aplicativo-armazem.js' || fora.test(caminho) || !(tipos.test(caminho) || icone)) return;
          const impressao = crypto.createHash('sha1').update(fs.readFileSync(caminho)).digest('hex').slice(0, 12);
          (sobDemanda.test(caminho) ? demanda : arquivos)[caminho] = impressao;
        });
        const versao = process.env.GITHUB_SHA.slice(0, 8) + '-' + process.env.GITHUB_RUN_NUMBER;
        const arquivo = 'aplicativo-armazem.js';
        const original = fs.readFileSync(arquivo, 'utf8');
        const carimbado = original
          .replace("'__VERSAO__'", () => JSON.stringify(versao))
          .replace('{/*__ARQUIVOS__*/}', () => JSON.stringify(arquivos))
          .replace('{/*__SOB_DEMANDA__*/}', () => JSON.stringify(demanda));
        fs.writeFileSync(arquivo, carimbado);
        console.log(carimbado === original ? 'armazém sem carimbo (desligado)' : 'armazém ' + versao + ': ' + Object.keys(arquivos).length + ' arquivos, ' + Object.keys(demanda).length + ' sob demanda');
        FIM

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4