name: Deploy Site

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy_site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Pages
      uses: actions/configure-pages@v4

    # Ícones: o icones/todos.svg (o que as páginas usam) é montado de novo a partir dos icone-*.svg, onde cada
    # ícone é desenhado; o publicado nunca fica diferente deles. Roda antes do carimbo, que tira a impressão
    # digital do arquivo montado. O mesmo código remonta o todos.svg no computador quando um ícone muda.
    - name: Montar os ícones num arquivo só
      run: |
        node - <<'FIM'
        const fs = require('fs');
        const nomes = fs.readdirSync('icones').filter((n) => /^icone-[a-z0-9-]+\.svg$/.test(n)).sort();
        const estilos = [];
        const simbolos = nomes.map((n) => {
          const texto = fs.readFileSync('icones/' + n, 'utf8');
          const estilo = texto.match(/<style>[\s\S]*?<\/style>/);
          if (estilo) estilos.push('  ' + estilo[0].trim());
          const simbolo = texto.match(/<symbol\b[\s\S]*?<\/symbol>/);
          if (!simbolo) throw new Error('sem <symbol>: ' + n);
          return '  ' + simbolo[0].trim();
        });
        const todos = '<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">\n'
          + '  <!-- montado a partir dos arquivos icones/icone-*.svg, onde cada ícone é desenhado; não editar aqui -->\n'
          + estilos.concat(simbolos).join('\n') + '\n</svg>\n';
        fs.writeFileSync('icones/todos.svg', todos);
        console.log('todos.svg: ' + nomes.length + ' ícones, ' + todos.length + ' bytes');
        FIM

    # Armazém do app (service worker): carimba a versão desta publicação e a lista dos arquivos
    # que o aparelho guarda, cada um com a impressão digital (o que mudou é baixado de novo).
    # Sob demanda (guardadas no primeiro uso, nunca na instalação): as bibliotecas e as imagens do manual.
    # Fora das listas: os logos de acervo.
    - name: Carimbar o armazém do app
      run: |
        node - <<'FIM'
        const fs = require('fs');
        const crypto = require('crypto');
        const { execSync } = require('child_process');
        const tipos = /\.(html|css|js|svg|woff2?|webmanifest)$/;
        const fora = /^(\.github\/|logos\/(?!aplicativo-))/;
        const sobDemanda = /^(bibliotecas\/.+\.js|manual\/imagens\/.+\.png)$/;
        const arquivos = {};
        const demanda = {};
        execSync('git ls-files', { encoding: 'utf8' }).split('\n').filter(Boolean).forEach((caminho) => {
          const icone = /^logos\/aplicativo-[^/]+\.png$/.test(caminho);
          if (caminho === 'aplicativo-armazem.js' || fora.test(caminho) || !(tipos.test(caminho) || icone || sobDemanda.test(caminho))) return;
          const impressao = crypto.createHash('sha1').update(fs.readFileSync(caminho)).digest('hex').slice(0, 12);
          (sobDemanda.test(caminho) ? demanda : arquivos)[caminho] = impressao;
        });
        const versao = process.env.GITHUB_SHA.slice(0, 8) + '-' + process.env.GITHUB_RUN_NUMBER;
        const arquivo = 'aplicativo-armazem.js';
        const original = fs.readFileSync(arquivo, 'utf8');
        const carimbado = original
          .replace("'__VERSAO__'", () => JSON.stringify(versao))
          .replace('{/*__ARQUIVOS__*/}', () => JSON.stringify(arquivos))
          .replace('{/*__SOB_DEMANDA__*/}', () => JSON.stringify(demanda));
        fs.writeFileSync(arquivo, carimbado);
        console.log(carimbado === original ? 'armazém sem carimbo (desligado)' : 'armazém ' + versao + ': ' + Object.keys(arquivos).length + ' arquivos, ' + Object.keys(demanda).length + ' sob demanda');
        FIM

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4