<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Treinamento</h1>
    </div>
  </div>

  <!-- o Continuar os treinos (começa o primeiro ainda sem Visto, que o A seguir diz qual é; os dois somem com todos feitos)
       e a busca da lista: o que a pessoa quer fazer (filtra pelo nome do treino) -->
  <div class="pagina-subcabecalho">
    <button type="button" class="botao botao--primario oculto" id="treino-continuar">Continuar os treinos</button>
    <span class="treino-seguinte oculto">A seguir: <strong class="treino-seguinte-nome"></strong></span>
    <div class="busca" id="treino-busca">
      <span class="busca-modo" aria-hidden="true">
        <svg class="icone" width="16" height="16"><use href="icones/todos.svg#icone-pesquisar"/></svg>
      </span>
      <input type="text" class="busca-entrada" maxlength="100" enterkeyhint="search" placeholder="O que você quer fazer?" aria-label="O que você quer fazer?" />
      <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
      </button>
    </div>
  </div>

  <!-- a lista dos treinos (os roteiros do passo a passo, geral-guia-roteiros.js), na coluna de leitura: para todos e,
       depois do traço, os do administrador; um bloco por tela (o desenho dos blocos dos Ajustes, componente geral-bloco),
       que abre e fecha pelo chevron do nome (um aberto por vez), com os treinos dela dentro. Campo sem chevron começa o treino no modo treino
       (geral-treino.js); com chevron, abre ali mesmo com as opções -->
  <div class="pagina-corpo">
    <div class="pedido-secoes coluna-leitura">
      <div class="nota">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-treinamento"/></svg>
        <span class="nota-texto">Escolha o que você quer aprender. O passo a passo leva você pelo sistema de verdade, desde o menu. No treino, nada do que você fizer é salvo.</span>
      </div>
      <div class="treino-area" data-treino-area="todos"></div>
      <div class="treino-divisor" data-treino-area="admin"></div>
      <div class="treino-area" data-treino-area="admin">
        <span class="treino-area-titulo">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ferramenta"/></svg>
          Administrador
        </span>
      </div>
      <div class="pedido-vazio treino-vazio oculto">Nenhum treino com esse nome.</div>
    </div>
  </div>
</div>

<!-- um bloco por tela (Escala, Trocas): o nome da tela no alto, com o chevron que abre e fecha o bloco, e os treinos
     dela dentro (começa fechado; o JS abre o primeiro) -->
<template id="tpl-treino-bloco">
  <section class="bloco treino-bloco">
    <button type="button" class="bloco-titulo bloco-cabecalho" aria-expanded="false">
      <svg class="icone treino-bloco-icone" width="14" height="14" aria-hidden="true"><use href=""/></svg>
      <span class="rotulo-secao bloco-nome"></span>
      <span class="espacador-flex"></span>
      <svg class="icone bloco-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="bloco-corpo oculto"></div>
  </section>
</template>

<!-- um treino: o campo sem chevron começa o treino; o número à esquerda e o Visto à direita -->
<template id="tpl-treino-item">
  <div class="bloco-campo treino-item">
    <button type="button" class="bloco-campo-cabecalho">
      <span class="treino-numero"></span>
      <span class="bloco-campo-titulo treino-item-titulo"></span>
      <span class="espacador-flex"></span>
      <span class="selo selo--sucesso treino-item-visto oculto">Visto</span>
    </button>
  </div>
</template>

<!-- um conjunto de treinos (ex.: Ajustar o dia e salvar): o campo com chevron abre e fecha ali mesmo, com as opções
     dentro; o Visto só vem com todas as opções concluídas -->
<template id="tpl-treino-conjunto">
  <div class="bloco-campo treino-conjunto">
    <button type="button" class="bloco-campo-cabecalho" aria-expanded="false">
      <span class="bloco-campo-titulo treino-conjunto-titulo"></span>
      <span class="espacador-flex"></span>
      <span class="selo selo--sucesso treino-conjunto-visto oculto">Visto</span>
      <svg class="icone bloco-campo-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="bloco-campo-opcoes treino-conjunto-lista oculto"></div>
  </div>
</template>

<!-- uma opção do conjunto: o número, o nome e o Visto; clicar começa o treino dela -->
<template id="tpl-treino-opcao">
  <button type="button" class="dropdown-item treino-opcao">
    <span class="treino-numero"></span>
    <span class="treino-opcao-titulo"></span>
    <span class="espacador-flex"></span>
    <span class="selo selo--sucesso treino-opcao-visto oculto">Visto</span>
  </button>
</template>
