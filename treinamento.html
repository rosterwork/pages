<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Treinamento</h1>
    </div>
  </div>

  <!-- a busca da lista: o que a pessoa quer fazer (filtra pelo nome do treino) -->
  <div class="pagina-subcabecalho">
    <div class="busca" id="treino-busca">
      <span class="busca-modo" aria-hidden="true">
        <svg class="icone" width="16" height="16"><use href="icones/todos.svg#icone-pesquisar"/></svg>
      </span>
      <input type="text" class="busca-entrada" maxlength="100" enterkeyhint="search" placeholder="O que você quer fazer?" aria-label="O que você quer fazer?" />
      <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
      </button>
    </div>
  </div>

  <!-- a lista dos treinos (os roteiros do passo a passo, geral-guia-roteiros.js), na coluna de leitura: para todos e,
       depois do traço, os do administrador; cada um com o grupo (a seção), onde fica ou quantos caminhos tem e o
       Visto. Clicar começa o treino no modo treino (geral-treino.js) -->
  <div class="pagina-corpo">
    <div class="pedido-secoes coluna-leitura">
      <div class="nota">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-treinamento"/></svg>
        <span class="nota-texto">Escolha o que você quer aprender. O passo a passo leva você pelo sistema de verdade, desde o menu. No treino, nada do que você fizer é salvo.</span>
      </div>
      <div class="treino-area" data-treino-area="todos"></div>
      <div class="treino-divisor" data-treino-area="admin"></div>
      <div class="treino-area" data-treino-area="admin">
        <span class="treino-area-titulo">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ferramenta"/></svg>
          Administrador
        </span>
      </div>
      <div class="pedido-vazio treino-vazio oculto">Nenhum treino com esse nome.</div>
    </div>
  </div>
</div>

<!-- uma seção da lista (Escala, Trocas): o rótulo e os treinos dela -->
<template id="tpl-treino-secao">
  <div class="pedido-secao">
    <span class="rotulo-secao"></span>
    <div class="pedido-lista"></div>
  </div>
</template>

<!-- um treino: o ícone, o nome, onde fica (ou quantos caminhos), o Visto e a seta -->
<template id="tpl-treino-item">
  <button type="button" class="pedido pedido--linha treino-item">
    <svg class="icone pedido-linha-icone" width="18" height="18" aria-hidden="true"><use href=""/></svg>
    <span class="pedido-textos">
      <span class="pedido-quem treino-item-titulo"></span>
      <span class="pedido-meta treino-item-meta"></span>
    </span>
    <span class="espacador-flex"></span>
    <span class="selo selo--sucesso pedido-linha-selo treino-item-visto oculto">Visto</span>
    <svg class="icone pedido-linha-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
  </button>
</template>

<!-- um conjunto de treinos (ex.: Ajustar o dia e salvar): a linha abre e fecha ali mesmo, como o pedido da Pendências, com
     as opções dentro (o rótulo e as linhas); o Visto da linha só vem com todas as opções concluídas -->
<template id="tpl-treino-conjunto">
  <div class="pedido pedido--expansivel treino-conjunto">
    <button type="button" class="pedido--linha pedido-expansivel-cabeca" aria-expanded="false">
      <svg class="icone pedido-linha-icone" width="18" height="18" aria-hidden="true"><use href=""/></svg>
      <span class="pedido-textos">
        <span class="pedido-quem treino-conjunto-titulo"></span>
        <span class="pedido-meta treino-conjunto-meta"></span>
      </span>
      <span class="espacador-flex"></span>
      <span class="selo selo--sucesso pedido-linha-selo treino-conjunto-visto oculto">Visto</span>
      <svg class="icone pedido-linha-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="pedido-resumo oculto">
      <span class="pedido-resumo-recuo-icone"></span>
      <div class="pedido-resumo-corpo">
        <div class="pedido-resumo-conteudo">
          <span class="rotulo-secao treino-conjunto-rotulo"></span>
          <div class="pedido-resumo-lista treino-conjunto-lista"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- uma opção do conjunto: o nome, o Visto e a seta; clicar começa o treino dela -->
<template id="tpl-treino-opcao">
  <button type="button" class="dropdown-item treino-opcao">
    <span class="treino-opcao-titulo"></span>
    <span class="espacador-flex"></span>
    <span class="selo selo--sucesso treino-opcao-visto oculto">Visto</span>
    <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
  </button>
</template>
