<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Postos</h1>
    </div>
    <!-- ajuda da tela: os passo a passo desta página e o manual (componente geral-guia) -->
    <div class="dropdown pagina-ajuda" data-manual="postos">
      <button type="button" class="botao botao--icone" aria-label="Ajuda desta tela" data-dica="Ajuda">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      </button>
      <div class="dropdown-menu pagina-ajuda-menu"></div>
    </div>
    <div class="abas" id="postos-abas">
      <button type="button" class="aba aba--ativa" data-aba="instalacoes">Instalações</button>
      <button type="button" class="aba" data-aba="viaturas">Viaturas</button>
    </div>
  </div>

  <div class="pagina-corpo pagina-corpo--camada">
    <div class="pagina-corpo-rolagem">
      <!-- aba Instalações: árvore de unidades com os cards das instalações -->
      <div class="postos-painel" data-aba-painel="instalacoes">
        <div class="arvore arvore-unidades" id="arvore-postos"></div>
      </div>
      <!-- aba Viaturas: árvore de unidades com os cards das viaturas -->
      <div class="postos-painel oculto" data-aba-painel="viaturas">
        <div class="arvore arvore-unidades" id="arvore-viaturas"></div>
      </div>
    </div>
  </div>
</div>

<!-- molde: fileira (flex-wrap) que recebe os cards e o grupo Administração -->
<template id="tpl-postos-cards">
  <div class="postos-cards"></div>
</template>

<!-- molde: card de uma instalação dentro da unidade marcada -->
<template id="tpl-posto-cartao">
  <div class="posto-cartao" role="button" tabindex="0">
    <div class="posto-cabecalho">
      <svg class="icone posto-icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-instalacao"/></svg>
      <span class="posto-nome"></span>
    </div>
    <div class="posto-corpo">
      <div class="posto-status">
        <span class="selo"></span>
        <span class="posto-periodo"></span>
      </div>
      <span class="posto-mudanca oculto"></span>
      <div class="posto-dados"></div>
    </div>
  </div>
</template>

<!-- molde: linha de dado (rótulo + valor) dentro de .posto-dados -->
<template id="tpl-posto-dado">
  <div class="posto-dado">
    <span class="posto-dado-rotulo"></span>
    <span class="posto-dado-valor"></span>
  </div>
</template>

<!-- molde: unidade marcada que não tem instalações (não é CIA/PEL) -->
<template id="tpl-postos-vazio">
  <div class="postos-vazio">Esta unidade não possui instalações.</div>
</template>

<!-- molde: grupo Administração no fim da fileira de cards (só admin): Adicionar instalação.
     No computador, o bloco cinza com o rótulo; no celular, o botão "Administração", que abre o menu -->
<template id="tpl-posto-adicionar">
  <div class="dropdown acoes-admin">
    <button type="button" class="botao acoes-admin-gatilho">
      <span>Administração</span>
      <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="dropdown-menu acoes-admin-menu">
      <span class="rotulo-secao acoes-admin-rotulo">Administração</span>
      <button type="button" class="botao"><span class="etiqueta-adm">ADM</span>Adicionar instalação</button>
    </div>
  </div>
</template>

<!-- molde: item do seletor de instalação (montado pelo JS com os nomes sugeridos) -->
<template id="tpl-ai-opcao">
  <button type="button" class="dropdown-item"></button>
</template>

<!-- MOLDES: painel lateral de edição de instalação (lógica em postos-painel.js) -->

<!-- molde: nome da instalação no subcabeçalho do painel (o JS preenche) -->
<template id="tpl-posto-painel-titulo">
  <span class="rotulo-secao"></span>
</template>

<!-- molde: linha editável do Estado (Ativo/Inativo) -->
<template id="tpl-posto-editar-estado">
  <div class="campo">
    <span class="campo-rotulo">Estado</span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto"></span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu">
        <button type="button" class="dropdown-item" data-valor="Ativo">Ativo</button>
        <button type="button" class="dropdown-item" data-valor="Inativo">Inativo</button>
      </div>
    </div>
  </div>
</template>



<!-- molde: caixa "Mudanças marcadas" do painel (estado ou exclusão com data futura; itens via
     #tpl-posto-mudanca-item, lógica em postos-mudancas.js — instalação e viatura) -->
<template id="tpl-posto-mudancas">
  <div class="grupo-caixa">
    <span class="rotulo-secao">Mudanças marcadas</span>
  </div>
</template>



<!-- molde: uma mudança marcada (texto + Cancelar) -->
<template id="tpl-posto-mudanca-item">
  <div class="linha-info">
    <span class="posto-mudanca-textos">
      <span class="linha-info-rotulo"></span>
      <!-- a mudança abriu um período na Distribuição que ainda não foi revisado -->
      <span class="selo selo--alerta posto-mudanca-revisar oculto">Revisar na Distribuição</span>
    </span>
    <button type="button" class="botao botao--texto posto-mudanca-cancelar">Cancelar</button>
  </div>
</template>

<!-- molde: rodapé do painel (Cancelar / Salvar) — mesmo padrão do Editar de escalas -->
<template id="tpl-posto-painel-acoes">
  <button type="button" class="botao posto-painel-cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario posto-painel-salvar" disabled>Salvar</button>
</template>

<!-- molde: linha editável "Instalação" (modo criação do painel; o menu é preenchido pelo
     JS com os nomes sugeridos de proximos_numeros_instalacao, via #tpl-ai-opcao) -->
<template id="tpl-posto-novo-instalacao">
  <div class="campo">
    <span class="campo-rotulo">Instalação</span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu"></div>
    </div>
  </div>
</template>

<!-- ==========================================================================
     MOLDES: aba Viaturas — cards (postos-viaturas.js) e painel de editar/criar,
     transferir e excluir (postos-viaturas-painel.js / postos-viaturas-transferir.js);
     o prefixo, a CNH e o efetivo vêm do componente geral-posto-editar (moldes no index.html)
     ========================================================================== -->

<!-- molde: card de uma viatura dentro da unidade marcada (prefixo + selo de status ou "Substituída até" + período +
     a próxima mudança ou a viatura que está no lugar + CNH + guarnição) -->
<template id="tpl-viatura-cartao">
  <div class="posto-cartao" role="button" tabindex="0">
    <div class="posto-cabecalho">
      <svg class="icone posto-icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-viatura"/></svg>
      <span class="posto-nome"></span>
    </div>
    <div class="posto-corpo">
      <div class="posto-status">
        <span class="selo"></span>
        <span class="posto-periodo"></span>
      </div>
      <span class="posto-mudanca oculto"></span>
      <div class="posto-dados"></div>
    </div>
  </div>
</template>

<!-- molde: unidade marcada que não tem viaturas -->
<template id="tpl-viatura-vazio">
  <div class="postos-vazio">Esta unidade não possui viaturas.</div>
</template>

<!-- molde: grupo Administração no fim da fileira de cards de viatura (só admin): Adicionar viatura -->
<template id="tpl-viatura-adicionar">
  <div class="dropdown acoes-admin">
    <button type="button" class="botao acoes-admin-gatilho">
      <span>Administração</span>
      <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="dropdown-menu acoes-admin-menu">
      <span class="rotulo-secao acoes-admin-rotulo">Administração</span>
      <button type="button" class="botao"><span class="etiqueta-adm">ADM</span>Adicionar viatura</button>
    </div>
  </div>
</template>



<!-- molde: linha editável do Estado (Ativo/Inativo; a viatura reserva é Ativa com mínimo 0) -->
<template id="tpl-viatura-editar-status">
  <div class="campo">
    <span class="campo-rotulo">Estado</span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto"></span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu">
        <button type="button" class="dropdown-item" data-valor="Ativo">Ativo</button>
        <button type="button" class="dropdown-item" data-valor="Inativo">Inativo</button>
      </div>
    </div>
  </div>
</template>





<!-- molde: as viaturas que já serviram neste posto (o grupo Anteriores, do geral-anteriores, começa fechado) -->
<template id="tpl-viatura-anteriores">
  <div class="grupo-caixa"></div>
</template>

<!-- molde: uma viatura anterior (prefixo e CNH à esquerda; de quando a quando à direita) -->
<template id="tpl-viatura-anterior">
  <div class="linha-info">
    <span class="linha-info-rotulo"></span>
    <span class="linha-info-valor"></span>
  </div>
</template>

<!-- molde: seção "Transferir" (edição; origem + seletor de unidade de destino + botão) -->
<template id="tpl-viatura-transferir">
  <div class="linha-info">
    <span class="linha-info-rotulo">De</span>
    <span class="linha-info-valor" data-origem></span>
  </div>
  <div class="campo">
    <span class="campo-rotulo">Para</span>
    <div class="dropdown" data-transferir-dropdown>
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto campo-selecao-texto--vazio" data-transferir-texto>Selecione a unidade</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu dropdown-menu--largo">
        <div class="dropdown-menu-rolagem">
          <div class="arvore" data-transferir-arvore></div>
        </div>
      </div>
    </div>
  </div>
  <button type="button" class="botao botao--primario" data-transferir-botao disabled>Transferir</button>
</template>



<!-- molde: botão Excluir viatura (ação crítica; dentro da seção do rodapé do painel) -->
<template id="tpl-viatura-excluir-botao">
  <button type="button" class="botao botao--perigo">Excluir viatura</button>
</template>

<!-- molde: botão Excluir instalação (mesma ação crítica; vale a partir da data do modal) -->
<template id="tpl-instalacao-excluir-botao">
  <button type="button" class="botao botao--perigo">Excluir instalação</button>
</template>

<!-- molde: rodapé do painel de viatura (Cancelar / Salvar) -->
<template id="tpl-viatura-painel-acoes">
  <button type="button" class="botao viatura-painel-cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario viatura-painel-salvar" disabled>Salvar</button>
</template>
