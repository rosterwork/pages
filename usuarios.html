<!-- molde: formulário Novo usuário — abre no painel direito (lógica em usuarios-novo-usuario.js) -->
<template id="tpl-novo-usuario">
  <div class="painel-secao">
    <button type="button" class="painel-secao-cabecalho" aria-expanded="true">
      <span class="rotulo-secao">Dados pessoais</span>
      <svg class="icone painel-secao-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="painel-secao-corpo">
      <label class="campo">
        <span class="campo-rotulo">Nome completo</span>
        <input class="campo-entrada" id="nu-nome-completo" type="text" maxlength="100" placeholder="Ex.: João Carlos Andrade" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">CPF</span>
        <input class="campo-entrada" id="nu-cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">RG</span>
        <input class="campo-entrada" id="nu-rg" type="text" inputmode="numeric" maxlength="13" placeholder="00.000.000-0" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Data de nascimento</span>
        <input class="campo-entrada" id="nu-nascimento" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" />
        <span class="campo-erro-texto"></span>
      </label>
      <div class="campo">
        <span class="campo-rotulo">CNH</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="nu-cnh">
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item" data-valor="Nenhuma">Nenhuma</button>
            <button type="button" class="dropdown-item" data-valor="A">A</button>
            <button type="button" class="dropdown-item" data-valor="B">B</button>
            <button type="button" class="dropdown-item" data-valor="C">C</button>
            <button type="button" class="dropdown-item" data-valor="D">D</button>
            <button type="button" class="dropdown-item" data-valor="E">E</button>
            <button type="button" class="dropdown-item" data-valor="AB">AB</button>
            <button type="button" class="dropdown-item" data-valor="AC">AC</button>
            <button type="button" class="dropdown-item" data-valor="AD">AD</button>
            <button type="button" class="dropdown-item" data-valor="AE">AE</button>
          </div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <label class="campo">
        <span class="campo-rotulo">Celular</span>
        <input class="campo-entrada" id="nu-celular" type="text" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">E-mail</span>
        <input class="campo-entrada" id="nu-email" type="text" maxlength="80" placeholder="nome@exemplo.com" />
        <span class="campo-erro-texto"></span>
      </label>
    </div>
  </div>

  <div class="painel-secao">
    <button type="button" class="painel-secao-cabecalho" aria-expanded="true">
      <span class="rotulo-secao">Dados institucionais</span>
      <svg class="icone painel-secao-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="painel-secao-corpo">
      <div class="campo">
        <span class="campo-rotulo">Tipo</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="nu-tipo">
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu" id="nu-tipo-menu"></div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Posto / Patente</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="nu-posto" disabled>
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione o tipo antes</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu" id="nu-posto-menu"></div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <label class="campo">
        <span class="campo-rotulo">Nome de guerra</span>
        <input class="campo-entrada" id="nu-nome-guerra" type="text" maxlength="40" placeholder="Ex.: Andrade" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Data de inclusão</span>
        <input class="campo-entrada" id="nu-inclusao" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo" id="nu-colocacao-rotulo">Colocação</span>
        <input class="campo-entrada" id="nu-colocacao" type="text" inputmode="numeric" maxlength="4" placeholder="Selecione o tipo antes" disabled />
        <span class="campo-erro-texto"></span>
      </label>
      <div class="campo">
        <span class="campo-rotulo">Setor atual</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="nu-setor">
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item" data-valor="Operacional">Operacional</button>
            <button type="button" class="dropdown-item" data-valor="Administrativo">Administrativo</button>
          </div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Lotação atual</span>
        <div class="dropdown" id="nu-lotacao-dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="nu-lotacao">
            <span class="campo-selecao-texto campo-selecao-texto--vazio" id="nu-lotacao-texto">Selecione uma unidade</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu dropdown-menu--largo">
            <div class="dropdown-menu-rolagem">
              <div class="arvore" id="nu-lotacao-arvore"></div>
            </div>
          </div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
    </div>
  </div>

  <div class="painel-secao oculto" id="nu-promocoes-secao">
    <button type="button" class="painel-secao-cabecalho" aria-expanded="true">
      <span class="rotulo-secao">Datas de promoções</span>
      <svg class="icone painel-secao-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="painel-secao-corpo" id="nu-promocoes"></div>
  </div>

<template id="tpl-usuarios-sem-conta">
  <div class="ficha-observacao">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-cadeado.svg#icone-cadeado"/></svg>
    <span>Sem acesso ao sistema. Cadastrado sem conta de login, não participa de trocas, folgas nem extrajornada até criar a própria conta.</span>
  </div>
</template>

<template id="tpl-usuarios-baixa-botao">
  <button type="button" class="botao botao--perigo">Excluir do sistema</button>
</template>

<!-- molde: botão de redefinir senha (aba Dados, modo Editar do admin) -->
<template id="tpl-usuarios-redefinir-senha-botao">
  <button type="button" class="botao botao--perigo">Redefinir senha</button>
</template>

<!-- molde: botão de readmissão (aba Carreira, modo Editar do admin, militar inativo) -->
<template id="tpl-usuarios-readmitir-botao">
  <button type="button" class="botao botao--primario">Readmitir ao efetivo</button>
</template>

<!-- molde: seção Transferir (aba Carreira, modo Editar do admin) — origem + seletor de unidade + botão -->
<template id="tpl-usuarios-transferir">
  <div class="linha-info">
    <span class="linha-info-rotulo">De</span>
    <span class="linha-info-valor" data-origem></span>
  </div>
  <div class="campo">
    <span class="campo-rotulo">Para</span>
    <div class="dropdown" data-transferir-dropdown>
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto campo-selecao-texto--vazio" data-transferir-texto>Selecione a unidade</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu dropdown-menu--largo">
        <div class="dropdown-menu-rolagem">
          <div class="arvore" data-transferir-arvore></div>
        </div>
      </div>
    </div>
  </div>
  <label class="campo">
    <span class="campo-rotulo">A partir de</span>
    <input class="campo-entrada" type="text" name="transferir-data" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" data-transferir-data />
    <span class="campo-erro-texto"></span>
  </label>
  <button type="button" class="botao botao--primario" data-transferir-botao disabled>Transferir</button>
</template>

<!-- molde: seção Promover (aba Carreira, modo Editar do admin) — Tipo + hierarquia automática + data -->
<template id="tpl-usuarios-promover">
  <div class="campo">
    <span class="campo-rotulo">Tipo</span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao" data-promover-tipo>
        <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu"></div>
    </div>
  </div>
  <div class="linha-info">
    <span class="linha-info-rotulo">Promovido a</span>
    <span class="linha-info-valor" data-promover-hierarquia>-</span>
  </div>
  <label class="campo">
    <span class="campo-rotulo">Data da promoção</span>
    <input class="campo-entrada" type="text" name="promover-data" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" data-promover-data />
    <span class="campo-erro-texto"></span>
  </label>
  <button type="button" class="botao botao--primario" data-promover-botao disabled>Promover</button>
</template>

<!-- molde: campo editável de texto (aba Dados, modo Editar) -->
<template id="tpl-ficha-campo">
  <label class="campo">
    <span class="campo-rotulo"></span>
    <input class="campo-entrada" type="text" name="ficha-campo" />
    <span class="campo-erro-texto"></span>
  </label>
</template>

<!-- molde: campo editável de seleção (CNH, Setor) -->
<template id="tpl-ficha-campo-selecao">
  <div class="campo">
    <span class="campo-rotulo"></span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto"></span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu"></div>
    </div>
    <span class="campo-erro-texto"></span>
  </div>
</template>

<!-- molde: rodapé de ações do Editar (Cancelar / Salvar) -->
<template id="tpl-ficha-editar-acoes">
  <button type="button" class="botao ficha-editar-cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario ficha-editar-salvar">Salvar</button>
</template>
