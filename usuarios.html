<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Usuários</h1>
      <span class="pagina-titulo-contagem"></span>
    </div>
    <div class="abas" id="usuarios-abas">
      <button type="button" class="aba aba--ativa" data-aba="efetivo">Efetivo</button>
      <!-- só administrador: cadastros e correções de dados para aprovar (a mesma fila da página Pendências) -->
      <button type="button" class="aba oculto" data-aba="pendencias" id="usuarios-aba-pendencias">
        <span>Pendências</span>
        <span class="selo aba-contagem oculto" id="usuarios-pendencias-contagem"></span>
      </button>
    </div>
  </div>

  <!-- barra sempre presente: à esquerda a ação (Novo usuário, só admin), à direita os filtros, a busca, Ordenar e Exibir
       (da aba Efetivo); o conteúdo não "pula" ao trocar de aba -->
  <div class="pagina-subcabecalho">
    <button type="button" class="botao botao--primario oculto" id="btn-novo-usuario">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-novo-usuario.svg#icone-novo-usuario"/></svg>
      <span>Novo usuário</span>
    </button>
    <span class="espacador-flex"></span>

    <div class="usuarios-filtros" id="usuarios-filtros">
    <svg class="icone filtro-funil" id="filtro-funil" width="16" height="16" aria-hidden="true"><use href="icones/icone-filtrar.svg#icone-filtrar"/></svg>

    <div class="dropdown" id="dropdown-graus">
      <button type="button" class="seletor" id="graus-seletor">
        <span class="seletor-texto" id="graus-texto">Todos os graus</span>
        <span class="seletor-limpar" id="graus-limpar" data-dica="Limpar">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
        </span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu">
        <div class="dropdown-titulo">Graus</div>
        <div id="graus-conteudo">
          <div class="arvore-linha" id="graus-todos">
            <span class="arvore-seta arvore-seta--oculta" aria-hidden="true"><svg class="icone" width="12" height="12"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg></span>
            <button type="button" class="caixa-selecao" role="checkbox" aria-checked="true">
              <svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
            </button>
            <span class="arvore-nome">Todos</span>
          </div>
          <div class="dropdown-divisor"></div>
          <div class="arvore" id="graus-arvore"></div>
        </div>
        <span class="campo-ajuda oculto" id="graus-vazio">Selecione unidades para ver os graus.</span>
      </div>
    </div>

    <div class="dropdown" id="dropdown-situacao">
      <button type="button" class="seletor" id="situacao-seletor">
        <span class="seletor-texto" id="situacao-texto">Todas as situações</span>
        <span class="seletor-limpar" id="situacao-limpar" data-dica="Limpar">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
        </span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu">
        <div class="dropdown-titulo">Situação</div>
        <div class="arvore-linha" id="situacao-todos">
          <span class="arvore-seta arvore-seta--oculta" aria-hidden="true"><svg class="icone" width="12" height="12"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg></span>
          <button type="button" class="caixa-selecao" role="checkbox" aria-checked="true">
            <svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          </button>
          <span class="arvore-nome">Todos</span>
        </div>
        <div class="dropdown-divisor"></div>
        <div class="arvore" id="situacao-arvore"></div>
      </div>
    </div>

    <div class="busca" id="busca-usuarios">
      <button type="button" class="busca-modo" id="busca-modo" aria-label="Alternar entre marcar e filtrar" data-dica="Marcar">
        <svg class="icone busca-modo-marcar" width="16" height="16" aria-hidden="true"><use href="icones/icone-pesquisar.svg#icone-pesquisar"/></svg>
        <svg class="icone busca-modo-filtrar oculto" width="16" height="16" aria-hidden="true"><use href="icones/icone-filtrar.svg#icone-filtrar"/></svg>
      </button>
      <input type="text" class="busca-entrada" id="busca-entrada" maxlength="100" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
      <button type="button" class="busca-limpar" id="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </div>
    </div>
    <div class="dropdown" id="dropdown-ordem">
      <button type="button" class="botao botao--icone" id="ordem-seletor" aria-label="Ordenar" data-dica="Ordenar">
        <svg class="icone" width="14" height="14" aria-hidden="true" data-ordem-icone="antiguidade"><use href="icones/icone-ordem-antiguidade.svg#icone-ordem-antiguidade"/></svg>
        <svg class="icone oculto" width="14" height="14" aria-hidden="true" data-ordem-icone="antiguidade-inversa"><use href="icones/icone-ordem-antiguidade-inversa.svg#icone-ordem-antiguidade-inversa"/></svg>
        <svg class="icone oculto" width="14" height="14" aria-hidden="true" data-ordem-icone="az"><use href="icones/icone-ordem-az.svg#icone-ordem-az"/></svg>
        <svg class="icone oculto" width="14" height="14" aria-hidden="true" data-ordem-icone="za"><use href="icones/icone-ordem-za.svg#icone-ordem-za"/></svg>
      </button>
      <div class="dropdown-menu" id="ordem-menu">
        <div class="dropdown-titulo">Ordem</div>
        <button type="button" class="dropdown-item" data-ordem="antiguidade">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-antiguidade.svg#icone-ordem-antiguidade"/></svg>
          <span>Antiguidade · mais antigo primeiro</span>
        </button>
        <button type="button" class="dropdown-item" data-ordem="antiguidade-inversa">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-antiguidade-inversa.svg#icone-ordem-antiguidade-inversa"/></svg>
          <span>Antiguidade · mais moderno primeiro</span>
        </button>
        <div class="dropdown-divisor"></div>
        <button type="button" class="dropdown-item" data-ordem="az">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-az.svg#icone-ordem-az"/></svg>
          <span>Alfabética · de A a Z</span>
        </button>
        <button type="button" class="dropdown-item" data-ordem="za">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-za.svg#icone-ordem-za"/></svg>
          <span>Alfabética · de Z a A</span>
        </button>
      </div>
    </div>
    <div class="dropdown" id="dropdown-exibir">
      <button type="button" class="botao botao--icone" id="exibir-seletor" aria-label="Exibir" data-dica="Exibir">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-exibir.svg#icone-exibir"/></svg>
      </button>
      <div class="dropdown-menu" id="exibir-menu">
        <div class="dropdown-titulo">Identificador</div>
        <button type="button" class="exibir-opcao" data-exibir-id="cpf">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>CPF</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-id="rg">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>RG</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-id="telefone">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Telefone</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-id="email">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>E-mail</span>
        </button>
        <div class="dropdown-divisor"></div>
        <div class="dropdown-titulo">Nome</div>
        <button type="button" class="exibir-opcao" data-exibir-nome="guerra">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Nome de guerra</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-nome="completo">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Completo + guerra</span>
        </button>
        <div class="dropdown-divisor"></div>
        <button type="button" class="exibir-opcao" data-exibir-toggle="hierarquia">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Mostrar hierarquia</span>
        </button>
      </div>
    </div>
  </div>
  <div class="pagina-corpo pagina-corpo--camada" data-aba-painel="efetivo">
    <div class="pagina-corpo-rolagem">
      <div class="arvore arvore-unidades" id="arvore-usuarios"></div>
    </div>
  </div>

  <!-- Pendências (só administrador): cadastros e correções de dados para aprovar (componente geral-fila) -->
  <div class="pagina-corpo oculto" data-aba-painel="pendencias">
    <div class="pedido-lista coluna-leitura" id="usuarios-pendencias"></div>
  </div>

</div>

<!-- o formulário Novo usuário (#tpl-novo-usuario e companhia) mora no index.html: também abre na Pendências (revisão de cadastro) -->

<template id="tpl-usuario-item">
  <div class="usuario-item" role="button" tabindex="0">
    <span class="usuario-item-textos">
      <span class="usuario-item-pessoa">
        <span class="usuario-item-grad"></span>
        <span class="usuario-item-nome"></span>
      </span>
      <span class="usuario-item-cpf"></span>
    </span>
    <span class="espacador-flex"></span>
    <span class="selo selo--alerta usuario-item-correcao oculto">Correção pendente</span>
    <span class="selo usuario-item-selo"></span>
  </div>
</template>

<!-- molde: o nome de guerra realçado dentro do nome completo (modo "Completo + guerra" do Exibir) -->
<template id="tpl-usuario-nome-guerra">
  <span class="usuario-item-nome-guerra"></span>
</template>

<template id="tpl-usuario-vazio">
  <div class="usuario-vazio">Nenhum militar com os filtros atuais.</div>
</template>

<!-- molde: abas de seção do painel da ficha (Dados / Carreira) -->
<template id="tpl-usuarios-painel-secoes">
  <div class="abas">
    <button type="button" class="aba aba--ativa" data-secao="dados">Dados</button>
    <button type="button" class="aba" data-secao="carreira">Carreira</button>
  </div>
</template>

<!-- molde: botão de baixa (aba Carreira, modo Editar do admin) -->
<!-- molde: campo de data "A partir de" (baixa e readmissão) -->
<template id="tpl-usuarios-data-vigencia">
  <label class="campo">
    <span class="campo-rotulo">A partir de</span>
    <input class="campo-entrada" type="text" name="vigencia-data" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" data-vigencia-data autocomplete="off" />
    <span class="campo-erro-texto"></span>
  </label>
</template>

<!-- molde: observação "Sem acesso ao sistema" (militar cadastrado sem conta de login) -->
<template id="tpl-usuarios-sem-conta">
  <div class="ficha-observacao">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-cadeado.svg#icone-cadeado"/></svg>
    <span>Sem acesso ao sistema. Cadastrado sem conta de login, não participa de trocas, folgas nem extrajornada até criar a própria conta.</span>
  </div>
</template>

<!-- molde: situação do acesso (seção Acesso ao sistema): o token de quem não tem conta ou o link de nova senha -->
<template id="tpl-usuarios-acesso-estado">
  <div class="ficha-observacao"><span data-acesso-estado></span></div>
</template>

<!-- molde: botão de gerar token de acesso -->
<template id="tpl-usuarios-token-botao">
  <button type="button" class="botao botao--primario">Gerar token de acesso</button>
</template>

<template id="tpl-usuarios-baixa-botao">
  <button type="button" class="botao botao--perigo">Dar baixa</button>
</template>

<!-- molde: botão de gerar o link de nova senha (seção Acesso ao sistema, militar com conta) -->
<template id="tpl-usuarios-link-botao">
  <button type="button" class="botao botao--primario">Gerar link de nova senha</button>
</template>

<!-- molde: link de nova senha recém-gerado, para o admin copiar e entregar -->
<template id="tpl-usuarios-link-senha">
  <div class="ficha-observacao"><span>Entregue o link ao militar depois de confirmar que o pedido é mesmo dele. O link vale uma vez e expira em 24 horas.</span></div>
  <label class="campo">
    <span class="campo-rotulo">Link de nova senha</span>
    <input class="campo-entrada" type="text" readonly data-link-senha />
  </label>
  <button type="button" class="botao" data-copiar-link>Copiar link</button>
</template>

<!-- molde: botão de readmissão (aba Carreira, modo Editar do admin, militar inativo) -->
<template id="tpl-usuarios-readmitir-botao">
  <button type="button" class="botao botao--primario">Readmitir ao efetivo</button>
</template>

<!-- molde: seção Transferir (aba Carreira, modo Editar do admin) — transferência marcada (com Cancelar,
     só quando há uma) + origem + seletor de unidade + data + botão -->
<template id="tpl-usuarios-transferir">
  <div class="grupo-caixa oculto" data-transferir-marcada>
    <span class="rotulo-secao">Mudanças marcadas</span>
    <div class="linha-info">
      <span class="linha-info-rotulo" data-transferir-marcada-texto></span>
      <button type="button" class="botao botao--texto" data-transferir-cancelar>Cancelar</button>
    </div>
  </div>
  <div class="linha-info">
    <span class="linha-info-rotulo">De</span>
    <span class="linha-info-valor" data-origem></span>
  </div>
  <div class="campo">
    <span class="campo-rotulo">Para</span>
    <div class="dropdown" data-transferir-dropdown>
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto campo-selecao-texto--vazio" data-transferir-texto>Selecione a unidade</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu dropdown-menu--largo">
        <div class="dropdown-menu-rolagem">
          <div class="arvore" data-transferir-arvore></div>
        </div>
      </div>
    </div>
  </div>
  <label class="campo">
    <span class="campo-rotulo">A partir de</span>
    <input class="campo-entrada" type="text" name="transferir-data" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" data-transferir-data />
    <span class="campo-erro-texto"></span>
  </label>
  <button type="button" class="botao botao--primario" data-transferir-botao disabled>Transferir</button>
</template>

<!-- molde: seção Promover (aba Carreira, modo Editar do admin) — Tipo + hierarquia automática + data -->
<template id="tpl-usuarios-promover">
  <div class="campo">
    <span class="campo-rotulo">Tipo</span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao" data-promover-tipo>
        <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu"></div>
    </div>
  </div>
  <div class="linha-info">
    <span class="linha-info-rotulo">Promovido a</span>
    <span class="linha-info-valor" data-promover-hierarquia>-</span>
  </div>
  <label class="campo">
    <span class="campo-rotulo">Data da promoção</span>
    <input class="campo-entrada" type="text" name="promover-data" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" data-promover-data />
    <span class="campo-erro-texto"></span>
  </label>
  <button type="button" class="botao botao--primario" data-promover-botao disabled>Promover</button>
</template>

<!-- molde: campo editável de texto (aba Dados, modo Editar) -->
<template id="tpl-ficha-campo">
  <label class="campo">
    <span class="campo-rotulo"></span>
    <input class="campo-entrada" type="text" name="ficha-campo" />
    <!-- dica da inclusão no quadro: aparece só nesse campo -->
    <span class="campo-ajuda oculto" data-ajuda="inclusao">Data de entrada no quadro atual do militar (praças ou oficiais), não a data de entrada na corporação.</span>
    <span class="campo-erro-texto"></span>
  </label>
</template>

<!-- molde: campo editável de seleção (CNH, Setor) -->
<template id="tpl-ficha-campo-selecao">
  <div class="campo">
    <span class="campo-rotulo"></span>
    <div class="dropdown">
      <button type="button" class="campo-entrada campo-selecao">
        <span class="campo-selecao-texto"></span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu"></div>
    </div>
    <span class="campo-erro-texto"></span>
  </div>
</template>

<!-- molde: rodapé de ações do Editar (Cancelar / Salvar) -->
<template id="tpl-ficha-editar-acoes">
  <button type="button" class="botao ficha-editar-cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario ficha-editar-salvar">Salvar</button>
</template>
