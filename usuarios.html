<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Usuários</h1>
      <span class="pagina-titulo-contagem"></span>
    </div>
    <div class="abas" id="usuarios-abas">
      <button type="button" class="aba aba--ativa" data-aba="efetivo">Efetivo</button>
      <!-- só administrador: a ordem de antiguidade da companhia, por posto -->
      <button type="button" class="aba oculto" data-aba="antiguidade" id="usuarios-aba-antiguidade">Antiguidade</button>
      <!-- só administrador: correções de dados para aprovar (a mesma fila da página Pendências) -->
      <button type="button" class="aba oculto" data-aba="pendencias" id="usuarios-aba-pendencias">
        <span>Pendências</span>
        <span class="selo aba-contagem oculto" id="usuarios-pendencias-contagem"></span>
      </button>
    </div>
  </div>

  <!-- barra sempre presente (o conteúdo não "pula" ao trocar de aba): à esquerda o grupo Administração
       (Novo usuário, só admin, em todas as abas); à direita, na aba Efetivo, o botão Filtros (componente
       geral-filtros), a busca e, depois do traço, Ordem e Exibir -->
  <div class="pagina-subcabecalho">
    <div class="dropdown acoes-admin oculto">
      <button type="button" class="botao acoes-admin-gatilho">
        <span>Administração</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu acoes-admin-menu">
        <span class="rotulo-secao acoes-admin-rotulo">Administração</span>
        <button type="button" class="botao" id="btn-novo-usuario">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-novo-usuario.svg#icone-novo-usuario"/></svg>
          <span>Novo usuário</span>
        </button>
      </div>
    </div>
    <span class="espacador-flex"></span>

    <div class="busca oculto" id="antiguidade-busca">
      <svg class="icone antiguidade-busca-lupa" width="16" height="16" aria-hidden="true"><use href="icones/icone-pesquisar.svg#icone-pesquisar"/></svg>
      <input type="text" class="busca-entrada" maxlength="100" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
      <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </div>

    <!-- Filtros da aba Efetivo: Graus (os de quem aparece) e Situação (Inativos e Correção pendente, só admin, à parte) -->
    <div class="filtros" id="usuarios-filtros">
      <div data-filtro="graus" data-filtro-nome="Grau" data-filtro-titulo="Graus"></div>
      <div data-filtro="situacao" data-filtro-nome="Situação" data-filtro-titulo="Situação"></div>
    </div>

    <div class="busca" id="busca-usuarios">
      <button type="button" class="busca-modo" id="busca-modo" aria-label="Alternar entre marcar e filtrar" data-dica="Marcar">
        <svg class="icone busca-modo-marcar" width="16" height="16" aria-hidden="true"><use href="icones/icone-pesquisar.svg#icone-pesquisar"/></svg>
        <svg class="icone busca-modo-filtrar oculto" width="16" height="16" aria-hidden="true"><use href="icones/icone-filtrar.svg#icone-filtrar"/></svg>
      </button>
      <input type="text" class="busca-entrada" id="busca-entrada" maxlength="100" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
      <button type="button" class="busca-limpar" id="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </div>

    <span class="pagina-subcabecalho-divisor" id="usuarios-divisor" aria-hidden="true"></span>

    <div class="dropdown" id="dropdown-ordem">
      <button type="button" class="botao botao--quadrado" id="ordem-seletor" aria-label="Ordenar" data-dica="Ordenar">
        <svg class="icone" width="16" height="16" aria-hidden="true" data-ordem-icone="antiguidade"><use href="icones/icone-ordem-antiguidade.svg#icone-ordem-antiguidade"/></svg>
        <svg class="icone oculto" width="16" height="16" aria-hidden="true" data-ordem-icone="antiguidade-inversa"><use href="icones/icone-ordem-antiguidade-inversa.svg#icone-ordem-antiguidade-inversa"/></svg>
        <svg class="icone oculto" width="16" height="16" aria-hidden="true" data-ordem-icone="az"><use href="icones/icone-ordem-az.svg#icone-ordem-az"/></svg>
        <svg class="icone oculto" width="16" height="16" aria-hidden="true" data-ordem-icone="za"><use href="icones/icone-ordem-za.svg#icone-ordem-za"/></svg>
      </button>
      <div class="dropdown-menu" id="ordem-menu">
        <div class="dropdown-titulo">Ordem</div>
        <button type="button" class="dropdown-item" data-ordem="antiguidade">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-antiguidade.svg#icone-ordem-antiguidade"/></svg>
          <span>Antiguidade · mais antigo primeiro</span>
        </button>
        <button type="button" class="dropdown-item" data-ordem="antiguidade-inversa">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-antiguidade-inversa.svg#icone-ordem-antiguidade-inversa"/></svg>
          <span>Antiguidade · mais moderno primeiro</span>
        </button>
        <div class="dropdown-divisor"></div>
        <button type="button" class="dropdown-item" data-ordem="az">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-az.svg#icone-ordem-az"/></svg>
          <span>Alfabética · de A a Z</span>
        </button>
        <button type="button" class="dropdown-item" data-ordem="za">
          <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-ordem-za.svg#icone-ordem-za"/></svg>
          <span>Alfabética · de Z a A</span>
        </button>
      </div>
    </div>
    <div class="dropdown" id="dropdown-exibir">
      <button type="button" class="botao botao--quadrado" id="exibir-seletor" aria-label="Exibir" data-dica="Exibir">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-exibir.svg#icone-exibir"/></svg>
      </button>
      <div class="dropdown-menu" id="exibir-menu">
        <div class="dropdown-titulo">Identificador</div>
        <button type="button" class="exibir-opcao" data-exibir-id="cpf">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>CPF</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-id="rg">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>RG</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-id="telefone">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Telefone</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-id="email">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>E-mail</span>
        </button>
        <div class="dropdown-divisor"></div>
        <div class="dropdown-titulo">Nome</div>
        <button type="button" class="exibir-opcao" data-exibir-nome="guerra">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Nome de guerra</span>
        </button>
        <button type="button" class="exibir-opcao" data-exibir-nome="completo">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Completo + guerra</span>
        </button>
        <div class="dropdown-divisor"></div>
        <button type="button" class="exibir-opcao" data-exibir-toggle="hierarquia">
          <svg class="icone exibir-check" width="12" height="12" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
          <span>Mostrar hierarquia</span>
        </button>
      </div>
    </div>
  </div>
  <div class="pagina-corpo pagina-corpo--camada" data-aba-painel="efetivo">
    <div class="pagina-corpo-rolagem">
      <div class="arvore arvore-unidades" id="arvore-usuarios"></div>
    </div>
  </div>

  <!-- Antiguidade (só administrador): as peças da árvore de unidades (trilha, bloco da companhia e um
       bloquinho por posto), como no PDF da escala; trilha e títulos ficam presos no alto ao rolar -->
  <div class="pagina-corpo pagina-corpo--camada oculto" data-aba-painel="antiguidade">
    <div class="pagina-corpo-rolagem">
      <div class="arvore arvore-unidades antiguidade-lista" id="antiguidade-lista"></div>
    </div>
    <!-- salvar: ativo só com alteração; Cancelar volta à ordem gravada -->
    <div class="rodape rodape-pilha">
      <div class="rodape-linha">
        <span class="antiguidade-mudancas" id="antiguidade-mudancas"></span>
        <span class="espacador-flex"></span>
        <div class="rodape-acoes">
          <button type="button" class="botao" id="antiguidade-cancelar">Cancelar</button>
          <button type="button" class="botao botao--primario" id="antiguidade-salvar" disabled>Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pendências (só administrador): correções de dados para aprovar (componente geral-fila) -->
  <div class="pagina-corpo oculto" data-aba-painel="pendencias">
    <div class="pedido-lista coluna-leitura" id="usuarios-pendencias"></div>
  </div>

</div>

<!-- o formulário Novo usuário (#tpl-novo-usuario e companhia) mora no index.html -->

<!-- molde: um militar na linha da árvore (como a linha do PDF): graduação + nome, o identificador numa coluna e os selos no fim -->
<template id="tpl-usuario-item">
  <div class="linha-militar usuario-item" role="button" tabindex="0">
    <span class="linha-militar-pessoa">
      <span class="linha-militar-grad usuario-item-grad"></span>
      <span class="linha-militar-nome usuario-item-nome"></span>
    </span>
    <span class="linha-militar-coluna usuario-item-cpf"></span>
    <span class="linha-militar-fim usuario-item-selos">
      <span class="selo selo--alerta usuario-item-correcao oculto">Correção pendente</span>
      <span class="selo usuario-item-selo"></span>
    </span>
  </div>
</template>

<!-- molde: o nome de guerra realçado dentro do nome completo (modo "Completo + guerra" do Exibir) -->
<template id="tpl-usuario-nome-guerra">
  <span class="usuario-item-nome-guerra"></span>
</template>

<template id="tpl-usuario-vazio">
  <div class="usuario-vazio">Nenhum militar com os filtros atuais.</div>
</template>

<!-- molde (aba Antiguidade): um posto = bloquinho branco da árvore, com os militares na ordem;
     o título recolhe/expande a lista (chevron à direita) -->
<template id="tpl-antiguidade-posto">
  <div class="bloquinho bloquinho--com-titulo antiguidade-posto">
    <button type="button" class="bloquinho-titulo antiguidade-posto-titulo" aria-expanded="true">
      <span class="rotulo-secao" data-posto-titulo></span>
      <svg class="icone bloquinho-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="bloquinho-lista" data-posto-lista></div>
  </div>
</template>

<!-- molde (aba Antiguidade): um militar na linha da árvore (número, graduação + nome e o pelotão);
     as setas aparecem quando a linha é escolhida -->
<template id="tpl-antiguidade-linha">
  <div class="linha-militar linha-militar--clicavel antiguidade-linha" role="button" tabindex="0">
    <span class="linha-militar-numero" data-numero></span>
    <span class="linha-militar-pessoa">
      <span class="linha-militar-grad" data-grad></span>
      <span class="linha-militar-nome" data-guerra></span>
    </span>
    <span class="linha-militar-coluna antiguidade-pelotao" data-pelotao></span>
    <span class="linha-militar-fim antiguidade-setas">
      <button type="button" class="botao botao--icone botao--pequeno" data-mover="cima" aria-label="Subir uma posição" data-dica="Subir">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-mover-cima.svg#icone-mover-cima"/></svg>
      </button>
      <button type="button" class="botao botao--icone botao--pequeno" data-mover="baixo" aria-label="Descer uma posição" data-dica="Descer">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-mover-baixo.svg#icone-mover-baixo"/></svg>
      </button>
    </span>
  </div>
</template>

<template id="tpl-antiguidade-vazio">
  <div class="usuario-vazio">Nenhum militar ativo na sua companhia.</div>
</template>

<!-- ===== ficha do militar (painel direito; usuarios-painel*.js), no padrão do painel da Escala ===== -->

<!-- molde: abas de seção do painel da ficha (Dados / Carreira) -->
<template id="tpl-usuarios-painel-secoes">
  <div class="abas">
    <button type="button" class="aba aba--ativa" data-secao="dados">Dados</button>
    <button type="button" class="aba" data-secao="carreira">Carreira</button>
  </div>
</template>

<!-- molde: um bloco da ficha (caixa cinza com o título); o lápis aparece para o admin e abre a correção -->
<template id="tpl-ficha-bloco">
  <div class="grupo-caixa">
    <div class="ficha-bloco-cab">
      <span class="rotulo-secao"></span>
      <button type="button" class="botao-discreto oculto" data-ficha-lapis>
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-editar.svg#icone-editar"/></svg>
      </button>
    </div>
  </div>
</template>

<!-- molde: bloco que recolhe (começa fechado; abre e fecha pelo chevron) -->
<template id="tpl-ficha-bloco-recolhivel">
  <div class="grupo-caixa">
    <button type="button" class="ficha-bloco-cab ficha-bloco-cab--recolhivel" aria-expanded="false">
      <span class="rotulo-secao"></span>
      <svg class="icone ficha-bloco-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="ficha-bloco-corpo oculto"></div>
  </div>
</template>

<!-- molde: uma linha de dado do bloco (rótulo à esquerda, valor ao lado; o complemento em cinza) -->
<template id="tpl-ficha-linha">
  <div class="ficha-linha">
    <span class="ficha-linha-rotulo"></span>
    <span class="ficha-linha-valor"><span data-ficha-valor></span><span class="ficha-linha-extra" data-ficha-extra></span></span>
  </div>
</template>

<!-- molde: nota "Sem acesso ao sistema" (militar cadastrado sem conta de login) -->
<template id="tpl-usuarios-sem-conta">
  <div class="nota">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-cadeado.svg#icone-cadeado"/></svg>
    <span class="nota-texto">Sem acesso ao sistema. Cadastrado sem conta de login, não participa de trocas, folgas nem extrajornada até criar a própria conta.</span>
  </div>
</template>

<!-- molde: nota da transferência marcada (data futura), com o Cancelar (só admin) -->
<template id="tpl-ficha-marcada">
  <div class="nota">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-historico.svg#icone-historico"/></svg>
    <span class="nota-texto"><span data-marcada-texto></span>. Para marcar outra, cancele esta primeiro.</span>
    <button type="button" class="botao botao--texto ficha-nota-acao" data-marcada-cancelar>Cancelar</button>
  </div>
</template>

<!-- molde: barra do painel na Carreira (admin, militar ativo) -->
<template id="tpl-ficha-acoes-carreira">
  <button type="button" class="botao botao--primario" data-ficha-acao="promover">Promover</button>
  <button type="button" class="botao botao--primario" data-ficha-acao="transferir">Transferir</button>
</template>

<!-- molde: barra do painel na Carreira (admin, militar inativo) -->
<template id="tpl-ficha-acoes-inativo">
  <button type="button" class="botao botao--primario" data-ficha-acao="readmitir">Readmitir ao efetivo</button>
</template>

<!-- molde: o Dar baixa, no fim da Carreira (admin, militar ativo) -->
<template id="tpl-ficha-baixa-botao">
  <div class="ficha-acoes-fim">
    <button type="button" class="botao ficha-botao--perigo">Dar baixa do sistema</button>
  </div>
</template>

<!-- molde: situação do acesso (bloco Acesso ao sistema): sem link, o que fazer; com link, até quando ele vale -->
<template id="tpl-usuarios-acesso-estado">
  <span class="subtela-ajuda" data-acesso-estado></span>
</template>

<!-- molde: botão de gerar o link de cadastro (bloco Acesso ao sistema, militar sem conta) -->
<template id="tpl-usuarios-link-cadastro-botao">
  <div class="ficha-acoes-fim">
    <button type="button" class="botao botao--primario">Gerar link de cadastro</button>
  </div>
</template>

<!-- molde: botão de gerar o link de nova senha (bloco Acesso ao sistema, militar com conta) -->
<template id="tpl-usuarios-link-senha-botao">
  <div class="ficha-acoes-fim">
    <button type="button" class="botao botao--primario">Gerar link de nova senha</button>
  </div>
</template>

<!-- molde: o link que está valendo: a mensagem pronta para mandar no privado do militar.
     Enquanto ele vale não se gera outro; para trocar, cancela -->
<template id="tpl-usuarios-acesso-link">
  <label class="campo">
    <span class="campo-rotulo">Mensagem para enviar</span>
    <textarea class="campo-entrada" rows="10" readonly data-acesso-mensagem></textarea>
  </label>
  <div class="ficha-acoes-fim">
    <button type="button" class="botao botao--primario" data-acesso-copiar>Copiar mensagem</button>
    <button type="button" class="botao" data-acesso-cancelar>Cancelar link</button>
  </div>
</template>

<!-- molde: rodapé do admin sem sub-tela: as alterações na ficha (retrátil, começa fechado; componente geral-alteracoes) -->
<template id="tpl-ficha-alteracoes">
  <div class="alteracoes">
    <div class="alteracoes-cabecalho">
      <span class="alteracoes-titulo">Alterações na ficha <span class="alteracoes-qtd"></span></span>
      <button type="button" class="botao-discreto alteracoes-toggle" aria-label="Mostrar ou ocultar as alterações na ficha" aria-expanded="false">
        <svg class="icone alteracoes-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
    </div>
    <div class="alteracoes-lista oculto"></div>
  </div>
</template>

<!-- ===== sub-telas da ficha (abrem no lugar da ficha: Voltar no topo; Cancelar + o botão de aplicar no rodapé) ===== -->

<template id="tpl-ficha-voltar-dados">
  <button type="button" class="botao botao--texto subtela-voltar"><svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-esquerda.svg#icone-seta-esquerda"/></svg><span>Voltar aos dados</span></button>
</template>

<template id="tpl-ficha-voltar-carreira">
  <button type="button" class="botao botao--texto subtela-voltar"><svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-esquerda.svg#icone-seta-esquerda"/></svg><span>Voltar à carreira</span></button>
</template>

<!-- molde: rodapé das sub-telas (o texto do botão de aplicar vem de RosterWork.mensagens.botoes) -->
<template id="tpl-ficha-sub-acoes">
  <span class="ficha-rodape-info"></span>
  <button type="button" class="botao" data-sub-cancelar>Cancelar</button>
  <button type="button" class="botao botao--primario" data-sub-aplicar></button>
</template>

<!-- molde: sub-tela Corrigir dados pessoais (os campos vêm do usuarios-painel-editar.js) -->
<template id="tpl-ficha-sub-pessoais">
  <div class="subtela">
    <div class="subtela-cab">
      <span class="subtela-titulo">Corrigir dados pessoais</span>
      <span class="subtela-subtitulo">Para consertar um dado incorreto.</span>
    </div>
  </div>
</template>

<!-- molde: sub-tela Corrigir dados institucionais -->
<template id="tpl-ficha-sub-institucionais">
  <div class="subtela">
    <div class="subtela-cab">
      <span class="subtela-titulo">Corrigir dados institucionais</span>
      <span class="subtela-subtitulo">Para consertar um dado incorreto.</span>
    </div>
  </div>
</template>

<!-- molde: sub-tela Datas de promoções (os campos vêm do usuarios-painel-datas.js) -->
<template id="tpl-ficha-sub-datas">
  <div class="subtela">
    <div class="subtela-cab">
      <span class="subtela-titulo">Datas de promoções</span>
      <span class="subtela-subtitulo">Deixe em branco o que não tiver.</span>
    </div>
  </div>
</template>
