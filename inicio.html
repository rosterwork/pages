<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Início</h1>
    </div>
    <!-- ajuda da tela: os passo a passo desta página e o manual (componente geral-guia) -->
    <div class="dropdown pagina-ajuda" data-manual="ver-servico">
      <button type="button" class="botao botao--icone" aria-label="Ajuda desta tela" data-dica="Ajuda">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      </button>
      <div class="dropdown-menu pagina-ajuda-menu"></div>
    </div>
  </div>

  <!-- à esquerda, o grupo Administração (só admin: o Novo comunicado); o mês do calendário: ‹ nome › (o nome
       abre a escolha do mês) e o Hoje fora do mês atual; à direita, a Legenda, antes da faixa dos Atalhos.
       No celular, o mês e a Legenda ficam na mesma linha (--uma-linha) -->
  <div class="pagina-subcabecalho pagina-subcabecalho--uma-linha inicio-barra">
    <div class="dropdown acoes-admin oculto">
      <button type="button" class="botao acoes-admin-gatilho">
        <span>Administração</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu acoes-admin-menu">
        <span class="rotulo-secao acoes-admin-rotulo">Administração</span>
        <button type="button" class="botao" id="btn-novo-aviso">Novo comunicado</button>
      </div>
    </div>
    <div class="geral-periodo">
      <button type="button" class="botao botao--icone" id="inicio-mes-anterior" aria-label="Mês anterior">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-esquerda"/></svg>
      </button>
      <button type="button" class="geral-periodo-nome" id="inicio-mes-nome"></button>
      <button type="button" class="botao botao--icone" id="inicio-mes-proximo" aria-label="Próximo mês">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
      </button>
      <button type="button" class="botao geral-periodo-hoje oculto" id="inicio-mes-hoje">Hoje</button>
    </div>
    <span class="espacador-flex"></span>
    <div id="inicio-legenda"></div>
  </div>

  <div class="pagina-corpo">
    <div class="inicio-layout">
      <div class="inicio-area">
        <div class="inicio-esquerda">
          <section class="inicio-calendario" id="inicio-calendario"></section>

          <!-- o resumo do dia escolhido (as linhas dele, as mesmas da Escala) e o botão do painel do dia -->
          <section class="inicio-caixa inicio-dia">
            <span class="inicio-dia-titulo" id="inicio-dia-titulo"></span>
            <div class="inicio-dia-linhas" id="inicio-dia-linhas"></div>
            <span class="inicio-vazio oculto" id="inicio-dia-vazio">Nada marcado neste dia.</span>
            <button type="button" class="botao inicio-dia-escala" id="inicio-dia-escala">Ver a escala do dia</button>
          </section>
        </div>

        <div class="inicio-meio">
          <!-- só aparece quando há comunicado -->
          <section class="inicio-caixa oculto" id="inicio-avisos-caixa">
            <div class="inicio-caixa-cabecalho">
              <span class="rotulo-secao">Avisos</span>
              <span class="espacador-flex"></span>
              <button type="button" class="botao oculto" id="inicio-avisos-todos"><span>Ver todos (<span id="inicio-avisos-total"></span>)</span></button>
            </div>
            <div class="inicio-avisos" id="inicio-avisos"></div>
          </section>

          <!-- pendências: o militar vê uma lista só ("Para mim", com o título); o administrador, as abas Para mim
               e Administração com o número do que depende dele. Cada lista: os pedidos que esperam decisão (a
               fila da Pendências, que abre o painel de decisão) e, embaixo, os prazos e os seus pedidos (Para mim)
               ou o que precisa ser corrigido (Administração). Só aparece quando há alguma coisa -->
          <section class="inicio-caixa oculto" id="inicio-pend-caixa">
            <div class="inicio-pend-cabecalho">
              <span class="rotulo-secao" id="inicio-pend-titulo">Pendências</span>
              <div class="abas oculto" id="inicio-pend-abas">
                <button type="button" class="aba aba--ativa" data-pend="paramim">
                  <span>Para mim</span>
                  <span class="selo aba-contagem oculto" id="inicio-pend-paramim-contagem"></span>
                </button>
                <button type="button" class="aba" data-pend="administracao">
                  <span>Administração</span>
                  <span class="selo aba-contagem oculto" id="inicio-pend-administracao-contagem"></span>
                </button>
              </div>
              <span class="espacador-flex"></span>
              <button type="button" class="botao oculto" id="inicio-pend-todos">Ver todos</button>
            </div>
            <div class="inicio-pend-lista" data-pend-painel="paramim">
              <div class="pedido-lista" id="inicio-pend-minhas"></div>
              <div class="pedido-lista" id="inicio-pend-meus"></div>
              <span class="inicio-vazio oculto" data-pend-vazio>Nada pendente.</span>
            </div>
            <div class="inicio-pend-lista oculto" data-pend-painel="administracao">
              <div class="pedido-lista" id="inicio-pend-aprovar"></div>
              <div class="pedido-lista" id="inicio-pend-corrigir"></div>
              <span class="inicio-vazio oculto" data-pend-vazio>Nada pendente.</span>
            </div>
          </section>
        </div>
      </div>

      <!-- computador: os atalhos na faixa da direita (o painel abre por cima dela e da direita dos avisos) -->
      <aside class="inicio-caixa inicio-atalhos">
        <span class="rotulo-secao">Atalhos</span>
        <div class="inicio-atalhos-linhas">
          <button type="button" class="inicio-atalho" data-atalho="troca">
            <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-trocas"/></svg>
            <span class="inicio-atalho-texto">Solicitar troca</span>
            <span class="espacador-flex"></span>
            <svg class="icone inicio-atalho-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
          </button>
          <button type="button" class="inicio-atalho" data-atalho="folga">
            <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-folgas"/></svg>
            <span class="inicio-atalho-texto">Solicitar folga</span>
            <span class="espacador-flex"></span>
            <svg class="icone inicio-atalho-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
          </button>
          <button type="button" class="inicio-atalho" data-atalho="extra">
            <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-extrajornada"/></svg>
            <span class="inicio-atalho-texto">Solicitar extra</span>
            <span class="espacador-flex"></span>
            <svg class="icone inicio-atalho-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
          </button>
          <button type="button" class="inicio-atalho" data-atalho="hoje">
            <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-escalas"/></svg>
            <span class="inicio-atalho-texto">Escala de hoje</span>
            <span class="espacador-flex"></span>
            <svg class="icone inicio-atalho-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <!-- um comunicado: título + mensagem (até 2 linhas) + autor e data + a lixeira de quem pode desativar -->
  <template id="tpl-inicio-aviso">
    <div class="inicio-aviso">
      <div class="inicio-aviso-conteudo">
        <span class="inicio-aviso-titulo"></span>
        <span class="inicio-aviso-msg"></span>
        <span class="inicio-aviso-meta"></span>
      </div>
      <button type="button" class="inicio-aviso-remover oculto" aria-label="Remover aviso">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
      </button>
    </div>
  </template>

  <template id="tpl-inicio-vazio">
    <span class="inicio-vazio"></span>
  </template>
</div>
