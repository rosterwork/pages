<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Escala</h1>
    </div>
    <!-- modos: o Dia (a escala principal, impressa e exibida na passagem de serviço) num grupo próprio,
         à frente das outras visões; os dois grupos valem como uma escolha só (escalas.js),
         com um traço só (data-abas-grupo) -->
    <div class="escala-modos" id="escala-modos" data-abas-grupo>
      <div class="abas" id="escala-modo-principal">
        <button type="button" class="aba aba--ativa" data-modo="dia">Dia</button>
      </div>
      <div class="abas" id="escala-modo-visoes">
        <button type="button" class="aba" data-modo="militares">Militares</button>
        <button type="button" class="aba" data-modo="mes">Mês</button>
        <button type="button" class="aba" data-modo="semana">Semana</button>
        <button type="button" class="aba" data-modo="colunas">Colunas</button>
      </div>
    </div>
  </div>

  <div class="pagina-subcabecalho">
    <div class="geral-periodo">
      <button type="button" class="botao botao--icone" id="escala-periodo-anterior" aria-label="Período anterior">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-esquerda.svg#icone-seta-esquerda"/></svg>
      </button>
      <button type="button" class="geral-periodo-nome" id="escala-periodo-nome"></button>
      <button type="button" class="botao botao--icone" id="escala-periodo-proximo" aria-label="Próximo período">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg>
      </button>
    </div>

    <div class="abas abas--seletor oculto" id="escala-sub-mes">
      <button type="button" class="aba aba--ativa" data-mes="agenda">Agenda</button>
      <button type="button" class="aba" data-mes="calendario">Calendário</button>
    </div>

    <div class="escala-sub-colunas oculto" id="escala-sub-colunas">
      <div class="abas abas--seletor" id="escala-colunas-tipo">
        <button type="button" class="aba aba--ativa" data-colunas-tipo="dias">Dias</button>
        <button type="button" class="aba" data-colunas-tipo="unidades">Unidades</button>
      </div>
      <div class="abas abas--seletor" id="escala-colunas-qtd">
        <button type="button" class="aba" data-colunas="2">2</button>
        <button type="button" class="aba aba--ativa" data-colunas="3">3</button>
        <button type="button" class="aba" data-colunas="4">4</button>
        <button type="button" class="aba" data-colunas="5">5</button>
      </div>
    </div>

    <div class="escala-sub-unidades oculto" id="escala-sub-unidades">
      <div class="abas abas--seletor" id="escala-unidades-abas" data-abas-multi></div>
    </div>

    <span class="espacador-flex"></span>

    <!-- imprimir: abre o painel "Imprimir escala" (datas + unidades → PDF); à esquerda da busca, em todos os modos -->
    <button type="button" class="botao botao--quadrado" id="escala-imprimir" aria-label="Imprimir escala" data-dica="Imprimir">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-imprimir.svg#icone-imprimir"/></svg>
    </button>

    <!-- busca de militar (nome/CPF/RG) nos modos de grade (Mês/Semana/Colunas/Dia); o modo Militares tem a sua própria -->
    <div class="busca oculto" id="escala-busca-geral">
      <button type="button" class="busca-modo" aria-label="Alternar entre marcar e filtrar" data-dica="Marcar">
        <svg class="icone busca-modo-marcar" width="16" height="16" aria-hidden="true"><use href="icones/icone-pesquisar.svg#icone-pesquisar"/></svg>
        <svg class="icone busca-modo-filtrar oculto" width="16" height="16" aria-hidden="true"><use href="icones/icone-filtrar.svg#icone-filtrar"/></svg>
      </button>
      <input type="text" name="busca-militar" class="busca-entrada" maxlength="100" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
      <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </div>

    <div class="escala-sub-militares oculto" id="escala-sub-militares">
      <div class="busca" id="escala-busca-militares">
        <svg class="icone escala-busca-lupa" width="16" height="16" aria-hidden="true"><use href="icones/icone-pesquisar.svg#icone-pesquisar"/></svg>
        <input type="text" class="busca-entrada" id="escala-busca-entrada" maxlength="100" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
        <button type="button" class="busca-limpar" id="escala-busca-limpar" aria-label="Limpar pesquisa">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
        </button>
      </div>
    </div>

    <!-- legenda da grade: o que cada cor, ícone e selo quer dizer (o conteúdo acompanha o modo; escalas-legenda.js) -->
    <div class="dropdown" id="escala-legenda-grade">
      <button type="button" class="botao" id="escala-legenda-botao">Legenda</button>
      <div class="dropdown-menu dropdown-menu--largo escala-legenda-menu">
        <div class="dropdown-menu-rolagem">
          <div class="escala-legenda-itens" data-legenda-conteudo></div>
        </div>
      </div>
    </div>
  </div>

  <div class="pagina-corpo pagina-corpo--colado"></div>
</div>

<template id="tpl-escala-aba-unidade">
  <button type="button" class="aba"></button>
</template>

<!-- modo Dia: árvore de unidades com a distribuição do dia (postos → funções) -->
<template id="tpl-escala-dia">
  <div class="pagina-corpo-rolagem">
    <div class="arvore arvore-unidades" id="arvore-escala-dia"></div>
  </div>
</template>
<!-- bloco clicável de uma unidade no Dia (abre o painel do dia; o escalas-painel casa por [data-abre-dia]) -->
<template id="tpl-escala-dia-unidade">
  <div class="escala-dia-unidade" data-abre-dia></div>
</template>

<!-- ===== modo Colunas → Unidades: grade dias (linhas) × unidades (colunas) =====
     (o Colunas → Dias é o calendário contínuo: componente geral-calendario-mes + tpl-escala-calendario-unidade) -->
<template id="tpl-escala-colunas">
  <div class="escala-colunas">
    <div class="escala-colunas-grade"></div>
  </div>
</template>

<!-- cabeçalho (fixo no topo): canto + uma unidade por coluna -->
<template id="tpl-escala-colunas-cabecalho">
  <div class="escala-colunas-linha escala-colunas-cabecalho">
    <div class="escala-colunas-canto"></div>
  </div>
</template>

<!-- cabeçalho de coluna = unidade -->
<template id="tpl-escala-colunas-cab-unidade">
  <div class="escala-colunas-cab-unidade"></div>
</template>

<!-- uma linha: rótulo fixo (o dia) + as células (o JS anexa, reusa tpl-escala-mes-celula) -->
<template id="tpl-escala-colunas-linha">
  <div class="escala-colunas-linha"></div>
</template>

<!-- rótulo de linha = dia -->
<template id="tpl-escala-colunas-rotulo-dia">
  <div class="escala-colunas-rotulo-dia">
    <span class="escala-colunas-rotulo-semana"></span>
    <span class="escala-colunas-rotulo-numero"></span>
  </div>
</template>

<!-- ícone de regra (exclusivo/proibido) na tira de ícones do militar; o span recebe a dica (data-dica) -->
<template id="tpl-escala-regra-icone">
  <span class="escala-distribuicao-regra">
    <svg class="icone" width="13" height="13" aria-hidden="true"><use href="icones/icone-regra.svg#icone-regra"/></svg>
  </span>
</template>

<!-- modos Mês → Calendário e Colunas → Dias: um bloco por unidade dentro do dia (nome + a célula do Mês) -->
<template id="tpl-escala-calendario-unidade">
  <div class="escala-calendario-unidade">
    <span class="escala-calendario-unidade-nome"></span>
    <div class="escala-mes-celula"></div>
  </div>
</template>

<!-- ===== modo Semana: grade unidades (linhas) × 7 dias (colunas) ===== -->
<template id="tpl-escala-semana">
  <div class="escala-semana">
    <div class="escala-semana-grade"></div>
  </div>
</template>

<!-- cabeçalho dos dias (fixo no topo): canto + um dia por coluna -->
<template id="tpl-escala-semana-cabecalho">
  <div class="escala-semana-linha escala-semana-cabecalho">
    <div class="escala-semana-canto"></div>
  </div>
</template>

<template id="tpl-escala-semana-dia">
  <div class="escala-semana-dia">
    <span class="escala-semana-dia-semana"></span>
    <span class="escala-semana-dia-numero"></span>
  </div>
</template>

<!-- uma unidade: coluna fixa (nome + cidade) + as células dos dias (o JS anexa, reusa tpl-escala-mes-celula) -->
<template id="tpl-escala-semana-linha">
  <div class="escala-semana-linha">
    <div class="escala-semana-unidade">
      <span class="escala-semana-unidade-nome"></span>
      <span class="escala-semana-unidade-cidade"></span>
    </div>
  </div>
</template>

<!-- rodapé do painel do dia (Distribuição › Ver): as alterações manuais do dia, retrátil e começando fechado;
     só aparece quando há alguma (o JS preenche a contagem e a lista) -->
<template id="tpl-escala-alteracoes">
  <div class="escala-alteracoes">
    <div class="escala-alteracoes-cabecalho">
      <span class="escala-alteracoes-titulo">Alterações manuais <span class="escala-alteracoes-qtd"></span></span>
      <button type="button" class="botao-discreto escala-alteracoes-toggle" aria-label="Mostrar ou ocultar as alterações manuais" aria-expanded="false">
        <svg class="icone escala-alteracoes-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
    </div>
    <div class="escala-alteracoes-lista oculto"></div>
  </div>
</template>

<!-- painel "Imprimir escala" (botão do sub-cabeçalho; escalas-impressao.js): datas De/Até (já com o dia exibido)
     + atalhos, a árvore de unidades (já marcada com o seletor), o resumo e o aviso de erro grave -->
<template id="tpl-escala-impressao">
  <div class="painel-secao">
    <span class="rotulo-secao">Datas</span>
    <div class="escala-impressao-datas">
      <label class="campo">
        <span class="campo-rotulo">De</span>
        <input class="campo-entrada" type="text" name="impressao-inicio" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-impressao-inicio />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Até</span>
        <input class="campo-entrada" type="text" name="impressao-fim" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-impressao-fim />
        <span class="campo-erro-texto"></span>
      </label>
    </div>
    <div class="escala-impressao-atalhos">
      <button type="button" class="botao botao--pequeno" data-impressao-atalho="dia">Só este dia</button>
      <button type="button" class="botao botao--pequeno" data-impressao-atalho="semana">7 dias</button>
      <button type="button" class="botao botao--pequeno" data-impressao-atalho="mes">Até o fim do mês</button>
    </div>
    <span class="campo-ajuda">Até 31 dias por arquivo. Cada dia começa numa folha nova.</span>
  </div>
  <div class="painel-secao">
    <span class="rotulo-secao">Unidades</span>
    <div class="campo">
      <div class="arvore" data-impressao-arvore></div>
      <span class="campo-erro-texto"></span>
    </div>
  </div>
  <div class="painel-secao">
    <span class="rotulo-secao">O que vai sair</span>
    <span class="campo-ajuda" data-impressao-resumo></span>
    <div class="impacto-aviso impacto-aviso--problema oculto" data-impressao-aviso>
      <svg class="icone impacto-aviso-icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-alerta.svg#icone-alerta"/></svg>
      <span class="impacto-aviso-textos">
        <span class="impacto-aviso-titulo"></span>
        <span class="impacto-aviso-desc"></span>
      </span>
    </div>
  </div>
</template>
<template id="tpl-escala-impressao-acoes">
  <button type="button" class="botao" data-impressao-cancelar>Cancelar</button>
  <button type="button" class="botao botao--primario" data-impressao-gerar>Gerar PDF</button>
</template>
<!-- link escondido que baixa o PDF pronto (clicado e retirado na hora) -->
<template id="tpl-escala-impressao-baixar">
  <a class="oculto" href="#" download="escala.pdf">PDF</a>
</template>

<!-- uma alteração manual: quem e quando + o que mudou (o resumo vem do componente geral-resumo) -->
<template id="tpl-escala-alteracao">
  <div class="escala-alteracao">
    <div class="escala-alteracao-cabecalho">
      <span class="escala-alteracao-autor"></span>
      <span class="escala-alteracao-quando"></span>
    </div>
    <div class="escala-alteracao-resumo"></div>
  </div>
</template>

<!-- legenda da grade (Mês/Semana/Colunas/Calendário): as cores do gráfico de cobertura (vermelho = a escala
     não funciona; amarelo = funciona com erro aceitável; o texto do erro fica no painel do dia) e a faixa do
     horário; os demais grupos vêm do molde da legenda do painel (#tpl-escala-legenda) -->
<template id="tpl-escala-legenda-grade">
  <div class="escala-legenda-grupo">
    <span class="rotulo-secao">Cobertura</span>
    <div class="escala-legenda-grade">
      <span class="escala-legenda-item">
        <span class="escala-legenda-cor escala-legenda-cor--completa"></span>
        <span>Completa</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-legenda-cor escala-legenda-cor--ressalva"></span>
        <span>Com ressalva</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-legenda-cor escala-legenda-cor--erro-grave"></span>
        <span>Erro grave</span>
      </span>
    </div>
  </div>
  <div class="escala-legenda-grupo">
    <span class="rotulo-secao">Na célula</span>
    <div class="escala-legenda-grade escala-legenda-grade--uma">
      <span class="escala-legenda-item">
        <span class="escala-legenda-faixa"></span>
        <span>Horário: o trecho claro é o turno</span>
      </span>
    </div>
  </div>
</template>

<!-- legenda do modo Militares: os selos da célula e o destaque dos dias (amostras com as classes reais) -->
<template id="tpl-escala-legenda-militares">
  <div class="escala-legenda-grupo">
    <span class="rotulo-secao">Na célula</span>
    <div class="escala-legenda-grade escala-legenda-grade--duas">
      <span class="escala-legenda-item">
        <span class="escala-mil-servico">
          <span class="linha-escalado-hora-ini">08</span>
          <svg class="icone linha-escalado-hora-seta" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
          <span class="linha-escalado-hora-fim">08</span>
        </span>
        <span>Serviço</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-mil-servico">
          <svg class="icone escala-mil-servico-extra" aria-hidden="true"><use href="icones/icone-extrajornada.svg#icone-extrajornada"/></svg>
          <span class="linha-escalado-hora-ini">08</span>
          <svg class="icone linha-escalado-hora-seta" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
          <span class="linha-escalado-hora-fim">20</span>
        </span>
        <span>Extrajornada</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-mil-servico escala-mil-servico--trocado">
          <span class="linha-escalado-hora-ini">08</span>
          <svg class="icone linha-escalado-hora-seta" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
          <span class="linha-escalado-hora-fim">08</span>
        </span>
        <span>Trocado</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-mil-afast">FÉR</span>
        <span>Afastado</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-legenda-cor escala-legenda-cor--vazia"></span>
        <span>Vazio: sem serviço</span>
      </span>
    </div>
  </div>
  <div class="escala-legenda-grupo">
    <span class="rotulo-secao">Dias</span>
    <div class="escala-legenda-grade escala-legenda-grade--duas">
      <span class="escala-legenda-item">
        <span class="escala-mil-dia--hoje"><span class="escala-mil-dia-numero">12</span></span>
        <span>Hoje</span>
      </span>
      <span class="escala-legenda-item">
        <span class="escala-legenda-cor escala-legenda-cor--fds"></span>
        <span>Fim de semana</span>
      </span>
    </div>
  </div>
</template>

<!-- ===== modo Militares: grade militares (linhas) × dias do mês (colunas) ===== -->
<template id="tpl-escala-mil">
  <div class="escala-mil">
    <div class="escala-mil-grade"></div>
  </div>
</template>

<!-- cabeçalho dos dias (fixo no topo): canto + um dia por coluna -->
<template id="tpl-escala-mil-cabecalho">
  <div class="escala-mil-linha escala-mil-cabecalho">
    <div class="escala-mil-canto"></div>
  </div>
</template>

<template id="tpl-escala-mil-dia">
  <div class="escala-mil-dia">
    <span class="escala-mil-dia-semana"></span>
    <span class="escala-mil-dia-numero"></span>
  </div>
</template>

<!-- uma unidade selecionada: linha-título (recolhe/expande) + corpo com os militares -->
<template id="tpl-escala-mil-unidade">
  <div class="escala-mil-unidade">
    <div class="escala-mil-linha escala-mil-unidade-titulo">
      <button type="button" class="escala-mil-unidade-cab" aria-expanded="true">
        <svg class="icone escala-mil-unidade-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
        <span class="escala-mil-unidade-nome"></span>
        <span class="escala-mil-unidade-cidade"></span>
      </button>
    </div>
    <div class="escala-mil-unidade-corpo"></div>
  </div>
</template>

<!-- um militar: coluna fixa (avatar + grad/nome + cpf) + as células dos dias (o JS anexa) -->
<template id="tpl-escala-mil-pessoa">
  <div class="escala-mil-linha escala-mil-pessoa-linha">
    <div class="escala-mil-pessoa">
      <span class="escala-mil-avatar"></span>
      <div class="escala-mil-pessoa-textos">
        <div class="escala-mil-pessoa-topo">
          <span class="escala-mil-pessoa-grad"></span>
          <span class="escala-mil-pessoa-nome"></span>
        </div>
        <span class="escala-mil-pessoa-cpf"></span>
      </div>
    </div>
  </div>
</template>

<template id="tpl-escala-mil-celula">
  <div class="escala-mil-celula"></div>
</template>

<!-- chip de serviço numa célula: "08 →(ícone) 08" (fundo escuro, texto invertido) -->
<template id="tpl-escala-mil-servico">
  <span class="escala-mil-servico">
    <svg class="icone escala-mil-servico-extra oculto" aria-hidden="true"><use href="icones/icone-extrajornada.svg#icone-extrajornada"/></svg>
    <span class="linha-escalado-hora-ini"></span>
    <svg class="icone linha-escalado-hora-seta" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
    <span class="linha-escalado-hora-fim"></span>
  </span>
</template>

<!-- chip de afastamento (férias) numa célula -->
<template id="tpl-escala-mil-afast">
  <span class="escala-mil-afast"></span>
</template>


<!-- linha de totais: rótulo fixo + um valor por dia (o JS anexa) -->
<template id="tpl-escala-mil-total">
  <div class="escala-mil-linha escala-mil-total">
    <div class="escala-mil-total-rotulo">Efetivo de serviço</div>
  </div>
</template>

<template id="tpl-escala-mil-total-valor">
  <div class="escala-mil-total-valor"></div>
</template>

<!-- ===== painel do dia › aba Ciclo: a frase do topo (a data vem do painel) ===== -->
<template id="tpl-escala-ciclo-nota">
  <div class="nota">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-historico.svg#icone-historico"/></svg>
    <span>As mudanças desta aba valem a partir de <span class="escala-ciclo-nota-data"></span> e seguem nos próximos dias.</span>
  </div>
</template>
