<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Escala</h1>
    </div>
    <!-- ajuda da tela: os passo a passo desta página e o manual (componente geral-guia) -->
    <div class="dropdown pagina-ajuda" data-manual="escala">
      <button type="button" class="botao botao--icone" aria-label="Ajuda desta tela" data-dica="Ajuda">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      </button>
      <div class="dropdown-menu pagina-ajuda-menu"></div>
    </div>
    <!-- modos: a Minha escala (o seu mês), num grupo próprio, à frente das outras visões; os grupos valem como
         uma escolha só (escalas.js), com um traço só (data-abas-grupo). Sem visão guardada, abre no Mês. O Dia (o
         grupo inteiro) e a Semana ficam ocultos para todos (os modos continuam no código); o dia abre no painel do
         dia, que tem o Imprimir dele -->
    <div class="escala-modos" id="escala-modos" data-abas-grupo>
      <div class="abas" id="escala-modo-minha">
        <button type="button" class="aba" data-modo="minha">Minha escala</button>
      </div>
      <div class="abas oculto" id="escala-modo-principal">
        <button type="button" class="aba" data-modo="dia">Dia</button>
      </div>
      <div class="abas" id="escala-modo-visoes">
        <button type="button" class="aba aba--ativa" data-modo="mes">Mês</button>
        <button type="button" class="aba" data-modo="militares">Militares</button>
        <button type="button" class="aba oculto" data-modo="semana">Semana</button>
        <button type="button" class="aba" data-modo="colunas">Colunas</button>
      </div>
    </div>
  </div>

  <div class="pagina-subcabecalho escala-barra">
    <div class="geral-periodo">
      <button type="button" class="botao botao--icone" id="escala-periodo-anterior" aria-label="Período anterior">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-esquerda"/></svg>
      </button>
      <button type="button" class="geral-periodo-nome" id="escala-periodo-nome"></button>
      <button type="button" class="botao botao--icone" id="escala-periodo-proximo" aria-label="Próximo período">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
      </button>
      <!-- só quando o período da tela não contém hoje: volta ao período atual (escalas.js) -->
      <button type="button" class="botao geral-periodo-hoje oculto" id="escala-periodo-hoje">Hoje</button>
    </div>

    <div class="abas abas--seletor oculto" id="escala-sub-mes">
      <button type="button" class="aba aba--ativa" data-mes="agenda">Agenda</button>
      <button type="button" class="aba" data-mes="calendario">Calendário</button>
    </div>

    <div class="escala-sub-colunas oculto" id="escala-sub-colunas">
      <div class="abas abas--seletor" id="escala-colunas-tipo">
        <button type="button" class="aba aba--ativa" data-colunas-tipo="dias">Dias</button>
        <button type="button" class="aba" data-colunas-tipo="unidades">Unidades</button>
      </div>
      <div class="abas abas--seletor" id="escala-colunas-qtd">
        <button type="button" class="aba" data-colunas="2">2</button>
        <button type="button" class="aba aba--ativa" data-colunas="3">3</button>
        <button type="button" class="aba" data-colunas="4">4</button>
        <button type="button" class="aba" data-colunas="5">5</button>
      </div>
    </div>

    <div class="escala-sub-unidades oculto" id="escala-sub-unidades">
      <div class="abas abas--seletor" id="escala-unidades-abas" data-abas-multi></div>
    </div>

    <span class="espacador-flex"></span>

    <!-- botão Filtros (componente geral-filtros: um lugar por filtro, que vira uma coluna do menu; aqui só a Situação)
         nos modos Mês, Semana e Colunas; a linha "Filtros:" entra abaixo da barra. As opções vêm do escalas-filtros.js;
         Afastamentos fica fora do "Todos" e é um acréscimo (começa desmarcado) -->
    <div class="filtros oculto" id="escala-filtros">
      <div data-filtro="situacao" data-filtro-nome="Situação" data-filtro-titulo="Situação"></div>
    </div>

    <!-- busca de militar (nome/CPF/RG) nos modos de grade (Mês/Semana/Colunas/Dia); o modo Militares tem a sua própria -->
    <div class="busca oculto" id="escala-busca-geral">
      <button type="button" class="busca-modo" aria-label="Alternar entre marcar e filtrar" data-dica="Marcar">
        <svg class="icone busca-modo-marcar" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-pesquisar"/></svg>
        <svg class="icone busca-modo-filtrar" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-filtrar"/></svg>
      </button>
      <input type="text" name="busca-militar" class="busca-entrada" maxlength="100" enterkeyhint="search" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
      <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
      </button>
    </div>

    <div class="escala-sub-militares oculto" id="escala-sub-militares">
      <div class="busca" id="escala-busca-militares">
        <svg class="icone escala-busca-lupa" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-pesquisar"/></svg>
        <input type="text" class="busca-entrada" maxlength="100" enterkeyhint="search" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
        <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
        </button>
      </div>
    </div>

    <!-- ferramentas, depois do traço, em todos os modos: Legenda e Imprimir; se a barra quebrar, descem juntas -->
    <div class="escala-barra-ferramentas">
      <span class="pagina-subcabecalho-divisor" aria-hidden="true"></span>

      <!-- as unidades nos calendários (Mês › Calendário e Colunas › Dias, só no computador): lado a lado ou uma embaixo da
           outra; o ícone e a dica mostram o que o clique faz (geral-visao-grade.js) -->
      <button type="button" class="botao botao--quadrado oculto" id="escala-disposicao">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-unidades-lado-a-lado"/></svg>
      </button>

      <!-- o tamanho dos calendários (Mês › Calendário e Colunas › Dias, no computador e no celular): o botão com o tamanho
           de agora e a lista dos níveis (molde geral #tpl-calendario-tamanho; geral-calendario-tamanho.js) -->
      <div class="oculto" id="escala-tamanho"></div>

      <!-- legenda da grade (molde geral #tpl-legenda): o que cada cor, ícone e selo quer dizer; o conteúdo acompanha o modo (escalas-legenda.js) -->
      <div id="escala-legenda-grade"></div>

      <!-- imprimir: abre o painel "Imprimir escala" (datas + unidades → PDF) -->
      <button type="button" class="botao botao--quadrado" id="escala-imprimir" aria-label="Imprimir escala" data-dica="Imprimir">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-imprimir"/></svg>
      </button>
    </div>
  </div>

  <!-- as cotas que faltam distribuir, só para o administrador: a nota vermelha de cada mês na tela (geral-cotas-aviso.js) -->
  <div class="escala-cotas-aviso oculto" id="escala-cotas-aviso"></div>

  <!-- quem está de serviço e de extra no mesmo horário, só para quem administra a unidade: a nota vermelha com o X
       (escalas-extra-servico.js) -->
  <div class="escala-extra-servico-aviso oculto" id="escala-extra-servico-aviso"></div>

  <!-- com dia à vista que ainda pode mudar: a nota amarela com os pontinhos (o texto, com as unidades, vem do
       escalas-atualizando.js); esses dias ficam com a borda amarela -->
  <div class="nota nota--alerta escala-atualizando oculto" role="status">
    <span class="carregando-pontos" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
    <span class="nota-texto escala-atualizando-texto"></span>
  </div>

  <div class="pagina-corpo pagina-corpo--colado"></div>

  <!-- o Salvar das mudanças do painel do dia (as abas Funções, Militares, Guarnições e Extrajornada;
       escalas-painel-salvar.js), na largura toda (embaixo do painel direito também): aparece com mudança não salva (a
       frase vem do JS) e enquanto há o que refazer; o Desfazer e o Refazer da aba aberta (também Ctrl+Z e Ctrl+Y) à
       esquerda do Cancelar -->
  <div class="rodape rodape-linha rodape--largo escala-rodape-salvar oculto">
    <span class="rodape-texto escala-rodape-salvar-texto"></span>
    <span class="espacador-flex"></span>
    <div class="rodape-historico">
      <button type="button" class="botao botao--quadrado escala-painel-desfazer" aria-label="Desfazer" data-dica="Desfazer" disabled>
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-desfazer"/></svg>
      </button>
      <button type="button" class="botao botao--quadrado escala-painel-refazer" aria-label="Refazer" data-dica="Refazer" disabled>
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-refazer"/></svg>
      </button>
    </div>
    <div class="rodape-acoes">
      <button type="button" class="botao escala-painel-cancelar">Cancelar</button>
      <button type="button" class="botao botao--primario escala-painel-salvar">Salvar</button>
    </div>
  </div>
</div>


<!-- Minha escala: o seu mês no calendário (os ícones da Escala em cada dia) e, ao lado (embaixo, no celular),
     a escala inteira da unidade no dia escolhido, só de leitura, com você realçado (o desenho do Dia), e, no cabeçalho
     dela, o Solicitar troca (o painel do pedido da página Trocas, no mês do dia).
     O mês sem serviço diz por quê e leva à escala de todos (escalas-minha.js). Em cima do mês, a guarnição dele hoje
     ("Você é da guarnição B"; afastado, "Volta na guarnição B em 03/12"; o texto vem do JS) -->
<template id="tpl-escala-minha">
  <div class="escala-minha">
    <div class="escala-minha-esquerda">
      <span class="escala-minha-guarnicao oculto"></span>
      <section class="escala-minha-calendario"></section>
      <div class="nota escala-minha-sem-servico oculto">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-escalas"/></svg>
        <span class="nota-texto escala-minha-sem-servico-texto"></span>
        <button type="button" class="botao escala-minha-ver-todos">Ver a escala de todos</button>
      </div>
    </div>
    <section class="escala-minha-dia oculto">
      <div class="escala-minha-dia-cabeca">
        <div class="escala-minha-dia-textos">
          <span class="escala-minha-dia-titulo"></span>
          <span class="escala-minha-dia-unidade"></span>
        </div>
        <button type="button" class="botao botao--primario escala-minha-solicitar">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-trocas"/></svg>
          <span>Solicitar troca</span>
        </button>
      </div>
      <div class="escala-minha-dia-corpo"></div>
    </section>
  </div>
</template>

<!-- modo Dia: árvore de unidades com a distribuição do dia (postos → funções) -->
<template id="tpl-escala-dia">
  <div class="pagina-corpo-rolagem">
    <div class="arvore arvore-unidades" id="arvore-escala-dia"></div>
  </div>
</template>

<!-- ===== modo Colunas → Unidades: grade dias (linhas) × unidades (colunas) =====
     (o Colunas → Dias é o calendário contínuo: componente geral-calendario-mes + tpl-escala-calendario-unidade) -->
<template id="tpl-escala-colunas">
  <div class="escala-colunas">
    <div class="escala-colunas-grade"></div>
  </div>
</template>

<!-- cabeçalho (fixo no topo): canto + uma unidade por coluna -->
<template id="tpl-escala-colunas-cabecalho">
  <div class="escala-colunas-linha escala-colunas-cabecalho">
    <div class="escala-colunas-canto"></div>
  </div>
</template>

<!-- cabeçalho de coluna = unidade -->
<template id="tpl-escala-colunas-cab-unidade">
  <div class="escala-colunas-cab-unidade"></div>
</template>

<!-- uma linha: rótulo fixo (o dia) + as células (o JS anexa, reusa tpl-escala-mes-celula); no alto da faixa, o Oficial de
     Área do dia, centralizado em cima das unidades (escalas-colunas.js) -->
<template id="tpl-escala-colunas-linha">
  <div class="escala-colunas-linha">
    <div class="escala-colunas-oficial oculto"></div>
  </div>
</template>

<!-- rótulo de linha = dia -->
<template id="tpl-escala-colunas-rotulo-dia">
  <div class="escala-colunas-rotulo-dia">
    <span class="escala-colunas-rotulo-semana"></span>
    <span class="escala-colunas-rotulo-numero"></span>
  </div>
</template>

<!-- ===== modo Semana: grade unidades (linhas) × 7 dias (colunas) ===== -->
<template id="tpl-escala-semana">
  <div class="escala-semana">
    <div class="escala-semana-grade"></div>
  </div>
</template>

<!-- cabeçalho dos dias (fixo no topo): canto + um dia por coluna -->
<template id="tpl-escala-semana-cabecalho">
  <div class="escala-semana-linha escala-semana-cabecalho">
    <div class="escala-semana-canto"></div>
  </div>
</template>

<template id="tpl-escala-semana-dia">
  <div class="escala-semana-dia">
    <span class="escala-semana-dia-semana"></span>
    <span class="escala-semana-dia-numero"></span>
  </div>
</template>

<!-- uma unidade: coluna fixa (nome + cidade) + as células dos dias (o JS anexa, reusa tpl-escala-mes-celula) -->
<template id="tpl-escala-semana-linha">
  <div class="escala-semana-linha">
    <div class="escala-semana-unidade">
      <span class="escala-semana-unidade-nome"></span>
      <span class="escala-semana-unidade-cidade"></span>
    </div>
  </div>
</template>


<!-- Como a escala foi feita (subcabeçalho do painel do dia, à esquerda do Imprimir; escalas-painel-como.js): abre o texto
     numa sub-tela, no lugar da lista do dia, com o Voltar ao dia. Desligado com alteração não salva (a dica diz o motivo) -->
<template id="tpl-escala-dia-como">
  <button type="button" class="botao botao--icone escala-dia-como" aria-label="Como a escala foi feita" data-dica="Como a escala foi feita">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-distribuicao"/></svg>
  </button>
</template>

<!-- Como a escala foi feita, a sub-tela (escalas-painel-como.js): a nota com o título e as caixas por assunto, no molde
     das Observações. O JS põe as frases de cada caixa (RosterWork.mensagens.escalaComo) e esconde a caixa sem frase;
     as frases fixas moram aqui -->
<template id="tpl-escala-como">
  <div class="escala-como">
    <div class="nota">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-distribuicao"/></svg>
      <span class="nota-texto"><span class="nota-titulo" data-como-titulo></span></span>
    </div>
    <div class="grupo-caixa" data-como-caixa="servico">
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">Quem está de serviço</span></div>
      <div class="escala-observacao-grupo"><ol class="escala-observacao-lista" data-como-lista></ol></div>
    </div>
    <div class="grupo-caixa" data-como-caixa="chefe">
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">Chefe de Socorro</span></div>
      <div class="escala-observacao-grupo"><ol class="escala-observacao-lista" data-como-lista></ol></div>
    </div>
    <div class="grupo-caixa" data-como-caixa="condutores">
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">Condutores</span></div>
      <div class="escala-observacao-grupo"><ol class="escala-observacao-lista" data-como-lista></ol></div>
    </div>
    <div class="grupo-caixa" data-como-caixa="outras">
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">Outras funções</span></div>
      <div class="escala-observacao-grupo"><ol class="escala-observacao-lista" data-como-lista></ol></div>
    </div>
    <div class="grupo-caixa" data-como-caixa="efetivos">
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">Efetivos</span></div>
      <div class="escala-observacao-grupo">
        <ol class="escala-observacao-lista" data-como-lista>
          <li class="escala-observacao" data-como-fixo><span class="escala-observacao-texto">Nos Efetivos de cada viatura, o número menor vai ao mais antigo.</span></li>
        </ol>
      </div>
    </div>
    <div class="grupo-caixa" data-como-caixa="problemas" data-como-sempre>
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">O que não deu para cumprir</span></div>
      <div class="escala-observacao-grupo">
        <ol class="escala-observacao-lista" data-como-lista>
          <li class="escala-observacao oculto" data-como-vazio><span class="escala-observacao-texto">Tudo foi cumprido.</span></li>
        </ol>
      </div>
    </div>
    <div class="grupo-caixa" data-como-caixa="regras" data-como-sempre>
      <div class="escala-observacoes-titulo"><span class="rotulo-secao">A ordem das regras</span></div>
      <div class="escala-observacao-grupo">
        <ol class="escala-observacao-lista">
          <li class="escala-observacao"><span class="escala-observacao-texto">Primeiro, nenhum posto abaixo do mínimo; depois, cada um na função da sua graduação; não trocar o condutor nem o Rádio no meio do plantão; não repetir o Rádio e o Rancho; e, por último, a antiguidade.</span></li>
        </ol>
      </div>
    </div>
  </div>
</template>

<!-- uma frase do Como a escala foi feita (a sub-tela e a caixa da função) -->
<template id="tpl-escala-como-item">
  <li class="escala-observacao"><span class="escala-observacao-texto"></span></li>
</template>

<!-- o nome da função do painel do dia, clicável na Escala (escalas-painel-como.js): os rótulos entram no botão, que abre a
     caixa flutuante com quem está na função e o motivo (no celular, a folha) -->
<template id="tpl-escala-como-rotulo">
  <button type="button" class="botao-discreto escala-como-rotulo" data-dica="Como foi escolhido"></button>
</template>

<!-- o conteúdo da caixa da função: o título (no celular, ele vai na folha) e as frases; nos Efetivos, a regra do número -->
<template id="tpl-escala-como-funcao">
  <div class="escala-como-funcao">
    <span class="escala-observacao-grupo-nome escala-como-funcao-titulo"></span>
    <div class="escala-observacao-grupo">
      <ol class="escala-observacao-lista" data-como-lista>
        <li class="escala-observacao oculto" data-como-efetivos><span class="escala-observacao-texto">Nos Efetivos de cada viatura, o número menor vai ao mais antigo.</span></li>
      </ol>
    </div>
  </div>
</template>

<!-- Imprimir do painel do dia (subcabeçalho da aba Dia, à direita; escalas-impressao.js): abre o mesmo formulário
     numa sub-tela, já marcado com o dia e a unidade do painel. Desligado com alteração não salva (a dica diz o motivo) -->
<template id="tpl-escala-dia-imprimir">
  <button type="button" class="botao botao--icone escala-dia-imprimir" aria-label="Imprimir o dia" data-dica="Imprimir">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-imprimir"/></svg>
  </button>
</template>

<!-- Solicitar troca do painel do dia (subcabeçalho da aba Dia, à esquerda; para o admin, à direita do menu Editar o dia;
     escalas-painel-troca.js): o formulário da troca no lugar da lista, o mesmo do Solicitar troca da página Trocas -->
<template id="tpl-escala-dia-solicitar">
  <button type="button" class="botao botao--primario escala-dia-solicitar">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-trocas"/></svg>
    <span>Solicitar troca</span>
  </button>
</template>

<!-- bloco "Lançar no SYSBM" do painel do dia (no fim da seção Dia; só quem administra o pelotão; escalas-sysbm.js).
     O envio é só pelo Firefox, com a extensão Roster Work. Fora do Firefox: o título e o aviso (no
     data-sysbm-situacao). No Firefox sem a extensão: o título e o Instalar a extensão (a página dela na loja da Mozilla, noutra aba;
