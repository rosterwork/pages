<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Escala</h1>
    </div>
    <!-- ajuda da tela: os passo a passo desta página e o manual (componente geral-guia) -->
    <div class="dropdown pagina-ajuda" data-manual="escala">
      <button type="button" class="botao botao--icone" aria-label="Ajuda desta tela" data-dica="Ajuda">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      </button>
      <div class="dropdown-menu pagina-ajuda-menu"></div>
    </div>
    <!-- modos: a Minha escala (o seu mês) e o Dia (a escala principal, impressa e exibida na passagem de
         serviço), cada um num grupo próprio, à frente das outras visões; os grupos valem como uma escolha só
         (escalas.js), com um traço só (data-abas-grupo). Sem visão guardada, abre no Mês. No celular ficam
         a Minha escala, o Dia e o Mês (Agenda e Calendário): o que tem .escala-so-computador some lá
         (escalas-controles.css). A Semana fica oculta para todos (o modo continua no código) -->
    <div class="escala-modos" id="escala-modos" data-abas-grupo>
      <div class="abas" id="escala-modo-minha">
        <button type="button" class="aba" data-modo="minha">Minha escala</button>
      </div>
      <div class="abas" id="escala-modo-principal">
        <button type="button" class="aba" data-modo="dia">Dia</button>
      </div>
      <div class="abas" id="escala-modo-visoes">
        <button type="button" class="aba escala-so-computador" data-modo="militares">Militares</button>
        <button type="button" class="aba aba--ativa" data-modo="mes">Mês</button>
        <button type="button" class="aba escala-so-computador oculto" data-modo="semana">Semana</button>
        <button type="button" class="aba escala-so-computador" data-modo="colunas">Colunas</button>
      </div>
    </div>
  </div>

  <div class="pagina-subcabecalho">
    <div class="geral-periodo">
      <button type="button" class="botao botao--icone" id="escala-periodo-anterior" aria-label="Período anterior">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-esquerda"/></svg>
      </button>
      <button type="button" class="geral-periodo-nome" id="escala-periodo-nome"></button>
      <button type="button" class="botao botao--icone" id="escala-periodo-proximo" aria-label="Próximo período">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
      </button>
      <!-- só quando o período da tela não contém hoje: volta ao período atual (escalas.js) -->
      <button type="button" class="botao geral-periodo-hoje oculto" id="escala-periodo-hoje">Hoje</button>
    </div>

    <div class="abas abas--seletor oculto" id="escala-sub-mes">
      <button type="button" class="aba aba--ativa" data-mes="agenda">Agenda</button>
      <button type="button" class="aba" data-mes="calendario">Calendário</button>
    </div>

    <div class="escala-sub-colunas oculto" id="escala-sub-colunas">
      <div class="abas abas--seletor" id="escala-colunas-tipo">
        <button type="button" class="aba aba--ativa" data-colunas-tipo="dias">Dias</button>
        <button type="button" class="aba" data-colunas-tipo="unidades">Unidades</button>
      </div>
      <div class="abas abas--seletor" id="escala-colunas-qtd">
        <button type="button" class="aba" data-colunas="2">2</button>
        <button type="button" class="aba aba--ativa" data-colunas="3">3</button>
        <button type="button" class="aba" data-colunas="4">4</button>
        <button type="button" class="aba" data-colunas="5">5</button>
      </div>
    </div>

    <div class="escala-sub-unidades oculto" id="escala-sub-unidades">
      <div class="abas abas--seletor" id="escala-unidades-abas" data-abas-multi></div>
    </div>

    <span class="espacador-flex"></span>

    <!-- botão Filtros (componente geral-filtros: um lugar por filtro, que vira uma coluna do menu; aqui só a Situação)
         nos modos Mês, Semana e Colunas; a linha "Filtros:" entra abaixo da barra. As opções vêm do escalas-filtros.js;
         Afastamentos fica fora do "Todos" e é um acréscimo (começa desmarcado) -->
    <div class="filtros oculto" id="escala-filtros">
      <div data-filtro="situacao" data-filtro-nome="Situação" data-filtro-titulo="Situação"></div>
    </div>

    <!-- busca de militar (nome/CPF/RG) nos modos de grade (Mês/Semana/Colunas/Dia); o modo Militares tem a sua própria -->
    <div class="busca oculto" id="escala-busca-geral">
      <button type="button" class="busca-modo" aria-label="Alternar entre marcar e filtrar" data-dica="Marcar">
        <svg class="icone busca-modo-marcar" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-pesquisar"/></svg>
        <svg class="icone busca-modo-filtrar" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-filtrar"/></svg>
      </button>
      <input type="text" name="busca-militar" class="busca-entrada" maxlength="100" enterkeyhint="search" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
      <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
      </button>
    </div>

    <div class="escala-sub-militares oculto" id="escala-sub-militares">
      <div class="busca" id="escala-busca-militares">
        <svg class="icone escala-busca-lupa" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-pesquisar"/></svg>
        <input type="text" class="busca-entrada" maxlength="100" enterkeyhint="search" placeholder="Pesquisar militar" aria-label="Pesquisar militar" />
        <button type="button" class="busca-limpar" aria-label="Limpar pesquisa">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-fechar"/></svg>
        </button>
      </div>
    </div>

    <!-- ferramentas, depois do traço, em todos os modos: Legenda e Imprimir -->
    <span class="pagina-subcabecalho-divisor" aria-hidden="true"></span>

    <!-- legenda da grade (molde geral #tpl-legenda): o que cada cor, ícone e selo quer dizer; o conteúdo acompanha o modo (escalas-legenda.js) -->
    <div id="escala-legenda-grade"></div>

    <!-- imprimir: abre o painel "Imprimir escala" (datas + unidades → PDF) -->
    <button type="button" class="botao botao--quadrado" id="escala-imprimir" aria-label="Imprimir escala" data-dica="Imprimir">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-imprimir"/></svg>
    </button>
  </div>

  <div class="pagina-corpo pagina-corpo--colado"></div>
</div>

<!-- uma aba solta (o texto vem do JS): as unidades do Colunas › Unidades e da faixa do celular, e as semanas do Imprimir -->
<template id="tpl-escala-aba-unidade">
  <button type="button" class="aba"></button>
</template>

<!-- Minha escala: o seu mês no calendário (os ícones da Escala em cada dia) e, ao lado (embaixo, no celular),
     a escala inteira da unidade no dia escolhido, só de leitura, com você realçado (o desenho do Dia).
     O mês sem serviço diz por quê e leva à escala de todos (escalas-minha.js) -->
<template id="tpl-escala-minha">
  <div class="escala-minha">
    <div class="escala-minha-esquerda">
      <section class="escala-minha-calendario"></section>
      <div class="nota escala-minha-sem-servico oculto">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-escalas"/></svg>
        <span class="nota-texto escala-minha-sem-servico-texto"></span>
        <button type="button" class="botao escala-minha-ver-todos">Ver a escala de todos</button>
      </div>
    </div>
    <section class="escala-minha-dia oculto">
      <div class="escala-minha-dia-cabeca">
        <span class="escala-minha-dia-titulo"></span>
        <span class="escala-minha-dia-unidade"></span>
      </div>
      <div class="escala-minha-dia-corpo"></div>
    </section>
  </div>
</template>

<!-- modo Dia: árvore de unidades com a distribuição do dia (postos → funções) -->
<template id="tpl-escala-dia">
  <div class="pagina-corpo-rolagem">
    <div class="arvore arvore-unidades" id="arvore-escala-dia"></div>
  </div>
</template>

<!-- ===== modo Colunas → Unidades: grade dias (linhas) × unidades (colunas) =====
     (o Colunas → Dias é o calendário contínuo: componente geral-calendario-mes + tpl-escala-calendario-unidade) -->
<template id="tpl-escala-colunas">
  <div class="escala-colunas">
    <div class="escala-colunas-grade"></div>
  </div>
</template>

<!-- cabeçalho (fixo no topo): canto + uma unidade por coluna -->
<template id="tpl-escala-colunas-cabecalho">
  <div class="escala-colunas-linha escala-colunas-cabecalho">
    <div class="escala-colunas-canto"></div>
  </div>
</template>

<!-- cabeçalho de coluna = unidade -->
<template id="tpl-escala-colunas-cab-unidade">
  <div class="escala-colunas-cab-unidade"></div>
</template>

<!-- uma linha: rótulo fixo (o dia) + as células (o JS anexa, reusa tpl-escala-mes-celula) -->
<template id="tpl-escala-colunas-linha">
  <div class="escala-colunas-linha"></div>
</template>

<!-- rótulo de linha = dia -->
<template id="tpl-escala-colunas-rotulo-dia">
  <div class="escala-colunas-rotulo-dia">
    <span class="escala-colunas-rotulo-semana"></span>
    <span class="escala-colunas-rotulo-numero"></span>
  </div>
</template>

<!-- ===== modo Semana: grade unidades (linhas) × 7 dias (colunas) ===== -->
<template id="tpl-escala-semana">
  <div class="escala-semana">
    <div class="escala-semana-grade"></div>
  </div>
</template>

<!-- cabeçalho dos dias (fixo no topo): canto + um dia por coluna -->
<template id="tpl-escala-semana-cabecalho">
  <div class="escala-semana-linha escala-semana-cabecalho">
    <div class="escala-semana-canto"></div>
  </div>
</template>

<template id="tpl-escala-semana-dia">
  <div class="escala-semana-dia">
    <span class="escala-semana-dia-semana"></span>
    <span class="escala-semana-dia-numero"></span>
  </div>
</template>

<!-- uma unidade: coluna fixa (nome + cidade) + as células dos dias (o JS anexa, reusa tpl-escala-mes-celula) -->
<template id="tpl-escala-semana-linha">
  <div class="escala-semana-linha">
    <div class="escala-semana-unidade">
      <span class="escala-semana-unidade-nome"></span>
      <span class="escala-semana-unidade-cidade"></span>
    </div>
  </div>
</template>

<!-- painel "Imprimir escala" (botão do sub-cabeçalho; escalas-impressao.js): datas De/Até (já com o dia exibido)
     + atalhos, a árvore de unidades (já marcada com o seletor), o resumo e o aviso de erro grave -->
<template id="tpl-escala-impressao">
  <div class="painel-secao">
    <span class="rotulo-secao">Datas</span>
    <div class="escala-impressao-datas">
      <label class="campo">
        <span class="campo-rotulo">De</span>
        <input class="campo-entrada" type="text" name="impressao-inicio" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-impressao-inicio />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Até</span>
        <input class="campo-entrada" type="text" name="impressao-fim" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-impressao-fim />
        <span class="campo-erro-texto"></span>
      </label>
    </div>
    <div class="escala-impressao-atalhos">
      <button type="button" class="botao botao--pequeno" data-impressao-atalho="dia">Só este dia</button>
      <button type="button" class="botao botao--pequeno" data-impressao-atalho="semana">7 dias</button>
      <button type="button" class="botao botao--pequeno" data-impressao-atalho="mes">Até o fim do mês</button>
    </div>
    <span class="campo-ajuda">Até 31 dias por arquivo. Cada dia começa numa folha nova.</span>
  </div>
  <div class="painel-secao">
    <span class="rotulo-secao">Unidades</span>
    <div class="campo">
      <div class="arvore" data-impressao-arvore></div>
      <span class="campo-erro-texto"></span>
    </div>
  </div>
  <div class="painel-secao">
    <span class="rotulo-secao">O que vai sair</span>
    <span class="campo-ajuda" data-impressao-resumo></span>
    <div class="impacto-aviso impacto-aviso--problema oculto" data-impressao-aviso>
      <svg class="icone impacto-aviso-icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-alerta"/></svg>
      <span class="impacto-aviso-textos">
        <span class="impacto-aviso-titulo"></span>
        <span class="impacto-aviso-desc"></span>
      </span>
    </div>
  </div>
</template>
<template id="tpl-escala-impressao-acoes">
  <button type="button" class="botao" data-impressao-cancelar>Cancelar</button>
  <button type="button" class="botao botao--primario" data-impressao-gerar>Gerar PDF</button>
</template>

<!-- bloco "Lançar no SYSBM" do painel do dia (no fim da seção Dia; só quem administra o pelotão; escalas-sysbm.js).
     O envio é só pelo Firefox, com a extensão Roster Work. Fora do Firefox: o título e o aviso (no
     data-sysbm-situacao). No Firefox sem a extensão: o título e o Instalar a extensão (a página dela na loja da Mozilla, noutra aba;
     instalada, o bloco troca sozinho para o Enviar).
     Com a extensão, fechado: o título, o Enviar e o chevron; embaixo, se alguém fica de fora, a linha amarela, e
     depois de enviar (ou se a leitura falhou), o que fazer. Aberto pelo chevron: o resumo, quem fica de fora e por quê
     e a explicação -->
<template id="tpl-escala-sysbm">
  <div class="grupo-caixa escala-sysbm">
    <div class="escala-sysbm-cabecalho">
      <span class="rotulo-secao escala-sysbm-titulo">Lançar no SYSBM</span>
      <button type="button" class="botao escala-sysbm-enviar" data-sysbm-enviar>Enviar</button>
      <a class="botao escala-sysbm-instalar oculto" href="https://addons.mozilla.org/firefox/addon/roster-work/" target="_blank" rel="noopener" data-sysbm-instalar>Instalar a extensão</a>
      <button type="button" class="botao-discreto escala-sysbm-toggle" aria-label="Mostrar ou ocultar o resumo e a explicação" aria-expanded="false" data-sysbm-toggle>
        <svg class="icone escala-sysbm-seta" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
    </div>
    <span class="escala-sysbm-aviso oculto" data-sysbm-fora></span>
    <span class="campo-ajuda oculto" data-sysbm-situacao></span>
    <div class="escala-sysbm-conteudo oculto" data-sysbm-conteudo>
      <span class="campo-ajuda" data-sysbm-resumo></span>
      <div class="escala-sysbm-avisos" data-sysbm-avisos></div>
      <span class="campo-ajuda">O Enviar leva a escala deste dia e abre o SYSBM em outra aba. Lá, faça seu login, se ele pedir: a extensão abre o cadastro da escala do dia e preenche a aba do pelotão. Confira e clique em Salvar lá.</span>
    </div>
  </div>
</template>

<!-- quem fica de fora do SYSBM e por quê (uma frase por motivo, no bloco aberto) -->
<template id="tpl-escala-sysbm-aviso">
  <span class="escala-sysbm-aviso"></span>
</template>

<!-- painel "Imprimir" das grades (Agenda, Calendário, Colunas; escalas-impressao-grade.js; o rodapé é o
     tpl-escala-impressao-acoes): sai o que está na tela, e a nota do alto resume (a grade, o mês, as unidades e os
     filtros). Nas caixas numeradas (o número vem do JS, data-impressao-num): o formato, o período (semanas no
     Calendário, dias na Agenda e no Colunas › Dias, pelo data-impressao-so; o Colunas › Unidades não tem, sai a
     semana da tela), o que mostrar em cada célula e a prévia (o próprio PDF, no leitor do navegador) -->
<template id="tpl-escala-impressao-grade">
  <div class="nota">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-imprimir"/></svg>
    <span class="nota-texto"><span class="nota-titulo">Sai o que está na tela:</span> <span data-impressao-resumo></span></span>
  </div>
  <div class="grupo-caixa">
    <span class="rotulo-secao"><span data-impressao-num></span>. Formato</span>
    <div class="escala-impressao-linha">
      <span class="escala-impressao-rotulo">Arquivo</span>
      <div class="abas abas--seletor" data-impressao-formato>
        <button type="button" class="aba aba--ativa" data-formato="folhas">Folhas A4</button>
        <button type="button" class="aba" data-formato="continua">Página contínua</button>
      </div>
    </div>
    <span class="campo-ajuda">Folhas A4 para imprimir. Página contínua para ver na tela: uma página só, sem quebras.</span>
  </div>
  <div class="grupo-caixa" data-impressao-periodo-caixa>
    <span class="rotulo-secao" data-impressao-so="semanas"><span data-impressao-num></span>. Semanas</span>
    <span class="rotulo-secao" data-impressao-so="dias"><span data-impressao-num></span>. Dias</span>
    <!-- semanas: "Mês todo" marcado = o mês inteiro, sem mais nada; desmarcado, aparecem os botões das semanas do
         mês (de marcar vários; o JS clona o tpl-escala-aba-unidade) e a frase com as datas -->
    <button type="button" class="arvore-linha escala-impressao-marcar" role="checkbox" aria-checked="true" data-impressao-so="semanas" data-impressao-mes-todo>
      <span class="caixa-selecao caixa-selecao--marcada" aria-hidden="true"><svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg></span>
      <span class="arvore-nome">Mês todo</span>
    </button>
    <div class="abas abas--seletor oculto" data-abas-multi data-impressao-semanas></div>
    <!-- dias: as listas só oferecem os dias que o mês tem; o "ao dia", do "Do dia" em diante -->
    <div class="escala-impressao-linha escala-impressao-linha--inicio" data-impressao-so="dias">
      <span class="escala-impressao-rotulo">Do dia</span>
      <div class="dropdown" data-impressao-dia="de">
        <button type="button" class="campo-entrada campo-selecao" aria-label="Do dia">
          <span class="campo-selecao-texto"></span>
          <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
        </button>
        <div class="dropdown-menu"></div>
      </div>
      <span class="escala-impressao-rotulo">ao dia</span>
      <div class="dropdown" data-impressao-dia="ate">
        <button type="button" class="campo-entrada campo-selecao" aria-label="Ao dia">
          <span class="campo-selecao-texto"></span>
          <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
        </button>
        <div class="dropdown-menu"></div>
      </div>
    </div>
    <!-- a frase com as datas: só quando não sai o mês todo -->
    <span class="campo-ajuda oculto" data-impressao-periodo></span>
  </div>
  <div class="grupo-caixa">
    <span class="rotulo-secao"><span data-impressao-num></span>. Mostrar</span>
    <button type="button" class="arvore-linha escala-impressao-marcar" role="checkbox" aria-checked="true" data-mostrar="grafico">
      <span class="caixa-selecao caixa-selecao--marcada" aria-hidden="true"><svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg></span>
      <span class="arvore-nome">Gráfico de cobertura</span>
    </button>
    <button type="button" class="arvore-linha escala-impressao-marcar" role="checkbox" aria-checked="true" data-mostrar="icones">
      <span class="caixa-selecao caixa-selecao--marcada" aria-hidden="true"><svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg></span>
      <span class="arvore-nome">Ícones de origem</span>
    </button>
    <button type="button" class="arvore-linha escala-impressao-marcar" role="checkbox" aria-checked="true" data-mostrar="faixa">
      <span class="caixa-selecao caixa-selecao--marcada" aria-hidden="true"><svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg></span>
      <span class="arvore-nome">Faixa do horário</span>
    </button>
    <span class="campo-ajuda">Igual à tela. Desmarque o que não quiser no papel.</span>
  </div>
  <div class="grupo-caixa escala-impressao-previa-secao">
