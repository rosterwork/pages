<!-- notas fixas do alto de cada bloco -->
<template id="tpl-nova-distribuicao-nota-postos">
  <p class="nova-distribuicao-ajuda">Quais postos a unidade tem, com o prefixo e a CNH das viaturas. O efetivo de cada posto fica no bloco Efetivo.</p>
</template>
<template id="tpl-nova-distribuicao-nota-efetivo">
  <p class="nova-distribuicao-ajuda">O mínimo, o ideal e o máximo dizem quantas funções o posto tem e o aviso quando alguma fica vazia. Mínimo 0 é reserva: vazia, fica fora da escala.</p>
</template>
<template id="tpl-nova-distribuicao-nota-funcoes">
  <p class="nova-distribuicao-ajuda">O Oficial de Área é sempre o oficial mais antigo de serviço, e o Chefe de Socorro, o praça mais antigo.</p>
</template>
<template id="tpl-nova-distribuicao-nota-acumulos">
  <p class="nova-distribuicao-ajuda">Funções que são sempre da mesma pessoa. Elas não precisam de gente própria e entram na linha dessa pessoa na ordem de importância.</p>
</template>
<template id="tpl-nova-distribuicao-nota-ordem">
  <p class="nova-distribuicao-ajuda">Cada linha é uma pessoa. Com N militares de serviço, enchem as N primeiras linhas; quem sobra fica sem função.</p>
</template>
<template id="tpl-nova-distribuicao-nota-substitutos">
  <p class="nova-distribuicao-ajuda">Quando a função fica sem gente, o 1º substituto que estiver de serviço faz as duas. A função sem substituto fica vazia.</p>
</template>
<template id="tpl-nova-distribuicao-nota-escolher">
  <p class="nova-distribuicao-ajuda">As funções escolhem na ordem de importância. Por isso, "o mais antigo que ainda não tem função" da 2ª linha é o 2º mais antigo.</p>
</template>
<template id="tpl-nova-distribuicao-nota-regras">
  <p class="nova-distribuicao-ajuda">Regras de um militar só para este teste. As regras da página Distribuição não mudam.</p>
</template>
<template id="tpl-nova-distribuicao-nota-viaturas">

</template>
