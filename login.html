<!DOCTYPE html>
<html lang="pt-br" data-celular>
<head>
  <meta charset="utf-8" />
  <!-- política de segurança: o navegador só aceita código, estilo e dados do próprio site e do banco (REGRAS §3, item 11) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://oadzjrekpuddagfydfzn.supabase.co; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'" />
  <!-- abre a conexão com o banco enquanto a página ainda carrega (a primeira consulta não espera por ela) -->
  <link rel="preconnect" href="https://oadzjrekpuddagfydfzn.supabase.co" crossorigin />
  <!-- a largura do aparelho + a marca data-celular no <html>: os tamanhos do celular valem para todos nesta tela -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Entrar no Roster Work — sistema de escala de serviço." />
  <link rel="icon" href="icones/logo-aba.svg" type="image/svg+xml" />
  <!-- app instalável no celular: manifesto, ícone do iPhone e o nome na tela de início -->
  <link rel="manifest" href="aplicativo.webmanifest" />
  <link rel="apple-touch-icon" href="logos/aplicativo-180.png" />
  <meta name="apple-mobile-web-app-title" content="Roster Work" />
  <!-- a cor da faixa do Android no app: o geral-tema.js preenche com o --fundo-pagina do tema em uso -->
  <meta name="theme-color" content="" />
  <title>Login — Roster Work</title>
  <script src="componentes/js/geral-tema.js"></script>
  <script src="componentes/js/geral-aplicativo.js"></script>
  <script src="componentes/js/geral-conectado.js"></script>
  <script src="componentes/js/geral-entrada.js"></script>
  <script src="js/login-sessao.js"></script>
  <link rel="stylesheet" href="css/geral-tema.css" />
  <link rel="stylesheet" href="css/geral-base.css" />
  <link rel="stylesheet" href="componentes/css/geral-botao.css" />
  <link rel="stylesheet" href="componentes/css/geral-campo.css" />
  <link rel="stylesheet" href="componentes/css/geral-carregando.css" />
  <link rel="stylesheet" href="componentes/css/geral-arvore.css" />
  <link rel="stylesheet" href="css/login-pagina.css" />
</head>
<body>

  <noscript>
    <p>O Roster Work precisa de JavaScript ativado para funcionar. Ative o JavaScript no navegador e recarregue a página.</p>
  </noscript>

  <div class="login-fundo">
    <div class="login-card">

      <div class="login-logo">
        <svg viewBox="0 0 186.44 96.312" fill="currentColor" preserveAspectRatio="xMidYMid meet">
          <use href="icones/icone-logo.svg#icone-logo"></use>
        </svg>
      </div>

      <div class="login-formulario">
        <!-- o login lembrado deixou de valer (saiu de todos os aparelhos, baixa, senha trocada) -->
        <p class="login-aviso oculto" id="login-aviso" role="alert"></p>

        <div class="login-campos">

          <div class="campo">
            <label class="campo-rotulo" for="entrada-identificador">CPF ou RG</label>
            <input class="campo-entrada" type="text" id="entrada-identificador" name="identificador" autocomplete="username" />
            <span class="campo-erro-texto" role="alert"></span>
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="entrada-senha">Senha</label>
            <input class="campo-entrada" type="password" id="entrada-senha" name="senha" autocomplete="current-password" />
            <span class="campo-erro-texto" role="alert"></span>
          </div>

          <!-- login lembrado neste aparelho (geral-conectado): 7 dias sem uso, 30 no app do celular, onde já vem marcada -->
          <div class="login-conectado">
            <div class="login-conectado-linha">
              <button type="button" class="caixa-selecao" id="login-conectado" role="checkbox" aria-checked="false" aria-labelledby="login-conectado-rotulo">
                <svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
              </button>
              <span class="login-conectado-rotulo" id="login-conectado-rotulo">Manter-me conectado neste dispositivo</span>
            </div>
            <span class="campo-ajuda">Não marque em computador de uso coletivo.</span>
          </div>

        </div>

        <button class="botao botao--primario" id="btn-entrar" type="button">Entrar</button>

        <div class="login-links">
          <!-- "Fale conosco" fica oculto até a página dele existir; até lá, o espaço mostra a versão do sistema -->
          <button class="botao botao--texto oculto" type="button" id="btn-fale-conosco">Fale conosco</button>
          <p class="login-versao">Roster Work Versão 1.1.0</p>
        </div>
      </div>

    </div>
  </div>

  <template id="carregando-pontos">
    <span class="carregando-pontos" aria-label="Carregando">
      <span>.</span><span>.</span><span>.</span>
    </span>
  </template>

  <script src="componentes/js/geral-carregando.js"></script>
  <script src="componentes/js/geral-mensagens.js"></script>
  <script src="js/login-auth.js"></script>
  <script src="js/login-main.js"></script>

</body>
</html>
