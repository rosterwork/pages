<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920" />
  <meta name="description" content="Roster Work — sistema de escala de serviço da corporação." />
  <link rel="icon" href="icones/icone-logo.svg" type="image/svg+xml" />
  <title>Roster Work</title>
  <script src="js/index-sessao.js"></script>
  <link rel="stylesheet" href="css/geral-tema.css" />
  <link rel="stylesheet" href="css/geral-base.css" />
  <link rel="stylesheet" href="componentes/css/geral-botao.css" />
  <link rel="stylesheet" href="componentes/css/geral-campo.css" />
  <link rel="stylesheet" href="componentes/css/geral-carregando.css" />
  <link rel="stylesheet" href="componentes/css/geral-dica.css" />
  <link rel="stylesheet" href="componentes/css/geral-flutuante.css" />
  <link rel="stylesheet" href="componentes/css/geral-dropdown.css" />
  <link rel="stylesheet" href="componentes/css/geral-dropdown-numeros.css" />
  <link rel="stylesheet" href="componentes/css/geral-modal.css" />
  <link rel="stylesheet" href="componentes/css/geral-aviso.css" />
  <link rel="stylesheet" href="componentes/css/geral-data-modal.css" />
  <link rel="stylesheet" href="componentes/css/geral-resumo.css" />
  <link rel="stylesheet" href="componentes/css/geral-arvore.css" />
  <link rel="stylesheet" href="componentes/css/geral-arvore-unidades.css" />
  <link rel="stylesheet" href="componentes/css/geral-selo.css" />
  <link rel="stylesheet" href="componentes/css/geral-busca.css" />
  <link rel="stylesheet" href="componentes/css/geral-pagina-cabecalho.css" />
  <link rel="stylesheet" href="componentes/css/geral-abas.css" />
  <link rel="stylesheet" href="componentes/css/geral-opcao.css" />
  <link rel="stylesheet" href="componentes/css/geral-lista.css" />
  <link rel="stylesheet" href="componentes/css/geral-faixa.css" />
  <link rel="stylesheet" href="componentes/css/geral-calendario.css" />
  <link rel="stylesheet" href="componentes/css/geral-calendario-mes.css" />
  <link rel="stylesheet" href="componentes/css/geral-periodo.css" />
  <link rel="stylesheet" href="componentes/css/geral-layout-lateral.css" />
  <link rel="stylesheet" href="componentes/css/geral-barra-periodo.css" />
  <link rel="stylesheet" href="componentes/css/geral-rodape.css" />
  <link rel="stylesheet" href="componentes/css/geral-painel.css" />
  <link rel="stylesheet" href="componentes/css/geral-pedido.css" />
  <link rel="stylesheet" href="componentes/css/geral-impacto.css" />
  <link rel="stylesheet" href="css/index-cabecalho.css" />
  <link rel="stylesheet" href="css/index-perfil.css" />
  <link rel="stylesheet" href="css/index-comunicado.css" />
  <link rel="stylesheet" href="css/index-sidebar.css" />
  <link rel="stylesheet" href="css/index-sessao-vigia.css" />
</head>
<body>

  <noscript>
    <p>O Roster Work precisa de JavaScript ativado para funcionar. Ative o JavaScript no navegador e recarregue a página.</p>
  </noscript>

  <div class="casca">

    <header class="cabecalho">
      <div class="cabecalho-logo">
        <svg aria-label="Roster Work" viewBox="0 0 186.44 96.312">
          <use href="icones/icone-logo.svg#icone-logo" />
        </svg>
      </div>

      <div class="dropdown" id="dropdown-unidades">
        <button type="button" class="seletor">
          <svg class="icone seletor-icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-mapa-pin.svg#icone-mapa-pin"/></svg>
          <span class="seletor-texto" id="seletor-unidades-texto">Carregando</span>
          <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
        </button>
        <div class="dropdown-menu dropdown-menu--largo">
          <div class="dropdown-menu-rolagem">
            <div class="arvore" id="arvore-seletor"></div>
          </div>
          <div class="dropdown-menu-rodape">
            <span class="campo-ajuda" id="seletor-contagem">0 unidades selecionadas</span>
            <span class="espacador-flex"></span>
            <button type="button" class="botao botao--primario botao--pequeno" id="btn-aplicar-unidades" disabled>Aplicar</button>
          </div>
        </div>
      </div>

      <div class="espacador-flex"></div>

      <button type="button" class="cabecalho-btn" id="cabecalho-btn-tema" aria-label="Alternar tema claro ou escuro" data-dica="Tema escuro">
        <svg class="icone" width="16" height="16" id="cabecalho-icone-lua" aria-hidden="true"><use href="icones/icone-lua.svg#icone-lua" /></svg>
        <svg width="16" height="16" id="cabecalho-icone-sol" class="icone oculto" aria-hidden="true"><use href="icones/icone-sol.svg#icone-sol" /></svg>
      </button>

      <div class="dropdown" id="dropdown-avisos">
        <button type="button" class="cabecalho-btn cabecalho-btn--avisos" aria-label="Avisos" data-dica="Avisos">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-sino.svg#icone-sino" /></svg>
          <span class="cabecalho-badge oculto" aria-hidden="true"></span>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-titulo">Avisos</div>
          <div class="dropdown-lista-avisos"></div>
          <div class="dropdown-divisor"></div>
          <button type="button" class="dropdown-item oculto" id="avisos-marcar-todas">Marcar todas como lidas</button>
          <button type="button" class="dropdown-item" id="avisos-ver-todos">Ver todos</button>
        </div>
      </div>

      <div class="dropdown" id="dropdown-usuario">
        <button type="button" class="cabecalho-usuario">
          <span class="cabecalho-usuario-avatar"></span>
          <span class="cabecalho-usuario-textos">
            <span class="cabecalho-usuario-nome"></span>
            <span class="cabecalho-usuario-lotacao"></span>
          </span>
          <svg class="icone cabecalho-usuario-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo" /></svg>
        </button>
        <div class="dropdown-menu">
          <button class="dropdown-item" id="btn-meu-perfil">
            <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-perfil.svg#icone-perfil" /></svg>
            <span>Meu perfil</span>
          </button>
          <div class="dropdown-divisor"></div>
          <button id="btn-sair" class="dropdown-item dropdown-item--perigo">
            <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-sair.svg#icone-sair" /></svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </header>

    <div class="casca-corpo">

      <nav class="sidebar">
        <div class="sidebar-itens">

          <button type="button" class="menu-item menu-item--selecionado" data-pagina="inicio" aria-label="Início">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-inicio.svg#icone-inicio" /></svg>
            <span class="menu-item-label">Início</span>
          </button>

          <div class="sidebar-divisor"></div>

          <button type="button" class="menu-item" data-pagina="escalas" aria-label="Escala">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-escalas.svg#icone-escalas" /></svg>
            <span class="menu-item-label">Escala</span>
            <span class="menu-item-selo oculto" aria-hidden="true"></span>
          </button>

          <button type="button" class="menu-item" data-pagina="trocas" aria-label="Trocas">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-trocas.svg#icone-trocas" /></svg>
            <span class="menu-item-label">Trocas</span>
          </button>

          <button type="button" class="menu-item" data-pagina="folgas" aria-label="Folgas">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-folgas.svg#icone-folgas" /></svg>
            <span class="menu-item-label">Folgas</span>
          </button>

          <button type="button" class="menu-item" data-pagina="extrajornada" aria-label="Extrajornada">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-extrajornada.svg#icone-extrajornada" /></svg>
            <span class="menu-item-label">Extrajornada</span>
          </button>

          <button type="button" class="menu-item" data-pagina="afastamentos" aria-label="Afastamentos">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-afastamentos.svg#icone-afastamentos" /></svg>
            <span class="menu-item-label">Afastamentos</span>
          </button>

          <div class="sidebar-divisor"></div>

          <button type="button" class="menu-item" data-pagina="postos" aria-label="Postos">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-postos.svg#icone-postos" /></svg>
            <span class="menu-item-label">Postos</span>
          </button>

          <button type="button" class="menu-item" data-pagina="distribuicao" aria-label="Distribuição">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-distribuicao.svg#icone-distribuicao" /></svg>
            <span class="menu-item-label">Distribuição</span>
          </button>

          <div class="sidebar-divisor"></div>

          <button type="button" class="menu-item" data-pagina="usuarios" aria-label="Usuários">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-usuarios.svg#icone-usuarios" /></svg>
            <span class="menu-item-label">Usuários</span>
          </button>

          <button type="button" class="menu-item" data-pagina="historico" data-admin aria-label="Histórico">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-historico.svg#icone-historico" /></svg>
            <span class="menu-item-label">Histórico</span>
          </button>

          <button type="button" class="menu-item" data-pagina="ajustes" aria-label="Ajustes">
            <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-ajustes.svg#icone-ajustes" /></svg>
            <span class="menu-item-label">Ajustes</span>
          </button>

        </div>

        <button type="button" class="sidebar-toggle" aria-label="Recolher menu">
          <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-menu-toggle.svg#icone-menu-toggle" /></svg>
          <span class="sidebar-toggle-texto">Recolher menu</span>
        </button>
      </nav>

      <main class="conteudo">
        <div class="carregando-veu carregando-veu--visivel" role="status" aria-label="Carregando">
          <div class="giratorio" aria-hidden="true"></div>
        </div>

        <!-- PAINEL LATERAL (gaveta de detalhes) — único no shell; empurra a página ao abrir.
             Casca em componentes/css|js/geral-painel.*; cada página o abre e o preenche. -->
        <aside class="painel-lateral" id="painel" aria-label="Detalhes">
          <div class="painel-cabecalho">
            <div class="painel-titulos">
              <span class="painel-titulo">
                <span class="painel-titulo-nome" id="painel-titulo"></span>
                <span class="painel-titulo-extra oculto" id="painel-titulo-extra"></span>
              </span>
              <span class="painel-subtitulo" id="painel-subtitulo"></span>
            </div>
            <span class="espacador-flex"></span>
            <div class="abas abas--pequenas painel-abas oculto" id="painel-abas">
              <button type="button" class="aba aba--ativa" data-painel-modo="ver">Ver</button>
              <button type="button" class="aba" data-painel-modo="editar">Editar</button>
            </div>
            <button type="button" class="botao botao--icone botao--pequeno" id="painel-fechar" aria-label="Fechar painel">
              <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
            </button>
          </div>
          <div class="painel-subcabecalho oculto" id="painel-subcabecalho"></div>
          <div class="painel-corpo" id="painel-corpo"></div>
          <div class="painel-rodape oculto" id="painel-rodape"></div>
        </aside>
      </main>

    </div>

  </div>

  <!-- RESUMO: modal de confirmação com o histórico gravado ao salvar (componente geral-resumo); no shell, abaixo do aviso (que tem precedência sobre qualquer modal) -->
  <div class="modal-veu" id="veu-resumo">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Resumo das alterações">
      <div class="modal-corpo">
        <div id="resumo-conteudo"></div>
      </div>
      <div class="modal-rodape">
        <button type="button" class="botao botao--texto resumo-desfazer oculto">Desfazer</button>
        <button type="button" class="botao botao--primario resumo-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- AVISO: modal de aviso/confirmação (componente geral-aviso); fica fora da casca para ficar acima de qualquer modal -->
  <div class="modal-veu" id="veu-aviso">
    <div class="modal modal--aviso" role="alertdialog" aria-modal="true" aria-labelledby="aviso-veu-mensagem">
      <div class="modal-corpo aviso-corpo">
        <svg class="icone aviso-icone aviso-icone--sucesso oculto" width="32" height="32" aria-hidden="true"><use href="icones/icone-sucesso.svg#icone-sucesso"/></svg>
        <svg class="icone aviso-icone aviso-icone--alerta oculto" width="32" height="32" aria-hidden="true"><use href="icones/icone-alerta.svg#icone-alerta"/></svg>
        <span class="aviso-mensagem" id="aviso-veu-mensagem"></span>
      </div>
      <div class="modal-rodape">
        <button type="button" class="botao aviso-cancelar oculto"></button>
        <button type="button" class="botao botao--primario aviso-confirmar">OK</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE DATA: "a partir de qual data recalcular a escala" (recálculo direcionado ao alterar modelo/regra/viatura/instalação/ritmo) -->
  <div class="modal-veu" id="veu-data">
    <div class="modal modal--data" role="dialog" aria-modal="true" aria-labelledby="data-modal-titulo">
      <div class="modal-cabecalho">
        <span class="modal-titulo" id="data-modal-titulo">Recalcular a escala</span>
      </div>
      <div class="modal-corpo">
        <span class="data-modal-mensagem"></span>
        <label class="campo">
          <span class="campo-rotulo">A partir de</span>
          <input class="campo-entrada" type="text" name="recalculo-data" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" data-recalculo-data autocomplete="off" />
          <span class="campo-erro-texto"></span>
        </label>
      </div>
      <div class="modal-rodape">
        <button type="button" class="botao data-modal-cancelar">Cancelar</button>
        <button type="button" class="botao botao--primario data-modal-confirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- AVISO DE SESSÃO: contagem antes de expirar por inatividade (anel em canvas); fora da casca para ficar acima de qualquer modal -->
  <div class="modal-veu" id="veu-sessao">
    <div class="modal modal--sessao" role="alertdialog" aria-modal="true" aria-labelledby="sessao-mensagem">
      <div class="modal-corpo sessao-corpo">
        <span class="sessao-anel">
          <canvas class="sessao-anel-canvas" aria-hidden="true"></canvas>
          <span class="sessao-anel-tempo" aria-hidden="true"></span>
        </span>
        <span class="sessao-mensagem" id="sessao-mensagem">Sua sessão vai expirar por inatividade.</span>
      </div>
      <div class="modal-rodape">
        <button type="button" class="botao sessao-sair">Sair agora</button>
        <button type="button" class="botao botao--primario sessao-continuar">Continuar conectado</button>
      </div>
    </div>
  </div>

  <script src="componentes/js/geral-limpar-comentarios.js"></script>
  <script src="componentes/js/geral-carregando.js"></script>
  <script src="componentes/js/geral-teclado.js"></script>
  <script src="componentes/js/geral-grade-teclado.js"></script>
  <script src="componentes/js/geral-sessao.js"></script>
  <script src="componentes/js/geral-tpl.js"></script>
  <script src="componentes/js/geral-tempo.js"></script>
  <script src="componentes/js/geral-mensagens.js"></script>
  <script src="componentes/js/geral-data.js"></script>
  <script src="componentes/js/geral-campos.js"></script>
  <script src="componentes/js/geral-dica.js"></script>
  <script src="componentes/js/geral-flutuante.js"></script>
  <script src="componentes/js/geral-dropdown.js"></script>
  <script src="componentes/js/geral-dropdown-numeros.js"></script>
  <script src="componentes/js/geral-modal.js"></script>
  <script src="componentes/js/geral-aviso.js"></script>
  <script src="componentes/js/geral-data-modal.js"></script>
  <script src="componentes/js/geral-resumo.js"></script>
  <script src="componentes/js/geral-guarda-saida.js"></script>
  <script src="componentes/js/geral-api.js"></script>
  <script src="componentes/js/geral-recalculo.js"></script>
  <script src="js/index-sidebar.js"></script>
  <script src="js/index-cabecalho.js"></script>
  <script src="js/index-avisos.js"></script>
  <script src="js/index-perfil.js"></script>
  <script src="js/index-sessao-vigia.js"></script>
  <script src="componentes/js/geral-seletor-unidades.js"></script>
  <script src="componentes/js/geral-arvore-unidades.js"></script>
  <script src="componentes/js/geral-filtro-arvore.js"></script>
  <script src="componentes/js/geral-busca.js"></script>
  <script src="componentes/js/geral-calendario.js"></script>
  <script src="componentes/js/geral-calendario-mes.js"></script>
  <script src="componentes/js/geral-barra-periodo.js"></script>
  <script src="componentes/js/geral-abas.js"></script>
  <script src="componentes/js/geral-painel.js"></script>
  <script src="componentes/js/geral-impacto.js"></script>
  <script src="js/index-navegacao.js"></script>

  <!-- MOLDES: análise de impacto na escala (componente geral-impacto — Trocas e Folgas) -->
  <template id="tpl-geral-impacto-veredito">
    <div class="impacto-veredito">
      <svg class="icone" width="18" height="18" aria-hidden="true"><use href="icones/icone-alerta.svg#icone-alerta"/></svg>
      <span class="impacto-veredito-texto"></span>
    </div>
  </template>
  <template id="tpl-geral-impacto-aviso">
    <div class="impacto-aviso">
      <svg class="icone impacto-aviso-icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-alerta.svg#icone-alerta"/></svg>
      <span class="impacto-aviso-textos">
        <span class="impacto-aviso-titulo"></span>
        <span class="impacto-aviso-desc"></span>
      </span>
    </div>
  </template>
  <template id="tpl-geral-impacto-antesdepois">
    <div class="impacto-antesdepois">
      <span class="impacto-ad-rotulo"></span>
      <span class="impacto-ad-valores">
        <span class="impacto-ad-de"></span>
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
        <span class="impacto-ad-para"></span>
      </span>
    </div>
  </template>

  <!-- sino: uma notificação (a linha inteira leva à tela do assunto) -->
  <template id="dropdown-item-aviso">
    <button type="button" class="aviso-item">
      <span class="aviso-item-ponto" aria-hidden="true"></span>
      <span class="aviso-item-textos">
        <span class="aviso-item-titulo"></span>
        <span class="aviso-item-mensagem"></span>
        <span class="aviso-item-meta"></span>
      </span>
    </button>
  </template>

  <!-- separador dos dois blocos do sino: "Para você" e "Administração" -->
  <template id="dropdown-grupo-aviso">
    <div class="dropdown-titulo aviso-grupo"></div>
  </template>

  <template id="tpl-barra-periodo">
    <div class="barra-periodo">
      <div class="barra-periodo-topo"><span class="barra-periodo-rotulo"></span><span class="barra-periodo-horas"></span></div>
      <div class="barra-periodo-trilho">
        <div class="barra-periodo-limite"></div>
        <div class="barra-periodo-fill"></div>
        <button type="button" class="barra-periodo-handle" data-tipo="inicio" role="slider" aria-label="Início do período"></button>
        <button type="button" class="barra-periodo-handle" data-tipo="fim" role="slider" aria-label="Fim do período"></button>
      </div>
      <div class="barra-periodo-escala"><span>08h</span><span>14h</span><span>20h</span><span>02h</span><span>08h</span></div>
    </div>
  </template>

  <template id="tpl-seletor-no">
    <div class="arvore-grupo">
      <div class="arvore-linha">
        <button type="button" class="arvore-seta" aria-label="Expandir ou recolher" aria-expanded="false">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg>
        </button>
        <button type="button" class="caixa-selecao" role="checkbox" aria-checked="false">
          <svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/icone-check.svg#icone-check"/></svg>
        </button>
        <span class="arvore-nome"></span>
        <span class="arvore-detalhe"></span>
      </div>
      <div class="arvore-filhos"></div>
    </div>
  </template>

  <template id="tpl-seletor-trecho">
    <span class="seletor-trecho"></span>
  </template>

  <template id="tpl-seletor-cidade">
    <span class="seletor-cidade"></span>
  </template>

  <!-- BLOQUEIO: camada transparente que impede clique por engano enquanto uma ação está no ar -->
  <div class="carregando-bloqueio oculto" id="carregando-bloqueio" aria-hidden="true"></div>

  <!-- MOLDE: divisória dentro de um filtro em árvore (separa opções "separadas", ex.: Inativos) -->
  <template id="tpl-filtro-divisor">

        <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </span>
  </template>

  <!-- ✕ de UM período (multi-período): mesmo botão, rótulo próprio -->
  <template id="tpl-escala-edicao-remover-periodo">
    <button type="button" class="escala-edicao-remover" aria-label="Remover este período">
      <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
    </button>
  </template>

  <!-- ação restaurar (↺): desfaz o ajuste manual, voltando ao automático -->
  <template id="tpl-escala-edicao-restaurar">
    <span class="escala-edicao-acao">
      <button type="button" class="escala-edicao-restaurar" aria-label="Restaurar o automático">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-restaurar.svg#icone-restaurar"/></svg>
      </button>
    </span>
  </template>

  <!-- ✕ à esquerda da função: exclui uma função inserida à mão (só funções manuais) -->
  <template id="tpl-escala-funcao-remover">
    <button type="button" class="escala-funcao-remover" aria-label="Excluir função">
      <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
    </button>
  </template>

  <!-- linha dos valores originais (automático) abaixo de uma linha alterada: itálico + riscado -->
  <template id="tpl-escala-edicao-original">
    <div class="escala-distribuicao-escalado escala-distribuicao-original">
      <span class="escala-distribuicao-grad"></span>
      <span class="escala-distribuicao-nome"></span>
      <div class="escala-distribuicao-horas"></div>
    </div>
  </template>

  <!-- seletor de hora redonda do modo Editar: wrapper com a seta; os dois dropdowns
       (início → fim) são criados pelo componente geral-dropdown-numeros e inseridos pelo JS -->
  <template id="tpl-escala-hora-editar">
    <span class="escala-distribuicao-hora escala-hora-editar">
      <svg class="icone escala-distribuicao-hora-seta" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
    </span>
  </template>

  <!-- picker do modo Editar: militares do grupo, por unidade (recolhível), sem checkbox -->
  <template id="tpl-escala-picker">
    <div class="escala-picker" role="dialog" aria-label="Selecionar militar"></div>
  </template>

  <template id="tpl-escala-picker-unidade">
    <div class="escala-picker-unidade">
      <button type="button" class="escala-picker-unidade-cab" aria-expanded="true">
        <svg class="icone escala-picker-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
        <span class="escala-picker-unidade-nome"></span>
      </button>
      <div class="escala-picker-militares"></div>
    </div>
  </template>

  <template id="tpl-escala-picker-militar">
    <button type="button" class="escala-picker-militar">
      <span class="escala-picker-militar-grad"></span>
      <span class="escala-picker-militar-nome"></span>
    </button>
  </template>

  <!-- opção no topo do picker: limpa o militar e a vaga volta a "Selecione um militar" -->
  <template id="tpl-escala-picker-vazio">
    <button type="button" class="escala-picker-militar escala-picker-vazio"></button>
  </template>

  <!-- ===== moldes do PAINEL DO DIA (compartilhados Escala + Extrajornada); movidos de escalas.html na Fase 2 do redesenho ===== -->
  <!-- painel Distribuição: estado vazio (texto), carregando (giratório), grupo de função e linha de militar -->
  <template id="tpl-escala-distribuicao-estado">
    <div class="escala-distribuicao-estado"></div>
  </template>

  <!-- aviso de conflito no topo da Distribuição: lista os erros do dia (um por linha, com ícone) a partir de RosterWork.mensagens.escala.erros -->
  <template id="tpl-escala-distribuicao-aviso">
    <div class="escala-distribuicao-aviso">
      <div class="escala-distribuicao-aviso-lista"></div>
      <span class="escala-distribuicao-aviso-acao oculto">CORRIJA PARA SALVAR</span>
    </div>
  </template>

  <!-- uma linha do aviso: ícone + texto de um erro (o JS preenche a partir de RosterWork.mensagens.escala.erros) -->
  <template id="tpl-escala-distribuicao-aviso-item">
    <div class="escala-distribuicao-aviso-item">
      <svg class="icone escala-distribuicao-aviso-icone" aria-hidden="true"><use href="icones/icone-alerta.svg#icone-alerta"/></svg>
      <span></span>
    </div>
  </template>

  <!-- aviso amarelo expansível: cabeçalho (ícone + título + chevron) que abre a lista de militares afetados -->
  <template id="tpl-escala-distribuicao-aviso-grupo">
    <div class="escala-distribuicao-aviso-grupo">
      <button type="button" class="escala-distribuicao-aviso-cabecalho" aria-expanded="false">
        <svg class="icone escala-distribuicao-aviso-icone" aria-hidden="true"><use href="icones/icone-alerta.svg#icone-alerta"/></svg>
        <span class="escala-distribuicao-aviso-titulo"></span>
        <svg class="icone escala-distribuicao-aviso-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="escala-distribuicao-aviso-detalhes oculto"></div>
    </div>
  </template>

  <!-- uma linha do detalhe: "Cb. Campos está de Rádio Operador, faltou soldado ou mais moderno" -->
  <template id="tpl-escala-distribuicao-aviso-detalhe">
    <div class="escala-distribuicao-aviso-detalhe"><span></span></div>
  </template>

  <template id="tpl-escala-distribuicao-carregando">
    <div class="escala-distribuicao-carregando" role="status" aria-label="Carregando">
      <div class="giratorio" aria-hidden="true"></div>
    </div>
  </template>

  <template id="tpl-escala-distribuicao-grupo">
    <div class="escala-distribuicao-grupo">
      <span class="escala-distribuicao-funcao"></span>
      <div class="escala-distribuicao-militares"></div>
    </div>
  </template>

  <!-- um rótulo de função (empilha quando o mesmo militar acumula, ex.: Chefe de Socorro / Condutor) -->
  <template id="tpl-escala-distribuicao-funcao-rotulo">
    <span class="escala-distribuicao-funcao-rotulo"></span>
  </template>

  <template id="tpl-escala-distribuicao-adicionar">
    <button type="button" class="escala-distribuicao-adicionar">
      <svg class="icone" aria-hidden="true"><use href="icones/icone-mais.svg#icone-mais"></use></svg>
      <span>Adicionar função</span>
    </button>
  </template>

  <!-- viatura em manutenção: aviso amarelo + nota (só leitura no Ver; editável no Editar) -->
  <template id="tpl-escala-manutencao">
    <div class="escala-manutencao">
      <div class="escala-manutencao-cab">
        <svg class="icone escala-manutencao-icone" width="16" height="16"><use href="icones/icone-alerta.svg#icone-alerta"></use></svg>
        <span class="escala-manutencao-titulo">Em manutenção</span>
      </div>
      <input type="text" class="campo-entrada escala-manutencao-nota" maxlength="120"
             placeholder="Detalhe (ex.: substituída por ABT-41)" />
      <span class="escala-manutencao-nota-ver"></span>
    </div>
  </template>

  <template id="tpl-escala-vaga-vazia">
    <div class="escala-vaga-vazia">
      <svg class="icone escala-vaga-vazia-icone" width="16" height="16"><use href="icones/icone-alerta.svg#icone-alerta"></use></svg>
      <span class="escala-vaga-vazia-texto"></span>
    </div>
  </template>


  <template id="tpl-escala-distribuicao-escalado">
    <div class="escala-distribuicao-escalado">
      <span class="escala-distribuicao-icones"></span>
      <span class="escala-distribuicao-grad"></span>
      <span class="escala-distribuicao-nome"></span>
      <div class="escala-distribuicao-horas"></div>
    </div>
  </template>

  <template id="tpl-escala-distribuicao-hora">
    <span class="escala-distribuicao-hora">
      <span class="escala-distribuicao-hora-ini"></span>
      <svg class="icone escala-distribuicao-hora-seta" aria-hidden="true"><use href="icones/icone-seta-direita-longa.svg#icone-seta-direita-longa"/></svg>
      <span class="escala-distribuicao-hora-fim"></span>
    </span>
  </template>

  <!-- legenda dos ícones de origem (rodapé do painel, retrátil pelo chevron) -->
  <template id="tpl-escala-legenda">
    <div class="escala-legenda">
      <div class="escala-legenda-cabecalho">
        <span class="escala-legenda-titulo">Legendas</span>
        <button type="button" class="botao-discreto escala-legenda-toggle" aria-label="Mostrar ou ocultar legendas" aria-expanded="false">
          <svg class="icone escala-legenda-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
        </button>
      </div>
      <div class="escala-legenda-itens oculto">
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-origem-sistema.svg#icone-origem-sistema"/></svg>
          <span>Gerado pelo sistema</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-origem-troca.svg#icone-origem-troca"/></svg>
          <span>Troca de serviço</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-origem-pontual.svg#icone-origem-pontual"/></svg>
          <span>Inserção pontual</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-origem-base.svg#icone-origem-base"/></svg>
          <span>Escala base</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-folgas.svg#icone-folgas"/></svg>
          <span>Folga</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-extrajornada.svg#icone-extrajornada"/></svg>
          <span>Extrajornada (hora extra paga)</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-cadeado.svg#icone-cadeado"/></svg>
          <span>Função fixada</span>
        </span>
        <span class="escala-legenda-item">
          <svg class="icone" width="12" height="12" aria-hidden="true"><use href="icones/icone-regra.svg#icone-regra"/></svg>
          <span>Tem regra (exclusivo/proibido)</span>
        </span>
      </div>
    </div>
  </template>

  <!-- linha de Observação do dia (troca/folga/admin): ícone + texto + ✕ (o ✕ só nas do admin, no Editar) -->
  <template id="tpl-escala-observacao">
    <div class="escala-observacao">
      <svg class="icone escala-observacao-icone"><use href="icones/icone-nota.svg#icone-nota" /></svg>
      <span class="escala-observacao-texto"></span>
      <button type="button" class="escala-observacao-remover" aria-label="Excluir observação">
        <svg class="icone"><use href="icones/icone-fechar.svg#icone-fechar" /></svg>
      </button>
    </div>
  </template>

  <!-- adicionar observação (Editar do admin): botão que abre o campo com limite de caracteres -->
  <template id="tpl-escala-observacao-adicionar">
    <div class="escala-observacao-add">
      <button type="button" class="botao-discreto escala-observacao-add-botao">
        <svg class="icone" aria-hidden="true"><use href="icones/icone-mais.svg#icone-mais" /></svg>
        <span>Adicionar observação</span>
      </button>
      <div class="escala-observacao-campo oculto">
        <input type="text" name="escala-observacao" class="campo-entrada escala-observacao-input" maxlength="200" placeholder="Ex.: viatura reservada para o desfile" />
        <div class="escala-observacao-campo-rodape">
          <span class="escala-observacao-contador"></span>
          <div class="escala-observacao-campo-acoes">
            <button type="button" class="botao botao--pequeno escala-observacao-cancelar">Cancelar</button>
            <button type="button" class="botao botao--pequeno botao--primario escala-observacao-salvar">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-escala-mes-linha">
    <div class="escala-mes-linha">
      <div class="escala-mes-data">
        <span class="escala-mes-data-semana"></span>
        <span class="escala-mes-data-numero"></span>
      </div>
    </div>
  </template>

  <!-- estado vazio / carregando do corpo da grade (reaproveita .escala-mes-estado) -->
  <template id="tpl-escala-estado">
    <div class="escala-mes-estado"></div>
  </template>

  <template id="tpl-escala-carregando">
    <div class="escala-mes-estado" role="status" aria-label="Carregando">
      <div class="giratorio" aria-hidden="true"></div>
    </div>
  </template>

</body>
</html>
