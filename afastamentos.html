<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Afastamentos</h1>
      <span class="pagina-subtitulo"></span>
    </div>
    <span class="espacador-flex"></span>
    <button type="button" class="botao botao--primario oculto" id="btn-nova-ferias">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-mais.svg#icone-mais"/></svg>
      <span>Novas férias</span>
    </button>
    <button type="button" class="botao botao--primario oculto" id="btn-nova-licenca">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-mais.svg#icone-mais"/></svg>
      <span>Nova licença</span>
    </button>
    <button type="button" class="botao botao--primario oculto" id="btn-nova-dispensa">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-mais.svg#icone-mais"/></svg>
      <span>Nova dispensa</span>
    </button>
  </div>

  <div class="pagina-subcabecalho">
    <div class="abas" id="afastamentos-abas">
      <button type="button" class="aba" data-aba="ferias">Férias</button>
      <button type="button" class="aba aba--ativa" data-aba="licencas">Licenças</button>
      <button type="button" class="aba" data-aba="dispensas">Dispensas</button>
    </div>
  </div>

  <div class="pagina-corpo pagina-corpo--camada">
    <div class="pagina-corpo-rolagem">
      <!-- aba Férias: árvore de unidades com as férias de cada militar -->
      <div class="afastamentos-painel oculto" data-aba-painel="ferias">
        <div class="arvore arvore-unidades" id="arvore-ferias"></div>
      </div>
      <!-- aba Licenças: árvore de unidades com as licenças de cada militar -->
      <div class="afastamentos-painel" data-aba-painel="licencas">
        <div class="arvore arvore-unidades" id="arvore-licencas"></div>
      </div>
      <!-- aba Dispensas: árvore de unidades com as dispensas de cada militar -->
      <div class="afastamentos-painel oculto" data-aba-painel="dispensas">
        <div class="arvore arvore-unidades" id="arvore-dispensas"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MOLDES — Férias ===================== -->
<template id="tpl-ferias-lista">
  <div class="atestados-lista"></div>
</template>
<template id="tpl-ferias-item">
  <div class="atestado-item">
    <span class="atestado-textos">
      <span class="atestado-pessoa">
        <span class="atestado-grad"></span>
        <span class="atestado-nome"></span>
      </span>
      <span class="atestado-detalhe"></span>
    </span>
    <span class="espacador-flex"></span>
    <span class="selo atestado-dias"></span>
  </div>
</template>
<template id="tpl-ferias-vazio">
  <div class="postos-vazio">Nenhuma férias nesta unidade.</div>
</template>
<template id="tpl-ferias-militar-opcao">
  <button type="button" class="dropdown-item"></button>
</template>
<template id="tpl-ferias-novo">
  <div class="painel-secao">
    <button type="button" class="painel-secao-cabecalho" aria-expanded="true">
      <span class="rotulo-secao">Militar e período</span>
      <svg class="icone painel-secao-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
    </button>
    <div class="painel-secao-corpo">
      <div class="campo">
        <span class="campo-rotulo">Unidade</span>
        <div class="dropdown" id="fer-unidade-dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="fer-unidade">
            <span class="campo-selecao-texto campo-selecao-texto--vazio" id="fer-unidade-texto">Selecione uma unidade</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu dropdown-menu--largo">
            <div class="dropdown-menu-rolagem">
              <div class="arvore" id="fer-unidade-arvore"></div>
            </div>
          </div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Militar</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="fer-militar" disabled>
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione a unidade antes</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu" id="fer-militar-menu"></div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <label class="campo">
        <span class="campo-rotulo">Data de início</span>
        <input class="campo-entrada" id="fer-inicio" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Data de fim</span>
        <input class="campo-entrada" id="fer-fim" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" />
        <span class="campo-erro-texto"></span>
      </label>
    </div>
  </div>
</template>
<template id="tpl-ferias-novo-acoes">
  <button type="button" class="botao" id="fer-cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario" id="fer-salvar" disabled>Salvar</button>
</template>

</template>
<template id="tpl-licenca-novo">
  <div class="painel-secao">

      <span class="rotulo-secao">Militar e licença</span>

      <div class="campo">

            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu dropdown-menu--largo">
            <div class="dropdown-menu-rolagem">
              <div class="arvore" id="lic-unidade-arvore"></div>
            </div>
          </div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Militar</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="lic-militar" disabled>
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione a unidade antes</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu" id="lic-militar-menu"></div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Tipo de licença</span>
        <div class="dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="lic-tipo">
            <span class="campo-selecao-texto campo-selecao-texto--vazio" id="lic-tipo-texto">Selecione o tipo</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item" data-tipo="propria_saude">Tratamento da própria saúde</button>
            <button type="button" class="dropdown-item" data-tipo="saude_familiar">Tratamento de saúde de familiar</button>
            <button type="button" class="dropdown-item" data-tipo="interesses">Interesses particulares</button>
            <button type="button" class="dropdown-item" data-tipo="especial">Licença especial</button>
            <button type="button" class="dropdown-item" data-tipo="capacitacao">Licença capacitação</button>
          </div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <label class="campo">
        <span class="campo-rotulo">Data de início</span>
        <input class="campo-entrada" id="lic-inicio" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" />
        <span class="campo-erro-texto"></span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Data de fim</span>
        <input class="campo-entrada" id="lic-fim" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" />
        <span class="campo-erro-texto"></span>
      </label>
      <div class="atestado-fluxo oculto" id="lic-fluxo">
        <div class="atestado-fluxo-titulo" id="lic-fluxo-titulo"></div>
        <div class="atestado-fluxo-texto" id="lic-fluxo-texto"></div>
        <div class="atestado-fluxo-decisao">
          <span class="atestado-fluxo-rotulo">Tirar do fluxo da escala?</span>
          <div class="abas abas--pequenas" id="lic-fora-toggle">
            <button type="button" class="aba" data-fora="sim">Sim</button>
            <button type="button" class="aba" data-fora="nao">Não</button>
          </div>
        </div>
      </div>
      <div class="afastamento-saude oculto" id="lic-saude">
        <label class="campo">
          <span class="campo-rotulo">CID</span>
          <input class="campo-entrada" id="lic-cid" type="text" maxlength="10" placeholder="Ex.: J11" />
          <span class="campo-erro-texto"></span>
        </label>
        <label class="campo">
          <span class="campo-rotulo">Médico / entidade</span>
          <input class="campo-entrada" id="lic-medico" type="text" maxlength="80" placeholder="Ex.: Dr. Lima · HUC" />
          <span class="campo-erro-texto"></span>
        </label>
      </div>
      <label class="campo">
        <span class="campo-rotulo">Motivo</span>
        <textarea class="campo-entrada" id="lic-motivo" maxlength="200" placeholder="Descreva o motivo (opcional)"></textarea>
        <span class="campo-erro-texto"></span>
      </label>
    </div>
  </div>
</template>
<template id="tpl-licenca-novo-acoes">
  <button type="button" class="botao" id="lic-cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario" id="lic-salvar" disabled>Salvar</button>
</template>
