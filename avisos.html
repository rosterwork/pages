<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Avisos</h1>
      <span class="pagina-subtitulo" id="avisos-subtitulo"></span>
    </div>
    <span class="espacador-flex"></span>
    <button type="button" class="botao oculto" id="avisos-marcar-lidas">Marcar todas como lidas</button>
    <button type="button" class="botao botao--primario oculto" id="btn-novo-aviso-pagina">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/icone-mais.svg#icone-mais"/></svg>
      <span>Novo comunicado</span>
    </button>
  </div>

  <div class="pagina-subcabecalho">
    <div class="abas" id="avisos-abas">
      <button type="button" class="aba aba--ativa" data-aba="paramim">Para mim</button>
      <button type="button" class="aba oculto" data-aba="administracao" id="avisos-aba-administracao">
        <span>Administração</span>
        <span class="selo aba-contagem oculto" id="avisos-administracao-contagem"></span>
      </button>
      <button type="button" class="aba" data-aba="comunicados">Comunicados</button>
    </div>
  </div>

  <div class="pagina-corpo">
    <!-- o que é seu: primeiro o que espera você, depois o que já aconteceu -->
    <div class="avisos-aba" data-aba-painel="paramim">
      <div class="avisos-secao">
        <span class="rotulo-secao">Precisa de você</span>
        <div class="avisos-lista" id="avisos-minhas-pendencias"></div>
      </div>
      <div class="avisos-secao">
        <span class="rotulo-secao">Histórico</span>
        <div class="avisos-lista" id="avisos-notificacoes"></div>
      </div>
    </div>

    <!-- só administrador: o que espera a decisão dele -->
    <div class="avisos-aba oculto" data-aba-painel="administracao">
      <div class="avisos-lista" id="avisos-pendencias"></div>
    </div>

    <!-- o mural: os comunicados que alcançam você -->
    <div class="avisos-aba oculto" data-aba-painel="comunicados">
      <div class="avisos-lista" id="avisos-lista"></div>
    </div>
  </div>

  <!-- molde: um comunicado -->
  <template id="tpl-aviso-cartao">
    <div class="aviso-cartao">
      <div class="aviso-cartao-conteudo">
        <span class="aviso-cartao-titulo"></span>
        <span class="aviso-cartao-msg"></span>
        <span class="aviso-cartao-meta"></span>
      </div>
      <button type="button" class="aviso-cartao-remover oculto" aria-label="Remover comunicado">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </div>
  </template>

  <!-- molde: o dia que separa os blocos de notificações -->
  <template id="tpl-avisos-dia">
    <span class="rotulo-secao avisos-dia"></span>
  </template>

  <!-- molde: uma notificação (a linha inteira leva à tela do assunto).
       O ícone do assunto é escolhido pelo JS trocando o .oculto -->
  <template id="tpl-avisos-notificacao">
    <button type="button" class="avisos-notificacao">
      <span class="avisos-notificacao-ponto" aria-hidden="true"></span>
      <span class="avisos-notificacao-icone" aria-hidden="true">
        <svg class="icone" width="16" height="16" data-tipo="troca"><use href="icones/icone-trocas.svg#icone-trocas"/></svg>
        <svg class="icone oculto" width="16" height="16" data-tipo="folga"><use href="icones/icone-folgas.svg#icone-folgas"/></svg>
        <svg class="icone oculto" width="16" height="16" data-tipo="dados"><use href="icones/icone-usuarios.svg#icone-usuarios"/></svg>
        <svg class="icone oculto" width="16" height="16" data-tipo="outro"><use href="icones/icone-sino.svg#icone-sino"/></svg>
      </span>
      <span class="avisos-notificacao-textos">
        <span class="avisos-notificacao-titulo"></span>
        <span class="avisos-notificacao-texto"></span>
      </span>
      <span class="espacador-flex"></span>
      <span class="avisos-notificacao-hora"></span>
    </button>
  </template>

  <!-- molde: uma pendência (o que espera decisão) -->
  <template id="tpl-avisos-pendencia">
    <button type="button" class="avisos-pendencia">
      <span class="selo selo--alerta avisos-pendencia-contagem"></span>
      <span class="avisos-pendencia-texto"></span>
      <span class="espacador-flex"></span>
      <svg class="icone avisos-pendencia-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg>
    </button>
  </template>

  <!-- pendência "operacional fora da escala": cabeçalho + a lista de nomes (não navega — o conserto é no Contínuos) -->
  <template id="tpl-avisos-pendencia-fora">
    <div class="avisos-pendencia avisos-pendencia--fora">
      <div class="avisos-pendencia-cab">
        <span class="selo selo--alerta avisos-pendencia-contagem"></span>
        <span class="avisos-pendencia-texto"></span>
      </div>
      <ul class="avisos-fora-lista"></ul>
    </div>
  </template>
  <template id="tpl-avisos-fora-item">
    <li class="avisos-fora-item">
      <span class="avisos-fora-grad"></span>
      <span class="avisos-fora-nome"></span>
      <span class="avisos-fora-unidade"></span>
    </li>
  </template>

  <!-- pendência "viaturas em manutenção": cabeçalho + a lista de viaturas (não navega — o conserto é na Escala/Distribuição) -->
  <template id="tpl-avisos-pendencia-manutencao">
    <div class="avisos-pendencia avisos-pendencia--manut">
      <div class="avisos-pendencia-cab">
        <span class="selo selo--alerta avisos-pendencia-contagem"></span>
        <span class="avisos-pendencia-texto"></span>
      </div>
      <ul class="avisos-manut-lista"></ul>
    </div>
  </template>
  <template id="tpl-avisos-manut-item">
    <li class="avisos-manut-item">
      <span class="avisos-manut-viatura"></span>
      <span class="avisos-manut-desde">desde <span class="avisos-manut-data"></span></span>
      <span class="avisos-manut-unidade"></span>
    </li>
  </template>

  <template id="tpl-avisos-vazio">
    <div class="avisos-vazio"></div>
  </template>
</div>
