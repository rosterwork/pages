<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Avisos</h1>
      <span class="pagina-titulo-contagem" id="avisos-contagem"></span>
    </div>
    <div class="abas" id="avisos-abas">
      <button type="button" class="aba aba--ativa" data-aba="paramim">Para mim</button>
      <button type="button" class="aba" data-aba="comunicados">Comunicados</button>
    </div>
  </div>

  <!-- barra de comandos: à esquerda as ações, em todas as abas (Marcar todas como lidas, do militar, quando há
       aviso em aberto; o grupo Administração com Novo comunicado, só admin). No celular o Marcar mostra o
       rótulo curto, que cabe numa linha ao lado do Administração -->
  <div class="pagina-subcabecalho">
    <button type="button" class="botao oculto" id="avisos-marcar-lidas">
      <span class="avisos-rotulo-computador">Marcar todas como lidas</span>
      <span class="avisos-rotulo-celular">Marcar lidas</span>
    </button>
    <div class="dropdown acoes-admin oculto">
      <button type="button" class="botao acoes-admin-gatilho">
        <span>Administração</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/icone-seta-baixo.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu acoes-admin-menu">
        <span class="rotulo-secao acoes-admin-rotulo">Administração</span>
        <button type="button" class="botao" id="btn-novo-aviso-pagina">Novo comunicado</button>
      </div>
    </div>
  </div>
  <div class="pagina-corpo">
    <!-- o que aconteceu com você (o que espera decisão fica na página Pendências) -->
    <div class="avisos-aba coluna-leitura" data-aba-painel="paramim">
      <div class="avisos-secao">
        <span class="rotulo-secao">Histórico</span>
        <div class="avisos-lista" id="avisos-notificacoes"></div>
        <!-- os 90 dias vêm de 50 em 50: some quando não há mais -->
        <button type="button" class="botao avisos-mais-antigos oculto" id="avisos-mais-antigos">Mostrar mais antigos</button>
      </div>
    </div>

    <!-- o mural: os comunicados que alcançam você -->
    <div class="avisos-aba coluna-leitura oculto" data-aba-painel="comunicados">
      <div class="avisos-lista" id="avisos-lista"></div>
    </div>
  </div>

  <!-- molde: um comunicado -->
  <template id="tpl-aviso-cartao">
    <div class="aviso-cartao">
      <div class="aviso-cartao-conteudo">
        <span class="aviso-cartao-titulo"></span>
        <span class="aviso-cartao-msg"></span>
        <span class="aviso-cartao-meta"></span>
      </div>
      <button type="button" class="aviso-cartao-remover oculto" aria-label="Remover comunicado">
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/icone-fechar.svg#icone-fechar"/></svg>
      </button>
    </div>
  </template>

  <!-- molde: o dia que separa os blocos de notificações -->
  <template id="tpl-avisos-dia">
    <span class="rotulo-secao avisos-dia"></span>
  </template>

  <!-- molde: uma notificação (a linha inteira leva à tela do assunto).
       O ícone do assunto é escolhido pelo JS trocando o .oculto -->
  <template id="tpl-avisos-notificacao">
    <button type="button" class="avisos-notificacao">
      <span class="avisos-notificacao-ponto" aria-hidden="true"></span>
      <span class="avisos-notificacao-icone" aria-hidden="true">
        <svg class="icone" width="16" height="16" data-tipo="troca"><use href="icones/icone-trocas.svg#icone-trocas"/></svg>
        <svg class="icone oculto" width="16" height="16" data-tipo="folga"><use href="icones/icone-folgas.svg#icone-folgas"/></svg>
        <svg class="icone oculto" width="16" height="16" data-tipo="dados"><use href="icones/icone-usuarios.svg#icone-usuarios"/></svg>
        <svg class="icone oculto" width="16" height="16" data-tipo="outro"><use href="icones/icone-sino.svg#icone-sino"/></svg>
      </span>
      <span class="avisos-notificacao-textos">
        <span class="avisos-notificacao-titulo"></span>
        <span class="avisos-notificacao-texto"></span>
      </span>
      <span class="espacador-flex"></span>
      <span class="avisos-notificacao-hora"></span>
    </button>
  </template>

  <template id="tpl-avisos-vazio">
    <div class="avisos-vazio"></div>
  </template>
</div>
