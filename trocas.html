<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Trocas</h1>
    </div>
    <!-- ajuda da tela: os passo a passo desta página e o manual (componente geral-guia) -->
    <div class="dropdown pagina-ajuda" data-manual="trocas">
      <button type="button" class="botao botao--icone" aria-label="Ajuda desta tela" data-dica="Ajuda">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      </button>
      <div class="dropdown-menu pagina-ajuda-menu"></div>
    </div>
    <div class="abas" id="trocas-abas">
      <button type="button" class="aba aba--ativa" data-aba="todas">Todas</button>
      <button type="button" class="aba" data-aba="minhas">Minhas</button>
      <button type="button" class="aba" data-aba="saldos">Saldos</button>
      <!-- o que espera decisão sobre trocas (a mesma fila da página Pendências) -->
      <button type="button" class="aba" data-aba="pendencias">
        <span>Pendências</span>
        <span class="selo aba-contagem oculto" id="trocas-pendencias-contagem"></span>
      </button>
    </div>
  </div>

  <!-- barra de comandos: à esquerda as ações, em todas as abas (Solicitar troca, do militar;
       o grupo Administração, só admin); à direita a ferramenta Imprimir (o painel Imprimir trocas) -->
  <div class="pagina-subcabecalho">
    <button type="button" class="botao botao--primario" id="btn-solicitar-troca">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-trocas"/></svg>
      <span>Solicitar troca</span>
    </button>
    <!-- a administração registra a troca já aprovada, com a parte do E-protocolo -->
    <div class="dropdown acoes-admin oculto">
      <button type="button" class="botao acoes-admin-gatilho">
        <span>Administração</span>
        <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
      </button>
      <div class="dropdown-menu acoes-admin-menu">
        <span class="rotulo-secao acoes-admin-rotulo">Administração</span>
        <button type="button" class="botao" id="btn-registrar-troca">
          <span class="etiqueta-adm">ADM</span>
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg>
          <span>Registrar troca</span>
        </button>
      </div>
    </div>
    <span class="espacador-flex"></span>
    <button type="button" class="botao botao--quadrado" id="btn-imprimir-trocas" aria-label="Imprimir trocas" data-dica="Imprimir">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-imprimir"/></svg>
    </button>
  </div>

  <!-- Todas: árvore de unidades (as trocas ficam na unidade de quem solicitou) -->
  <div class="pagina-corpo pagina-corpo--camada" data-aba-painel="todas">
    <div class="pagina-corpo-rolagem">
      <div class="arvore arvore-unidades" id="trocas-arvore"></div>
    </div>
  </div>

  <!-- Minhas: lista das trocas em que eu entro (solicitante ou solicitado) -->
  <div class="pagina-corpo oculto" data-aba-painel="minhas">
    <div class="trocas-lista" id="trocas-minhas-lista"></div>
  </div>

  <!-- Saldos: as dívidas de horas entre militares (trocas sem devolução ou com devolução menor) -->
  <div class="pagina-corpo oculto" data-aba-painel="saldos">
    <p class="trocas-pendentes-descricao">As dívidas de horas entre militares. Clique numa para ver o histórico.</p>
    <div class="trocas-pendentes" id="trocas-pendentes-lista"></div>
  </div>

  <!-- Pendências: a troca que pediram a você e, para o administrador, as trocas para aprovar (componente geral-fila) -->
  <div class="pagina-corpo oculto" data-aba-painel="pendencias">
    <div class="pedido-secoes coluna-leitura">
      <div class="pedido-secao">
        <span class="rotulo-secao">Esperando sua resposta</span>
        <div class="pedido-lista" id="trocas-pendencias-minhas"></div>
      </div>
      <div class="pedido-secao oculto" id="trocas-pendencias-secao-aprovar">
        <span class="rotulo-secao">Para aprovar</span>
        <div class="pedido-lista" id="trocas-pendencias-aprovar"></div>
      </div>
    </div>
  </div>
</div>

<!-- molde: o Editar das trocas de uma (trocas-editar.js), as pedidas antes do formulário da troca (#tpl-troca-varias),
     montado no painel lateral. data-modo: os modos em que o campo aparece (editar = os dois militares da troca só em leitura) -->
<template id="tpl-troca-solicitar">
  <div class="troca-solicitar-form">
    <div class="grupo-caixa trocas-cartao">
      <span class="rotulo-secao">E-protocolo</span>
      <div class="trocas-protocolo">
        <label class="campo">
          <span class="campo-rotulo">Parte (opcional)</span>
          <input type="text" class="campo-entrada" id="ts-parte" inputmode="numeric" maxlength="7" autocomplete="off" />
          <span class="campo-erro-texto"></span>
        </label>
        <label class="campo">
          <span class="campo-rotulo">Ano</span>
          <input type="text" class="campo-entrada" id="ts-parte-ano" inputmode="numeric" maxlength="4" autocomplete="off" />
          <span class="campo-erro-texto"></span>
        </label>
      </div>
    </div>

    <div class="grupo-caixa trocas-cartao">
      <span class="rotulo-secao">Solicitante</span>
      <div class="campo" data-modo="solicitar">
        <span class="campo-rotulo">Unidade</span>
        <div class="campo-entrada campo-entrada--leitura" id="ts-minha-unidade"></div>
      </div>
      <div class="campo" data-modo="solicitar editar">
        <span class="campo-rotulo">Militar</span>
        <div class="campo-entrada campo-entrada--leitura" id="ts-meu-nome"></div>
      </div>
      <div class="campo oculto" data-modo="registrar">
        <span class="campo-rotulo">Unidade</span>
        <div class="dropdown" id="ts-sol-unidade-dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="ts-sol-unidade" aria-label="Unidade do solicitante">
            <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu" id="ts-sol-unidade-menu"></div>
        </div>
      </div>
      <div class="campo oculto" data-modo="registrar">
        <span class="campo-rotulo">Militar</span>
        <div class="dropdown campo-combo" id="ts-solicitante-dropdown">
          <input class="campo-entrada" id="ts-solicitante" type="text" maxlength="100" placeholder="Selecione a unidade antes" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="ts-solicitante-menu" aria-label="Militar solicitante" disabled />
          <svg class="icone seletor-seta campo-combo-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
          <div class="dropdown-menu" id="ts-solicitante-menu" role="listbox" aria-label="Militares"></div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <label class="campo">
        <span class="campo-rotulo">Dia do serviço</span>
        <input type="text" class="campo-entrada" id="ts-data" readonly placeholder="Escolher dia" />
        <span class="campo-erro-texto"></span>
      </label>
      <div class="campo trocas-periodo" id="ts-periodo-servico">
        <span class="campo-rotulo">Período</span>
        <div id="ts-servico-periodo"></div>
      </div>
    </div>

    <div class="grupo-caixa trocas-cartao">
      <span class="rotulo-secao">Solicitado</span>
      <div class="campo oculto" data-modo="editar">
        <span class="campo-rotulo">Militar</span>
        <div class="campo-entrada campo-entrada--leitura" id="ts-parceiro-nome"></div>
      </div>
      <div class="campo" data-modo="solicitar registrar">
        <span class="campo-rotulo">Unidade</span>
        <div class="dropdown" id="ts-unidade-dropdown">
          <button type="button" class="campo-entrada campo-selecao" id="ts-unidade" aria-label="Unidade">
            <span class="campo-selecao-texto campo-selecao-texto--vazio" id="ts-unidade-texto">Selecione</span>
            <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
          </button>
          <div class="dropdown-menu" id="ts-unidade-menu"></div>
        </div>
      </div>
      <div class="campo" data-modo="solicitar registrar">
        <span class="campo-rotulo">Militar</span>
        <div class="dropdown campo-combo" id="ts-parceiro-dropdown">
          <input class="campo-entrada" id="ts-parceiro" type="text" maxlength="100" placeholder="Escolha o dia antes" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="ts-parceiro-menu" aria-label="Militar" disabled />
          <svg class="icone seletor-seta campo-combo-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
          <div class="dropdown-menu" id="ts-parceiro-menu" role="listbox" aria-label="Militares"></div>
        </div>
        <span class="campo-erro-texto"></span>
      </div>
      <!-- devolução: Marcar dia (o padrão: o dia e o período do parceiro) ou Pendência (as horas ficam devidas) -->
      <div class="campo">
        <span class="campo-rotulo">Devolução</span>
        <div class="abas abas--seletor" id="ts-dev-toggle">
          <button type="button" class="aba aba--ativa" data-dev="dia">Marcar dia</button>
          <button type="button" class="aba" data-dev="pendente">Pendência</button>
        </div>
        <input type="text" class="campo-entrada trocas-dev-data" id="ts-dev-data" readonly placeholder="Dia do parceiro" />
        <span class="campo-erro-texto"></span>
      </div>
      <div class="campo trocas-periodo" id="ts-periodo-devolucao">
        <span class="campo-rotulo">Período da devolução</span>
        <div id="ts-dev-periodo"></div>
      </div>
      <div class="impacto-aviso impacto-aviso--alerta trocas-aviso oculto" id="ts-saldo">
        <svg class="icone impacto-aviso-icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-alerta"/></svg>
        <span class="impacto-aviso-textos"><span class="impacto-aviso-titulo" id="ts-saldo-texto"></span></span>
      </div>
      <!-- o solicitado ainda não tem conta (só no Solicitar): ninguém confirma, a troca vai direto para a aprovação -->
      <div class="impacto-aviso impacto-aviso--alerta trocas-aviso oculto" id="ts-sem-conta">
        <svg class="icone impacto-aviso-icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-alerta"/></svg>
        <span class="impacto-aviso-textos">
          <span class="impacto-aviso-titulo">Este militar ainda não tem conta no sistema.</span>
          <span class="impacto-aviso-desc">A troca vai direto para a aprovação do administrador.</span>
        </span>
      </div>
    </div>

    <!-- análise de impacto (no Registrar e no Editar do administrador): a mesma do Aprovar, desenhada pelo geral-impacto -->
    <div class="decisao-analise-secao oculto" id="ts-analise">
      <div class="decisao-analise-cabecalho">
        <span class="rotulo-secao">Análise</span>
        <span class="selo decisao-analise-selo oculto"></span>
      </div>
      <div class="impacto-analise decisao-analise"></div>
    </div>
  </div>
</template>

<!-- molde: o motivo da alteração, no fim do Editar das trocas aprovadas (trocas-painel-situacao.js); obrigatório quando os
     dias mudam (só a Parte não pede) -->
<template id="tpl-troca-motivo-alteracao">
  <div class="grupo-caixa">
    <span class="rotulo-secao">Motivo da alteração</span>
    <label class="campo">
      <textarea class="campo-entrada" rows="2" maxlength="200" aria-label="Motivo da alteração" placeholder="Ex.: o militar foi escalado para curso no dia"></textarea>
      <span class="campo-erro-texto"></span>
    </label>
    <span class="campo-ajuda">Obrigatório nas trocas aprovadas quando os dias mudam. Fica no registro das trocas e vai no aviso aos militares.</span>
  </div>
</template>

<!-- molde: ações do rodapé do Editar troca (Cancelar volta à leitura do painel) -->
<template id="tpl-troca-editar-acoes">
  <button type="button" class="botao" data-acao="cancelar">Cancelar</button>
  <button type="button" class="botao botao--primario" data-acao="salvar">Salvar</button>
</template>

<!-- molde: o formulário da troca (trocas-varias.js), no Solicitar troca, no Registrar troca e no Editar do registro;
     num registro só. Os militares da troca, o calendário dos dias (trocas-varias-calendario.js; em cada dia, quem
     trabalha e quem folga), o resumo que o banco monta (duplas, rodas e o que fica sem devolução), dia a dia, com o
     horário e o lápis (trocas-varias-resumo.js) e, no Registrar e no Editar do administrador de fora, a Análise
     (trocas-varias-registrar.js). data-modo: o texto de cada modo (solicitar = o militar pede; registrar = o
     admin registra; editar = o Editar do registro, trocas-varias-editar.js). A nota da alteração aparece pelo JS, quando
     o militar muda trocas aprovadas -->
<template id="tpl-troca-varias">
  <div class="trocas-varias">
    <div class="nota" data-modo="registrar editar">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      <span class="nota-texto" data-modo="registrar">As trocas entram já aprovadas, e cada militar aceita depois.</span>
      <span class="nota-texto" data-modo="editar">Os dias que já passaram ficam como estão.</span>
    </div>
    <div class="nota oculto" id="tv-nota-alteracao">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
      <span class="nota-texto">As trocas de antes continuam valendo até todos aceitarem a alteração e a administração aprovar.</span>
    </div>

    <div class="grupo-caixa trocas-cartao">
      <span class="rotulo-secao">E-protocolo</span>
      <div class="trocas-protocolo">
        <label class="campo">
          <span class="campo-rotulo">Parte (opcional)</span>
          <input type="text" class="campo-entrada" id="tv-parte" inputmode="numeric" maxlength="7" autocomplete="off" />
          <span class="campo-erro-texto"></span>
        </label>
        <label class="campo">
          <span class="campo-rotulo">Ano</span>
          <input type="text" class="campo-entrada" id="tv-parte-ano" inputmode="numeric" maxlength="4" autocomplete="off" />
          <span class="campo-erro-texto"></span>
        </label>
      </div>
    </div>

    <div class="grupo-caixa trocas-cartao">
      <span class="rotulo-secao">Militares da troca</span>
      <div class="trocas-varias-lista" id="tv-militares"></div>
      <span class="texto-leitor" id="tv-anuncio" role="status"></span>
      <div class="trocas-varias-adicionar">
        <div class="campo">
          <span class="campo-rotulo">Unidade</span>
          <div class="dropdown" id="tv-unidade-dropdown">
            <button type="button" class="campo-entrada campo-selecao" id="tv-unidade" aria-label="Unidade do militar">
              <span class="campo-selecao-texto campo-selecao-texto--vazio">Selecione</span>
              <svg class="icone seletor-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
            </button>
            <div class="dropdown-menu" id="tv-unidade-menu"></div>
          </div>
        </div>
        <div class="campo">
          <span class="campo-rotulo">Militar</span>
          <div class="dropdown campo-combo" id="tv-militar-dropdown">
            <input class="campo-entrada" id="tv-militar" type="text" maxlength="100" placeholder="Digite ou escolha" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="tv-militar-menu" aria-label="Militar" />
            <svg class="icone seletor-seta campo-combo-seta" width="12" height="12" aria-hidden="true"><use href="icones/todos.svg#icone-seta-baixo"/></svg>
            <div class="dropdown-menu" id="tv-militar-menu" role="listbox" aria-label="Militares"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grupo-caixa trocas-cartao">
      <span class="rotulo-secao">Dias da troca</span>
      <div class="trocas-varias-mes">
        <button type="button" class="botao botao--quadrado" id="tv-mes-anterior" aria-label="Mês anterior">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-seta-esquerda"/></svg>
        </button>
        <span id="tv-mes-nome"></span>
        <button type="button" class="botao botao--quadrado" id="tv-mes-proximo" aria-label="Próximo mês">
          <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
        </button>
      </div>
      <span class="campo-ajuda">Acesos: os dias em que um militar da troca está de serviço e outro está livre. Em cima, quem trabalha; riscado, quem folga.</span>
      <div class="nota" id="tv-dias-espera">
        <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-ajuda"/></svg>
        <span class="nota-texto" data-modo="solicitar">Adicione pelo menos um militar para ver os dias.</span>
        <span class="nota-texto oculto" data-modo="registrar editar">Adicione pelo menos dois militares para ver os dias.</span>
      </div>
      <div class="trocas-varias-cal" id="tv-calendario"></div>
    </div>

    <div class="grupo-caixa trocas-cartao" id="tv-resumo">
      <span class="rotulo-secao">Resumo das trocas</span>
      <span class="trocas-varias-vazio" id="tv-resumo-vazio">Marque os dias no calendário para ver as trocas.</span>
      <span class="trocas-varias-vazio oculto" id="tv-resumo-carregando"></span>
      <div class="trocas-varias-grupo oculto" id="tv-duplas">
        <span class="trocas-varias-grupo-titulo">Duplas</span>
        <ol class="trocas-varias-grupo-lista"></ol>
      </div>
      <div class="trocas-varias-rodas" id="tv-rodas"></div>
      <div class="trocas-varias-grupo oculto" id="tv-sem-devolucao">
        <span class="trocas-varias-grupo-titulo">Sem devolução</span>
        <ol class="trocas-varias-grupo-lista"></ol>
      </div>
      <div class="trocas-varias-notas" id="tv-notas"></div>
    </div>

    <!-- análise de impacto (no Registrar e no Editar do administrador de fora): a do registro inteiro, a mesma do Aprovar,
         desenhada pelo geral-impacto -->
    <div class="decisao-analise-secao oculto" id="tv-analise">
      <div class="decisao-analise-cabecalho">
        <span class="rotulo-secao">Análise</span>
        <span class="selo decisao-analise-selo oculto"></span>
      </div>
      <div class="impacto-analise decisao-analise"></div>
    </div>
  </div>
</template>

<!-- molde: um grupo de roda do resumo (cada roda é um grupo) -->
<template id="tpl-troca-varias-roda">
  <div class="trocas-varias-grupo">
    <span class="trocas-varias-grupo-titulo">Roda</span>
    <ol class="trocas-varias-grupo-lista"></ol>
  </div>
</template>

<!-- molde: um dia do resumo (trocas-varias-resumo.js): a data, quem trabalha no lugar de quem (o selo no dia da
     devolução da dupla), o horário sempre à vista e o lápis, que abre ali mesmo o "Serviço inteiro / Parte do serviço"
     (geral-horario) com o Pronto -->
<template id="tpl-troca-varias-linha">
  <li class="trocas-varias-linha">
    <span class="trocas-varias-linha-data">
      <span class="trocas-varias-linha-numero"></span>
      <span class="trocas-varias-linha-semana"></span>
    </span>
    <span class="trocas-varias-linha-textos">
      <span class="trocas-varias-linha-quem">
        <span><strong class="trocas-varias-linha-trabalha"></strong> no lugar de <strong class="trocas-varias-linha-folga"></strong></span>
        <span class="selo trocas-varias-linha-devolucao oculto">Devolução</span>
      </span>
      <span class="trocas-varias-linha-horario"></span>
    </span>
    <button type="button" class="botao botao--icone trocas-varias-linha-editar" aria-label="Editar horário" data-dica="Editar horário">
      <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-editar"/></svg>
    </button>
    <div class="trocas-varias-linha-editor oculto">
      <div class="trocas-varias-linha-periodo"></div>
      <div class="trocas-varias-linha-acoes">
        <button type="button" class="botao trocas-varias-linha-pronto">Pronto</button>
      </div>
    </div>
  </li>
</template>

<!-- molde: as notas do resumo (verde: tudo fechado; amarela: um saldo de horas) -->
<template id="tpl-troca-varias-nota-ok">
  <div class="nota nota--sucesso">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-sucesso"/></svg>
    <span class="nota-texto"></span>
  </div>
</template>
<template id="tpl-troca-varias-nota-saldo">
  <div class="nota nota--alerta">
    <svg class="icone" width="16" height="16" aria-hidden="true"><use href="icones/todos.svg#icone-alerta"/></svg>
    <span class="nota-texto"></span>

<!-- painel "Imprimir trocas" (trocas-imprimir.js; painel largo), em três caixas: 1. as trocas do mês para marcar
     (o seletor do mês, Marcar todas, a lista e a contagem); 2. o texto para a Parte (Informo | Solicito, a caixa do
     texto e o Copiar texto); 3. o PDF (Lista | Registro técnico | Alterações) com a prévia, que some no celular como nas grades -->
<template id="tpl-troca-imprimir">
  <div class="grupo-caixa">
    <span class="rotulo-secao">1. Trocas</span>
    <div class="geral-periodo trocas-imprimir-mes">
      <button type="button" class="botao botao--icone" aria-label="Mês anterior" data-imprimir-mes-anterior>
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-esquerda"/></svg>
      </button>
      <span class="geral-periodo-nome" data-imprimir-mes></span>
      <button type="button" class="botao botao--icone" aria-label="Próximo mês" data-imprimir-mes-proximo>
        <svg class="icone" width="14" height="14" aria-hidden="true"><use href="icones/todos.svg#icone-seta-direita"/></svg>
      </button>
    </div>
    <button type="button" class="arvore-linha escala-impressao-marcar" role="checkbox" aria-checked="true" data-imprimir-todas>
      <span class="caixa-selecao caixa-selecao--marcada" aria-hidden="true"><svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg></span>
      <span class="arvore-nome">Marcar todas</span>
    </button>
    <div class="trocas-imprimir-lista" data-imprimir-lista></div>
    <span class="campo-ajuda" data-imprimir-contagem></span>
  </div>
  <div class="grupo-caixa">
    <span class="rotulo-secao">2. Texto para a Parte</span>
    <div class="abas abas--seletor" data-imprimir-texto>
      <button type="button" class="aba aba--ativa" data-texto="informo">Informo</button>
      <button type="button" class="aba" data-texto="solicito">Solicito</button>
    </div>
    <span class="campo-ajuda" data-imprimir-texto-ajuda></span>
    <textarea class="campo-entrada trocas-imprimir-texto" readonly rows="4" aria-label="Texto para a Parte" data-imprimir-texto-caixa></textarea>
    <span class="campo-ajuda">Só o corpo da Parte. Cole no eProtocolo e assine lá.</span>
    <button type="button" class="botao trocas-imprimir-copiar" data-imprimir-copiar>Copiar texto</button>
  </div>
  <div class="grupo-caixa">
    <span class="rotulo-secao">3. PDF</span>
    <div class="abas abas--seletor" data-imprimir-formato>
      <button type="button" class="aba aba--ativa" data-formato="lista">Lista</button>
      <button type="button" class="aba" data-formato="registro">Registro técnico</button>
      <button type="button" class="aba" data-formato="alteracoes">Alterações</button>
    </div>
    <span class="campo-ajuda" data-imprimir-formato-ajuda></span>
    <div class="escala-impressao-previa-secao">
      <div class="escala-impressao-previa">
        <iframe class="escala-impressao-previa-quadro" title="Prévia do PDF" data-imprimir-previa></iframe>
        <span class="painel-estado escala-impressao-previa-aviso oculto" data-imprimir-previa-aviso></span>
        <div class="carregando-veu" data-imprimir-previa-carregando>
          <div class="giratorio" aria-label="Carregando" role="status"></div>
        </div>
      </div>
    </div>
  </div>
</template>
<template id="tpl-troca-imprimir-acoes">
  <button type="button" class="botao" data-imprimir-cancelar>Cancelar</button>
  <button type="button" class="botao botao--primario" data-imprimir-gerar>Gerar PDF</button>
</template>
<!-- uma troca da lista do painel Imprimir trocas: a caixa de marcar e, como na linha da lista (tpl-troca-item), os

<template id="tpl-troca-imprimir-item">
  <button type="button" class="arvore-linha escala-impressao-marcar trocas-imprimir-item" role="checkbox" aria-checked="true">
    <span class="caixa-selecao caixa-selecao--marcada" aria-hidden="true"><svg class="icone" width="10" height="10" aria-hidden="true"><use href="icones/todos.svg#icone-check"/></svg></span>

    </span>

    <span class="selo troca-item-situacao"></span>
  </button>

<!-- passo a passo do ? (componente geral-guia): cada <p> é um passo; data-alvo é o que fica destacado,
     data-avanca diz como ele avança (clique · preenchido · proximo · some) e o data-fim é o balão final -->
<template data-guia="trocas-pedir" data-titulo="Como pedir uma troca">
  <p data-alvo="#btn-solicitar-troca" data-avanca="clique">Comece pelo botão <strong>Solicitar troca</strong>.</p>
  <p data-alvo="#tv-parte" data-anel="campo" data-avanca="proximo">Se a troca já tem parte no eProtocolo, digite o número. Se ainda não tem, deixe em branco.</p>
  <p data-alvo="#tv-unidade, #tv-militar" data-anel="campo" data-avanca="proximo">Escolha a unidade e o colega da troca. Ele entra na lista. Se a troca tem mais gente, adicione os outros.</p>
  <p data-alvo="#tv-calendario" data-avanca="proximo">Clique no dia da troca. Em cima aparece quem trabalha e, riscado, quem folga. Se já combinaram a devolução, marque o dia dela também; se não, você fica devendo as horas.</p>
  <p data-alvo="#tv-resumo" data-avanca="proximo">Confira o resumo. Para trocar só uma parte do serviço, clique no lápis do dia e escolha o horário.</p>
  <p data-alvo=".painel-lateral--aberto [data-acao='solicitar-varias']" data-avanca="some" data-condicao=".painel-lateral--aberto .trocas-varias">Confira e envie pelo botão <strong>Solicitar troca</strong>.</p>
  <p data-fim>Pronto. Os colegas recebem o pedido e aceitam. Depois, o administrador aprova. Acompanhe na aba <strong>Minhas</strong>.</p>
</template>
