<div class="pagina">
  <div class="pagina-cabecalho">
    <div class="pagina-titulos">
      <h1>Pendências</h1>
      <span class="pagina-titulo-contagem" id="pendencias-contagem"></span>
    </div>
    <!-- as abas só aparecem para o administrador (o militar comum só tem "Para mim") -->
    <div class="abas oculto" id="pendencias-abas">
      <button type="button" class="aba aba--ativa" data-aba="paramim">
        <span>Para mim</span>
        <span class="selo aba-contagem oculto" id="pendencias-paramim-contagem"></span>
      </button>
      <button type="button" class="aba" data-aba="administracao">
        <span>Administração</span>
        <span class="selo aba-contagem oculto" id="pendencias-administracao-contagem"></span>
      </button>
    </div>
  </div>

  <!-- barra de comandos (só administrador): o seletor do tipo de pedido, na aba Administração -->
  <div class="pagina-subcabecalho pendencias-barra oculto" id="pendencias-barra">
    <div class="abas abas--seletor oculto" id="pendencias-filtro">
      <button type="button" class="aba aba--ativa" data-tipo="todos">Todos</button>
      <button type="button" class="aba" data-tipo="troca">Trocas</button>
      <button type="button" class="aba" data-tipo="folga">Folgas</button>
      <button type="button" class="aba" data-tipo="usuarios">Usuários</button>
    </div>
  </div>

  <div class="pagina-corpo">
    <!-- o que espera você como militar -->
    <div class="pedido-secoes coluna-leitura" data-aba-painel="paramim">
      <div class="pedido-secao">
        <span class="rotulo-secao">Esperando sua resposta</span>
        <div class="pedido-lista" id="pendencias-minhas"></div>
      </div>
      <!-- o que você responde até uma data (ex.: a extra do mês seguinte); só aparece quando há -->
      <div class="pedido-secao oculto" id="pendencias-secao-prazos">
        <span class="rotulo-secao">Prazos</span>
        <div class="pedido-lista" id="pendencias-prazos"></div>
      </div>
      <!-- o que falta no seu cadastro (ex.: a CNH); só aparece quando há -->
      <div class="pedido-secao oculto" id="pendencias-secao-cadastro">
        <span class="rotulo-secao">Seu cadastro</span>
        <div class="pedido-lista" id="pendencias-cadastro"></div>
      </div>
    </div>

    <!-- só administrador: o que espera a decisão dele e o que precisa de conserto -->
    <div class="pedido-secoes coluna-leitura oculto" data-aba-painel="administracao">
      <div class="pedido-secao">
        <span class="rotulo-secao">Para aprovar</span>
        <div class="pedido-lista" id="pendencias-aprovar"></div>
      </div>
      <div class="pedido-secao" id="pendencias-secao-corrigir">
        <span class="rotulo-secao">Para corrigir</span>
        <div class="pedido-lista" id="pendencias-corrigir"></div>
      </div>
    </div>
  </div>

  <!-- a lista sem nada usa o molde do cartão de pedido (#tpl-pedido-vazio, no shell) -->

  <!-- "para corrigir" que leva à tela do conserto (ex.: a Distribuição a revisar) -->
  <template id="tpl-pendencias-corrigir">
    <button type="button" class="pendencias-corrigir">
      <span class="selo selo--alerta pendencias-corrigir-contagem"></span>
      <span class="pendencias-corrigir-texto"></span>
      <span class="espacador-flex"></span>
      <svg class="icone pendencias-corrigir-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg>
    </button>
  </template>

  <!-- prazo seu ou o que falta no seu cadastro: o texto, o detalhe embaixo e a seta (leva aonde se responde) -->
  <template id="tpl-pendencias-prazo">
    <button type="button" class="pendencias-corrigir">
      <span class="pendencias-prazo-textos">
        <span class="pendencias-corrigir-texto"></span>
        <span class="pendencias-prazo-mensagem"></span>
      </span>
      <span class="espacador-flex"></span>
      <svg class="icone pendencias-corrigir-seta" width="14" height="14" aria-hidden="true"><use href="icones/icone-seta-direita.svg#icone-seta-direita"/></svg>
    </button>
  </template>

  <!-- "operacional fora da escala": a contagem e a lista de nomes (não navega: o conserto é no Contínuos) -->
  <template id="tpl-pendencias-fora">
    <div class="pendencias-corrigir pendencias-corrigir--lista">
      <div class="pendencias-corrigir-cab">
        <span class="selo selo--alerta pendencias-corrigir-contagem"></span>
        <span class="pendencias-corrigir-texto"></span>
      </div>
      <ul class="pendencias-corrigir-itens"></ul>
    </div>
  </template>
  <template id="tpl-pendencias-fora-item">
    <li class="pendencias-corrigir-item">
      <span class="pendencias-corrigir-grad"></span>
      <span class="pendencias-corrigir-nome"></span>
      <span class="pendencias-corrigir-unidade"></span>
    </li>
  </template>

  <!-- "retorno de afastamento sem entrada no ciclo": a contagem e a lista de nomes com a volta (não navega: a entrada se marca no Contínuos) -->
  <template id="tpl-pendencias-retorno">
    <div class="pendencias-corrigir pendencias-corrigir--lista">
      <div class="pendencias-corrigir-cab">
        <span class="selo selo--alerta pendencias-corrigir-contagem"></span>
        <span class="pendencias-corrigir-texto"></span>
      </div>
      <ul class="pendencias-corrigir-itens"></ul>
    </div>
  </template>
  <template id="tpl-pendencias-retorno-item">
    <li class="pendencias-corrigir-item">
      <span class="pendencias-corrigir-grad"></span>
      <span class="pendencias-corrigir-nome"></span>
      <span class="pendencias-corrigir-volta"><span class="pendencias-corrigir-motivo"></span>, volta em <span class="pendencias-corrigir-data"></span></span>
      <span class="pendencias-corrigir-unidade"></span>
    </li>
  </template>

</div>
